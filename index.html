ion is D, S ⊨ R, and R, D ⊨ G).</td></tr>\n<tr><td><b>Enterprise 23, 26, 39–40</b> (UML class diagram correctness; possible association class)</td><td>Class diagram notation: association, multiplicity, generalization, association class; a diagram to judge correct / incorrect</td><td>Check: names on classes, multiplicity on each end, generalization arrowhead pointing to the superclass, association class dashed to the association line. Say <i>why</i> a diagram is wrong. (M02 UML deck was not provided: share it for slide-exact practice.)</td></tr>\n<tr><td><b>CSPS Vision p. 2</b> (problem statement)</td><td>“Keeping current on collegiate sports events” is given as the problem</td><td>That is a <b>desired goal</b>, not the existing difficulty. Rewrite: “The problem of <i>users not being able to easily keep current with the events they care about</i> affects … the impact of which … a successful solution would …”.</td></tr>\n<tr><td><b>Structured Analysis 22</b> (Structured English)</td><td>Loans-at-risk: for each CUSTOMER NUMBER in CUSTOMERS, for each matching LOAN keep running totals (NUMBER OF LOANS, ORIGINAL LOAN PRINCIPAL, CURRENT LOAN BALANCE, AMOUNTS PAST DUE); if total amounts past due &gt; $100.00 write customer and attributes to LOANS AT RISK, else exclude.</td><td>Be able to fill blanks: the data stores (CUSTOMERS, LOANS), the four running totals, the $100.00 condition, the output flow LOANS AT RISK, and the If/Else.</td></tr>\n<tr><td><b>Structured Analysis 30</b> (SADT arrow semantics, actigram)</td><td>Mechanism = processor (machine, computer, person) that makes the activity happen; Controls influence execution but are <b>not consumed</b>; Outputs are produced by the activity; Inputs are data <b>consumed</b></td><td>ICOM: Input left, Control top, Output right, Mechanism bottom.</td></tr>\n<tr><td><b>IDEF0 process specification</b> (3 pts)</td><td>“Develop Requirements” box: User (input); Templates/standards (control); RE-Tools (mechanism); WRS doc + Vision doc (outputs); children Develop Phase I / Phase II</td><td>Label every ICOM arrow; verbs in boxes, nouns on arrows; 3–6 boxes per diagram.</td></tr>\n<tr><td><b>NFR 40</b> (professor’s ≈44)</td><td>Softgoal interdependency graph with softgoal types (NFR, operationalizing, claim), AND/OR decomposition, contribution types Make &gt;&gt; Help &gt;&gt; Hurt &gt;&gt; Break, and labels (satisficed, denied, conflicting, undetermined); Accuracy[Acct] with Gold/Premier/Regular accounts</td><td>Know the notation, <code>Type[Topic]</code> names, and what each label/arrow means.</td></tr>\n<tr><td><b>NFR 41–42</b> (convert plain English into a graph, possibly 8 pts)</td><td>In the PDF these are Quality Function Deployment slides; the plain-English → SIG exercise is the slide with the “Qualitative in nature, process oriented” graph (Secure Accounts → Integrity / Confidentiality / Availability; Integrity → Complete / Accurate) and the SIG construction slide</td><td>Procedure: write the top NFR softgoal <code>Type[Topic]</code>; refine by sub-type/topic (AND/OR); add operationalizing softgoals; add claims for justification; mark contributions (++, +, −, −−); then evaluate.</td></tr>\n<tr><td><b>NFR 58</b> (label a SIG, possibly 6 pts)</td><td>“Evaluation thru label propagation”: leaves labeled ✓ satisficed, ✗ denied, conflicting (lightning), U undetermined; Make/Help/Hurt/Break arrows; AND/OR links; the “healthy elixir / bomb” quiz</td><td>Propagate bottom-up: Make = same label as child, Break = opposite; Help/Hurt = weaker (may only give undetermined/conflicting unless otherwise supported); AND = weakest child; OR = strongest child.</td></tr>\n<tr><td><b>KAOS 3–6</b> (3 pts dog-eared rectangle; 2 pts liveness/safety; slide 5 symbol)</td><td>Goal shape (parallelogram), requirement vs expectation (bold outline = assigned to a single agent), temporal operators: ◊ (eventually), □ (always); patterns Achieve P ⇒ ◊Q, Maintain □(P ⇒ Q), Avoid □(P ⇒ ¬Q)</td><td><b>Liveness</b>: something good eventually happens (◊), e.g. a requested train eventually gets a movement authority. <b>Safety</b>: something bad never happens (□), e.g. two trains are never on the same block. Dog-eared rectangle = the notation for the item shown on the slide; confirm on your slide copy.</td></tr>\n<tr><td><b>Metamodel 3–5</b></td><td>Instance / class / metaclass; M0–M3 levels (MOF, UML, OCL)</td><td>Say which level each element belongs to.</td></tr></table>\n\n<h2 id=\"cheat\">15. Quick-recall cheat sheet</h2>\n<table><tr><th>Question</th><th>One-line answer</th></tr>\n<tr><td>Formula for requirements and goals?</td><td>D, S ⊨ R and R, D ⊨ G (goals counter the problem P).</td></tr>\n<tr><td>Define a problem.</td><td>TO-BE − AS-IS (gap between current state and desired goals).</td></tr>\n<tr><td>Nine requirement qualities?</td><td>Correct, complete, consistent, unambiguous, verifiable, ranked, modifiable, traceable, understandable.</td></tr>\n<tr><td>Four tenets of JAD?</td><td>Group dynamics, visual aids, organized rational process, WYSIWIG documentation.</td></tr>\n<tr><td>Sampling tasks?</td><td>Data determination, population, type (purposive/random), sample size.</td></tr>\n<tr><td>Three domain types / two phenomena types?</td><td>Causal, biddable, lexical / causal, symbolic.</td></tr>\n<tr><td>Five problem frames?</td><td>Required behavior, commanded behavior, information display, simple workpieces, transformation.</td></tr>\n<tr><td>Types of scenarios?</td><td>As-is, visionary, evaluation, training; (forms: use cases, episodes, scripts, CRC).</td></tr>\n<tr><td>Scenario question types?</td><td>What-if, who, what-kind-of, when, how-to, why.</td></tr>\n<tr><td>Three pruning sets?</td><td>Discarded, selected, undecided.</td></tr>\n<tr><td>include vs extend vs generalization?</td><td>Mandatory reuse/decomposition vs optional extension vs inherited specialization.</td></tr>\n<tr><td>DFD elements &amp; rules?</td><td>Process, dataflow, store, external entity; unique names, no control/decisions, leveling preserves I/O.</td></tr>\n<tr><td>IDEF0 ICOM positions?</td><td>Input left, Control top, Output right, Mechanism bottom; 3–6 boxes per diagram; verbs in boxes, nouns on arrows.</td></tr>\n<tr><td>IDEF0 model must declare?</td><td>Context (boundary), Viewpoint, Purpose.</td></tr>\n<tr><td>KAOS goal patterns?</td><td>Achieve (P→◊Q), Maintain (□(P→Q)), Avoid (□(P→¬Q)).</td></tr>\n<tr><td>Requirement vs expectation (KAOS)?</td><td>Software agent vs environment agent responsibility.</td></tr>\n<tr><td>i* models?</td><td>SD (actor dependencies: goal, softgoal, resource, task) and SR (internal rationale: task decomposition, means-ends).</td></tr>\n<tr><td>NFR four properties?</td><td>Non-functional, subjective, graded, interacting (and relative).</td></tr>\n<tr><td>SIG contribution/label types?</td><td>Make, Help, Hurt, Break (+U) / satisficed, denied, conflicting, undetermined.</td></tr>\n<tr><td>Availability formula?</td><td>MTTF / (MTTF + MTTR) × 100%.</td></tr>\n<tr><td>Forward vs backward traceability?</td><td>Requirement → work products/tests vs work product/requirement → origin.</td></tr>\n<tr><td>Why was the London Ambulance system a failure (RE view)?</td><td>NFRs (timeliness, resilience), organizational and SE mistakes; calls ≠ incidents; poor geography/resource tracking; no early NFR consideration.</td></tr></table>\n<p class=\"src\">Compiled from the attached course slides. Where a slide was image-only, details were taken from the rendered slide thumbnails and may be abbreviated – skim the originals for diagrams you plan to redraw.</p>\n","focus":[{"lesson":"structured-english","title":"Structured English table","note":"Constructs, loans at risk, decision rules."},{"lesson":"rup","title":"RUP","note":"Four phases and requirements artifacts."},{"lesson":"uml-erd","title":"ERD vs. class diagram","note":"Comparison and notation checks."},{"lesson":"elicitation-question","title":"The elicitation question","note":"Ethnomethodology + three applications."},{"lesson":"sig","title":"NFR Framework (SIG)","note":"Build a graph, reason about labels."},{"lesson":"formalizable-goals","title":"Formalizable goals of KAOS","note":"Achieve, Cease, Maintain and Avoid."}],"sources":[{"id":"kaos","filename":"KAOS-AORE (1).pdf","pages":[{"page":1,"text":"Goal-Oriented Requirements Engineering (GORE) : KAOS\n©Lawrence Chung\nAgent-Oriented Requirements Engineering (AORE) : i*\n","lesson":"kaos","title":"Goal-Oriented Requirements Engineering (GORE) : KAOS"},{"page":2,"text":"©Lawrence Chung\nIn philosophy, ontology is the study of being or existence. It seeks to describe or posit the \nbasic categories and relationships of being or existence to define entities and types of entities\nwithin its framework. Ontology can be said to study conceptions of reality. http://en.wikipedia.org/wiki/Ontology\n","lesson":"kaos","title":"In philosophy, ontology is the study of being or existence. It seeks to describe or posit the"},{"page":3,"text":"\u0001\nBackground\n\u0002\nDeveloped in the early 90’s\n\u0002\nfirst major teleological requirements modeling language\n\u0002\nfull tool support available\n\u0002\nhas been applied to a number of industrial case studies\n\u0001\nTwo parts:\n\u0002\nSemi-formal goal structuring model\n\u0002\nFormal definitions for each entity in (linear) temporal logic\n\u0003 Liveness – Maintain: □(P→Q), Achieve: P→ ◊Q\n[Dardenne, van Lamsweerde and Fickas, “Goal-directed Requirements Acquisition,”\nScience of Computer Programming, 20, pp. 3-50] \nKAOS\n©Lawrence Chung\n(\n),\n\u0003 Safety – Avoid: □(P→ ¬ Q)\n\u0001\nApproach\n\u0002\nMethod focuses on goal elaboration:\n\u0002\ndefine initial set of high level goals & objects they refer to\n\u0002\ndefine initial set of agents and actions they are capable of\n\u0002\nThen iteratively:\n\u0002\nrefine goals using AND/OR decomposition\n\u0002\nidentify obstacles to goals, and goal conflicts\n\u0002\noperationalize goals into constraints (or sw requirements) that can be assigned to individual agents\n\u0002\nrefine & formalize definitions of objects & actions\n\u0002\nGoal refinement ends when every subgoal is realizable by some individual agent assigned to it, that\nis, expressible in terms of conditions that are monitorable and controllable by the agent.\n□: necessary\ne.g., □Fp\n◊: possible\ne.g., ◊Fp\n","lesson":"kaos","title":"\u0001"},{"page":4,"text":"\u0002\nA goal is a prescriptive statement of intent about some system (existing or to-\nbe) whose satisfaction in general requires the cooperation of some of the\nagents forming that system (= software and environment).\n\u0002\nDomain properties are descriptive statements about the environment .e.g.,\nphysical laws, organizational norms, etc.\n\u0002\nA requirement is a realizable goal under responsibility of an agent in the\nsoftware-to-be (expressed in terms of monitored and controlled objects);\n\u0002\nAn expectation is a realizable goal under responsibility of an agent in the\ni\nt (\nlik\ni\nt\nt ti\nt b\nf\nd b\nth\nIf R denotes the set of requirements, \nA\nth\nt\nf\nti\nKAOS\n©Lawrence Chung\nenvironment (unlike requirements, expectations cannot be enforced by the\nsoftware-to-be).\n\u0002\nAn operation is an input-output relation over objects\n\u0002\nThe state of the system (software or environment) is defined by aggregation of\nthe states of its objects. An object model is represented by a UML class\ndiagram.\nAs the set of assumptions (expectations),\nS the set of software specifications, \nAc the set of accuracy goals, and \nG the set of goals, \nthe following satisfaction relations\nmust hold:\nAlthough both optative, requirements are to be enforced by the software whereas \nassumptions/expectations  can be enforced by agents in the environment only\n","lesson":"kaos","title":"\u0002"},{"page":5,"text":"KAOS: Automated Train Control System Example\n[A. van Lamsweerde, \"Requirements engineering in the year 00: a research perspective\", Proc., 22nd ICSE'00, pp5-19. IEEE Computer Society Press] \nObject model\nwww.straighttrack.org \nEliciting new goals through WHY questions\nor\nconflict\nsoftgoals\n©Lawrence Chung\nEliciting new goals through HOW questions\nformalizable goals\nworst case stopping\n","lesson":"kaos-train","title":"KAOS: Automated Train Control System Example"},{"page":6,"text":"KAOS: Automated Train Control System Example\nAgent interfaces\nOperations, Operationalizations\nmonitored\ncontrolled\nmonitored\ncontrolled\nGoals refer to specific state transitions; Operations causing them are\nwhy?\nhow?\nh\n?\n©Lawrence Chung\nStrengthen domain conditions so that the various goals linked to \nthe operation are ensured. For goals assigned to software agents, \nthis step produces requirements on the operations for the \ncorresponding goals to be achieved.\nGoals refer to specific state transitions; Operations causing them are \nexpressed by domain pre- and postconditions. For Maintain[SafeCmdMsg]:\nhow?\nhow?\n","lesson":"kaos-train","title":"KAOS: Automated Train Control System Example"},{"page":7,"text":"KAOS: Automated Train Control System Example\n[A. van Lamsweerde, \"Requirements engineering in the year 00: a research perspective\", Proc., 22nd ICSE'00, pp5-19. IEEE Computer Society Press] \nConflicting Goals:\nB\nd\nditi\nf\nl\ni\nl i\ni t\n©Lawrence Chung\nConflicts\nBoundary condition for logical inconsistency\nConflict resolution:\ne.g., keep the safety goal and weaken the other\n","lesson":"kaos-train","title":"KAOS: Automated Train Control System Example"},{"page":8,"text":"Goal-Oriented Requirements Engineering (GORE) : KAOS\n©Lawrence Chung\nAgent-Oriented Requirements Engineering (AORE) : i*\n","lesson":"istar-case","title":"Goal-Oriented Requirements Engineering (GORE) : KAOS"},{"page":9,"text":"M. Hammer, Reengineering Work: Don't Automate, Obliterate, Harvard Business Review,  July-August 1990]\nReengineering Work: Don't Automate, Obliterate\n9\nIs the system, to be implemented according to the SRS, going to be helpful or harmful?\nHow do we come up with the SRS?\n","lesson":"istar-case","title":"M. Hammer, Reengineering Work: Don't Automate, Obliterate, Harvard Business Review, July-August 1990]"},{"page":10,"text":"•\nAlso see:\nhttps://www.utdallas.edu/~chung/SYSM6309/SYSM6309-Spring2012-\nPresentations/taraneh-Presentation1-case study.pptx\nReengineering Work: Don't Automate, Obliterate\n10\n","lesson":"istar-case","title":"•"},{"page":11,"text":"11\n","lesson":"istar-case","title":"Visual class example"},{"page":12,"text":"Background\n\u0001developed in the early 90’s\nprovides a structure for asking ‘why’ questions in RE\nmodels the organizational context for information systems\nbased on the notion of an “intentional actor”\nTwo parts to the model\ni*\n12\n\u0001Strategic dependency (SD) model - models relationships between the actors\n\u0001 goal/softgoal dependency - an actor depends on another actor to attain a goal\n\u0001 resource dependency - an actor needs a resource from another actor\n\u0001 task dependency - an actor needs another actor to carry out a task\n\u0001Strategic rationale (SR) model - models concerns and interests of the actors\n\u0001Shows task decompositions\n\u0001Shows means-ends links between tasks and goals\n","lesson":"istar-case","title":"Background"},{"page":13,"text":"13\nCan you represent this in UML?\n","lesson":"istar-case","title":"Can you represent this in UML?"},{"page":14,"text":"Strategic Dependency Model\n14\n","lesson":"istar-case","title":"Strategic Dependency Model"},{"page":15,"text":"Strategic Rationale Model\n15\n","lesson":"istar-case","title":"Strategic Rationale Model"},{"page":16,"text":"Appendix I\n©Lawrence Chung\n","lesson":"formalizable-goals","title":"Appendix I"},{"page":17,"text":"KAOS: Temporal Logic\nPp\n◊t(t<now ∧p(t))\nFp\n◊t(now<t ∧p(t))\nHp\n∀t(t<now → p(t))\nGp\n∀t(now<t → p(t))\nPrior’s Tense logic\nMaintain, Avoid: “always” goals \nAchieve: “eventually”\n“=>“: logical implication (the two below are the same)\n©Lawrence Chung\np\n(\np( ))\n□: necessary\ne.g., □Fp\n◊: possible\ne.g., ◊Fp\nmore in the module on Model Checking\nSpqq has been true \nsince a time when p was true\nUpqq will be true \nuntil a time when p is true\nExtensions to Tense Logic\n","lesson":"formalizable-goals","title":"KAOS: Temporal Logic"}],"count":17,"title":"KAOS & agent-oriented RE"},{"id":"struct","filename":"Structured-Analysis.pdf","pages":[{"page":1,"text":"1\nRequirements \nEngineering\nSemi-Formal Specification:\nStructural Functional Requirements – Structured Analysis\n\u0001Data Flow Diagrams\n\u0001SADT\n\u0001IDEF0\n","lesson":"dfd","title":"Requirements"},{"page":2,"text":"2\nTypes of Requirements along different views\n\u0002\nFunctional Requirements (FRs)\n\u0002 Structural Functional Requirements\n\u0002 Functional, i.e., Function-oriented\n\u0002 Informational. i.e., Information-oriented\n\u0002 Behavioral Functional Requirements\n\u0002\nNon-Functional Requirements (NFRs)\n","lesson":"dfd","title":"Types of Requirements along different views"},{"page":3,"text":"3\nFunction Oriented Problem Analysis\n\u0002\nCreates a hierarchy of functions\n\u0002 Also called (process, activity, work-step, transactions, transforms, \nbubbles)\n\u0002\nRoot is most abstract\n\u0002\nLeaf nodes the most detailed\n\u0002\nMost methods use data flow diagrams and dictionaries\n\u0002\nExamples\n\u0002 SRD structured requirements definition\n\u0002 SADT\n\u0002 Information Engineering\n\u0002 Modern structured Analysis\n\u0002 Problem statement Language\n","lesson":"dfd","title":"Function Oriented Problem Analysis"},{"page":4,"text":"4\nProcess Modeling\nA data flow diagram (DFD) is a tool (and type of \nprocess model) that depicts the flow of data through \na system and the work or processing performed by \nthat system. \nDFDs have become a popular tool for business process \nredesign.\n","lesson":"dfd","title":"Process Modeling"},{"page":5,"text":"5\nData Flow Diagrams\n\u0002\nExisted long before computers\n\u0002\nShow the flow of data through a system\n\u0002\nSystem\n\u0002 Organization\n\u0002\nCompany\n\u0002 A computer hardware system\n\u0002 A software system\n\u0002\nIcons\n\u0002 Data on the move – named arrows\n\u0002 Transformations of data – named bubbles\n\u0002 Sources and destinations of data – named rectangles (terminators)\n\u0002 Data in static storage – two parallel lines\n","lesson":"dfd","title":"Data Flow Diagrams"},{"page":6,"text":"6\nData Flow Diagram Notations \nYourdon and Coad\nProcess Notations\nGane and Sarson\nProcess Notation\nYourdon and Coad\nDatastore Notation\nGane and Sarson\nDatastore Notations\nProcess\nA process transforms incoming \ndata flow into outgoing data flow. \nData Store\nData stores are repositories of \ndata in the system. They are \nsometimes also referred to as \nfiles. \nDataflow\nDataflows are pipelines \nthrough which packets of \ninformation flow. Label the \narrows with the name of the \ndata that moves through it. \nExternal Entity\nExternal entities are objects outside the \nsystem, with which the system \ncommunicates. External entities are \nsources and destinations of the system's \ninputs and outputs. \n","lesson":"dfd","title":"Data Flow Diagram Notations"},{"page":7,"text":"7\nDataFlow Diagrams\n","lesson":"dfd","title":"DataFlow Diagrams"},{"page":8,"text":"8\nData Flow Diagram Layers\n\u0002\nData flow diagrams are drawn in several nested layers\n\u0002\nA single process node on a high level diagram can be expanded to\nshow a more detailed data flow diagram. \n\u0002\nDraw the context diagram first, followed by various layers of data flow \ndiagrams.\n","lesson":"dfd","title":"Data Flow Diagram Layers"},{"page":9,"text":"9\nContext Diagrams\n\u0002\nA context diagram is a top level (also known as Level 0) data flow diagram. It only contains one process \nnode (process 0) that generalizes the function of the entire system in relationship to external entities. \n","lesson":"dfd","title":"Context Diagrams"},{"page":10,"text":"10\nDFD levels \nThe first level DFD shows the main processes within the \nsystem. Each of these processes can be broken into \nfurther processes until you reach pseudocode. \n","lesson":"dfd","title":"DFD levels"},{"page":11,"text":"11\nContext Diagram- Registration\n","lesson":"dfd","title":"Context Diagram- Registration"},{"page":12,"text":"12\nLevel 0 Data Flow Diagram\n","lesson":"dfd","title":"Level 0 Data Flow Diagram"},{"page":13,"text":"13\nExplosion of Process 4\n","lesson":"dfd","title":"Explosion of Process 4"},{"page":14,"text":"14\nData Flow Diagrams\n\u0002\nRules\n\u0002 All names must be unique\n\u0002 Not a flow chart – no order implied\n\u0002 No logical decisions \n\u0002 Don’t get bogged down in detail\n\u0002\nLeveling\n\u0002 Preserve the number of inputs and outputs between the levels\nA\nI1\nI2\nO1\nA1\nA2\nA3\nI1\nI2\nO1\ndata\n","lesson":"dfd","title":"Data Flow Diagrams"},{"page":15,"text":"15\nDifference between DFD  and Flowcharts\n\u0002 Processes on DFDs can operate in parallel (at-the-same-time)\n\u0002 Processes on flowcharts execute one at a time\n\u0002 DFDs show the flow of data through a system\n\u0002 Flowcharts show the flow of control (sequence and transfer \nof control)\n\u0002 Processes on one DFD can have dramatically different timing\n\u0002 Processes on flowcharts are part of a single program with \nconsistent timing\n","lesson":"dfd","title":"Difference between DFD and Flowcharts"},{"page":16,"text":"16\nHomework -\n\u0002 Draw a DFD for an ATM\n","lesson":"dfd","title":"Homework -"},{"page":17,"text":"17\nIllegal Data Flows\nCopyright © 2000 The McGraw-Hill Companies. All Rights reserved\n","lesson":"dfd","title":"Illegal Data Flows"},{"page":18,"text":"18\nStructured English context\nConstruct \nSample Template \nSequence of steps – unconditionally perform a \nsequence of steps. \n[ Step 1 ] \n[ Step 2 ] \n… \n[ Step n ] \nSimple condition steps – if the specified \ncondition is true, then perform the first set of \nsteps.  Otherwise, perform the second set of \nsteps. \nUse this construct if the condition has only two \npossible values. \n(Note:  The second set of conditions is optional.) \nIf  [ truth condition ] \n \nthen \n \n \n[ sequence of steps or other conditional steps ] \n \nelse \n \n \n[ sequence of steps or other conditional steps ] \nEnd If \nComplex condition steps – test the value of the \ncondition and perform the appropriate set of \nsteps. \nUse this construct if the condition has more than \ntwo values. \nDo the following based on [ condition ]: \n \nCase 1: If [ condition] = [value] then \n \n \n[ sequence of steps or other conditional steps ] \n \nCase 2: If [ condition] = [value] then \n \n \n[ sequence of steps or other conditional steps ] \n \n… \n \nCase n: If [ condition] = [value] then \n \n \n[ sequence of steps or other conditional steps ] \nEnd Case \nCopyright © 2000 The McGraw-Hill Companies. All Rights reserved\n","lesson":"structured-english","title":"Structured English context"},{"page":19,"text":"19\nStructured English Rules\nMultiple conditions – test the value of multiple \nconditions to determine the correct set of steps. \nUse a decision table  instead of nested if-then-\nelse Structured English constructs to simplify the \npresentation of complex logic that involves \ncombinations of conditions. \nA decision table is a tabular presentation of \ncomplex logic in which rows represent conditions \nand possible steps, and columns indicate which \ncombinations of conditions result in specific steps.\n DECISION TABLE\nRule\nRule\nRule\nRule\n [ Condition ]\nvalue\nvalue\nvalue\nvalue\n [ Condition ]\nvalue\nvalue\nvalue\nvalue\n [ Condition ]\nvalue\nvalue\nvalue\nvalue\n [ Sequence of actions or\n conditional actions ]\nX\n [ Sequence of actions or\n conditional actions ]\nX\nX\n [ Sequence of actions or\n conditional actions ]\nX\n \nAlthough it isn’t a Structured English construct, a decision \ntable can be named, and referenced within a Structured \nEnglish procedure. \nCondition stubs\nAction Stubs\nCopyright © 2000 The McGraw-Hill Companies. All Rights reserved\n","lesson":"structured-english","title":"Structured English Rules"},{"page":20,"text":"20\nDecision Table Example\nCondition Stub\nCondition Entry\nIf\nCustomer is bookstore\nY\nY\nN\nN\nN\nN\nOrder size > 6 copies\nY\nN\nN\nN\nN\nN\nCustomer is \nlibrarian/individual\nY\nY\nY\nY\nOrder size 50 copies or \nmore\nY\nN\nN\nN\nOrder size 20 to 49 \ncopies\nY\nN\nN\nOrder size 6 – 19 copies\nY\nN\nThen\nAllow a 25% discount\nX\nAllow a 15% discount\nX\nAllow 10% discount\nX\nAllow a 5 % discount\nX\nAllow 0% discount\nX\nX\nAction Stub\nAction Entries\n","lesson":"structured-english","title":"Decision Table Example"},{"page":21,"text":"21\nStructured English constructs\nOne-to-many iteration – Repeat the set of steps \nuntil the condition is false. \nUse this construct if the set of steps must be \nperformed at least once, regardless of the \ncondition’s initial value. \nRepeat the following until [truth condition]: \n \n[ sequence of steps or conditional steps ] \nEnd Repeat \nZero-to-many iteration – Repeat the set of steps \nuntil the condition is false. \nUse this construct if the set of steps are \nconditional based on the condition’s initial value. \nDo While [truth condition]: \n \n[ sequence of steps or conditional steps ] \nEnd Do \n- OR - \nFor [truth condition]: \n \n[ sequence of steps or conditional steps ] \nEnd For \nCopyright © 2000 The McGraw-Hill Companies. All Rights reserved\n","lesson":"structured-english","title":"Structured English constructs"},{"page":22,"text":"22\n1.  For each CUSTOMER NUMBER in the data store CUSTOMERS:\na.  For each LOAN in the data store LOANS that matches the above\nCUSTOMER NUMBER:\n1)  Keep a running total of NUMBER OF LOANS for the\nCUSTOMER NUMBER.\n2)  Keep a running total of the ORIGINAL LOAN PRINCIPAL for the\nCUSTOMER NUMBER.\n3)  Keep a running total of CURRENT LOAN BALANCE for the\nCUSTOMER NUMBER.\n4)  Keep a running total of AMOUNTS PAST DUE for the\nCUSTOMER NUMBER.\nb.  If the TOTAL AMOUNTS PAST DUE for the CUSTOMER NUMBER\nis greater than $100.00 then:\n1)  Write the CUSTOMER NUMBER and all their data attributes\nas described in the data flow LOANS AT RISK.\nElse\n1)  Exclude the CUSTOMER NUMBER and data from the data\nflow LOANS AT RISK.\nStructured English is a language and syntax, based on the relative strengths of structured \nprogramming and natural English, for specifying the underlying logic of elementary processes \non DFDs.\nStructured English\nCopyright © 2000 The McGraw-Hill Companies. All Rights reserved\n","lesson":"structured-english","title":"1. For each CUSTOMER NUMBER in the data store CUSTOMERS:"},{"page":23,"text":"23\nData Dictionaries\n\u0002\nUsed to augment the Data Flow Diagrams\n\u0002\nRepository\n\u0002\nLayout\n\u0002 Name of the item\n\u0002 Alias\n\u0002 Description/Purpose\n\u0002 Related data items\n\u0002 Range of values\n\u0002 Data flows\n\u0002 Data structure definition/form\n","lesson":"structured-english","title":"Data Dictionaries"},{"page":24,"text":"24\nData Structures\n\u0002\nAre specific arrangements of data attributes that define a single instance of a data flow\n\u0002\nA sequence that occur one after another\n\u0002\nA selection of one or more attributes from a set\n\u0002\nA repetition of one or more attributes\n\u0002\nMost common data structure notation is Boolean algebraic notation\nAttributes in side are optional no value for some of the \ndata flows\n(…)\nAttributes may occur many times – repetition -\nAttributes separated by commas\n{…}\nOnly one of the attributes may be present – selection -\nAttributes separated by commas\nEither/or\n[…]\nMeans and and designates sequence\n+\n“Consists of” or “is composed of”\n=\n","lesson":"structured-english","title":"Data Structures"},{"page":25,"text":"25\nENGLISH ENTERPRETATION\nAn instance of ORDER consists of:\nORDER NUMBER and\nORDER DATE and\nEither PERSONAL CUSTOMER NUMBER\nor CORPORATE ACCOUNT \nNUMBER\nand SHIPPING ADDRESS (which is equivalent \nto ADDRESS)\nand optionally: BILLING ADDRESS (which is \nequivalent to ADDRESS)\nand one or more instances of:\nPRODUCT NUMBER and\nPRODUCT DESCRIPTION \nand\nQUANTITY ORDERED and\nPRODUCT PRICE and\nPRODUCT PRICE SOURCE \nand\nEXTENDED PRICE\nand SUM OF EXTENDED PRICES and\nPREPAID AMOUNT and\noptionally: both CREDIT CARD NUMBER and \nEXPIRATION DATE\nAn instance of ADDRESS consists of:\noptionally: POST OFFICE BOX NUMBER and\nSTREET ADDRESS and\nCITY and\nEither STATE or MUNICIPALITY\nand optionally: COUNTRY\nand POSTAL CODE\nDATA STRUCTURE\nORDER=\nORDER NUMBER +\nORDER DATE+\n[ PERSONAL CUSTOMER NUMBER,\nCORPORATE ACCOUNT NUMBER]+\nSHIPPING ADDRESS=ADDRESS+\n(BILLING ADDRESS=ADDRESS)+\n1 {PRODUCT NUMBER+\nPRODUCT DESCRIPTION+\nQUANTITY ORDERED+\nPRODUCT PRICE+\nPRODUCT PRICE SOURCE+\nEXTENDED PRICE } N+\nSUM OF EXTENDED PRICES+\nPREPAID AMOUNT+\n(CREDIT CARD NUMBER+EXPIRATION DATE)\n(QUOTE NUMBER)\nADDRESS=\n(POST OFFICE BOX NUMBER)+\nSTREET ADDRESS+\nCITY+\n[STATE, MUNICIPALITY]+\n(COUNTRY)+\nPOSTAL CODE\nExample Data Structure\n","lesson":"structured-english","title":"ENGLISH ENTERPRETATION"},{"page":26,"text":"26\nA Simple Process Model\n","lesson":"dfd","title":"A Simple Process Model"},{"page":27,"text":"27\nTraditional Approaches to Enterprise Modeling\nSADT (Structured Analysis and Design Technique)\n•Background\n•in use since the mid-seventies\n•inspiration for many commercial tools\n•(DFD?)trademark of Softech, Inc. \n•View\n•\"System\" refers to any enterprise/organization, physical, manufacturing,and SW \nsystem\n•Context Analysis should involve\n• technical assessment: feasibility of system architecture \n•Are the components and inter-relationships technically realizable?\n• operational assessment: system performance in a working environment\n•Can the system perform task X in less than a week of time?\n• economic assessment: costs & impacts of system implementation & use\n•Can the system be built with $20M, 1000 SE’s, in 2 yrs?\n","lesson":"idef","title":"Traditional Approaches to Enterprise Modeling"},{"page":28,"text":"28\nSADT (Structured Analysis and Design \nTechnique)\n","lesson":"idef","title":"SADT (Structured Analysis and Design"},{"page":29,"text":"29\nSADT (Structured Analysis and Design Technique\n","lesson":"idef","title":"SADT (Structured Analysis and Design Technique"},{"page":30,"text":"30\nSADT (Structured Analysis and Design Technique\nSemantics of Arrows\nIn an actigram\n• Inputs are data that are consumed by the activity\n•Outputs are produced by the activity\n•Controls influence the execution of an activity but are not consumed\n•Mechanism is a processor (machine, computer, person) which makes the activity happen\n","lesson":"idef","title":"SADT (Structured Analysis and Design Technique"},{"page":31,"text":"31\nSADT (Structured Analysis and Design Technique\n","lesson":"idef","title":"SADT (Structured Analysis and Design Technique"},{"page":32,"text":"32\nSADT (Structured Analysis and Design Technique\n","lesson":"idef","title":"SADT (Structured Analysis and Design Technique"},{"page":33,"text":"33\nSADT (Structured Analysis and Design Technique\n","lesson":"idef","title":"SADT (Structured Analysis and Design Technique"},{"page":34,"text":"34\nSADT (Structured Analysis and Design Technique\nSemantics of Arrows\nIn an actigram\n• Inputs are data that are consumed by the activity\n•Outputs are produced by the activity\n•Controls influence the execution of an activity but are not consumed\n•Mechanism is a processor (machine, computer, person) which makes the activity happen\n• in a datagram\n•Inputs are activities that produce the data\n•Outputs consume the data\n•Controls influence the internal state of the data\n•Mechanism is a device for storage, representation, impl., etc.\n","lesson":"idef","title":"SADT (Structured Analysis and Design Technique"},{"page":35,"text":"35\nA Simple Data Model\n","lesson":"dfd","title":"A Simple Data Model"},{"page":36,"text":"36\nFUNCTION MODELING USING \nIDEF-0\nA Function Model is a Representation of the Activities and \nRelationships Between Activities in an Existing or Planned System.\n","lesson":"idef","title":"FUNCTION MODELING USING"},{"page":37,"text":"37\nIDEF0 (Integration Definition for Function \nModeling)\nBackground\n• released in Dec., 1993\n• the \"reference model\" for system/enterprise function modeling\n• also in use for software process modeling\n• Federal Information Processing Standard maintained by Dept. of Commerce,NIST (National Institute of \nStandards and Technology) & Computer Systems Laboratory\n• based on ICAM (Integrated Computer-Aided Manufacturing) from the US Air Force Wright Aeronautical \nLaboratories\n• Information Modeling (IDEF1X) uses ERD + generalization/specialization\n• closely resembles \"actigrams\" of SADT\nStringent Rules\nE.g., Boxes shall be sufficient to insert box names\nrectangular in shape with square corners\ndrawn with solid lines\nArrows that bend shall be curved using only 90 degree arcs\nshall be drawn in solid line segments\nvertically or horizontally, not diagonally\n","lesson":"idef","title":"IDEF0 (Integration Definition for Function"},{"page":38,"text":"38\n","lesson":"idef","title":"Visual class example"},{"page":39,"text":"39\nTerminology of IDEFØ\n\u0002 Functions and activities\n\u0002 Diagrams, Boxes, and Arrows\n\u0002 ICOMs:  Inputs, Controls, Outputs, and Mechanisms\n\u0002 Arrows, links, relationships, and concepts\n\u0002 Splits, Joins, Unbundling, Bundling, and Branching\n\u0002 Decompositions\n\u0002 Viewpoint, Purpose, and Context\n\u0002 NIST (FIPS ) standard \n","lesson":"idef","title":"Terminology of IDEFØ"},{"page":40,"text":"40\nWhat is IDEFØ?\n\u0002 An IDEF method for modeling functions\n\u0002 Graphics (diagrams)\n\u0002 Text (glossary & narrative)\n\u0002 Provides both a process and a language for \nconstructing a model of the decisions, actions, and \nactivities in an organization\n","lesson":"idef","title":"What is IDEFØ?"},{"page":41,"text":"41\nWhat is an IDEFØ Model?\n\u0002 A definition  of activities and information\n\u0002 Within a particular Context\n\u0002 Having a consistent Viewpoint\n\u0002 For a particular Purpose\n\u0002 Series of diagrams (that decompose a subject into manageable \nchunks)\n\u0002 A foundation for requirements specification, design, and \nprogramming\n\u0002 A useful record throughout the life-cycle of an enterprise\n","lesson":"idef","title":"What is an IDEFØ Model?"},{"page":42,"text":"42\nExample IDEFØ Diagram\nBuild \nSystem\nA3\nDesign\nSystem\nA2\nEstablish\nReqmnts.\nA1\nNeeds\nAlternative Technologies\nKnowledge of Previous Design\nCustomer \nExpectations\nUnderstanding of Customer Requirements\nRequirements\nContract for Tradeoff Decisions\nDesign\nProduct\nRaw Material\nAnalysis Methods\nDesign Methods\nFabrication Methods\n","lesson":"idef","title":"Example IDEFØ Diagram"},{"page":43,"text":"43\nDiagram Construction (1)\n\u0002 Boxes represent functions\n\u0002 Arrows represent real objects or data\nFUNCTION\nCONTROL\nOUTPUT\nINPUT\nMECHANISM\n","lesson":"idef","title":"Diagram Construction (1)"},{"page":44,"text":"44\n\u0002\nLabels are words that name functions and data/real objects\n\u0002\nFunction labels are verbs or verb phrases and are put in the center of the \nfunction box\n\u0002\nData labels are nouns or noun phrases\n\u0002\nData labels name the input, control, output, and mechanism arrows\nDiagram Construction (2)\nLabel\nCONTROL\nOUTPUT\nINPUT\nMECHANISM\n","lesson":"idef","title":"\u0002"},{"page":45,"text":"45\nIDEFØ Function\n\u0002 An Activity, Action, Process, or Operation\n\u0002 A Description of “What Happens” in a \nParticular Environment\n\u0002 Accomplished by People, Machines, \nComputers\n\u0002 Labeled with an Active Verb or Verb Phrase\nFunction Label\n","lesson":"idef","title":"IDEFØ Function"},{"page":46,"text":"46\nRepresented as a box in an IDEF0 Model.\nFirst diagram has one Function which \nbounds the context of the Model.  (A - 0 \ndiagram)\nDiagram has a maximum of 6 functions & a minimum of 3\nA0\nA0\nIDEFØ Functions (Activities)\nA1\nA2\nA3\nA4\nA5\nA6\nA1\nA2\nA3\n","lesson":"idef","title":"Represented as a box in an IDEF0 Model."},{"page":47,"text":"47\nIDEFØ Relationships (Between \nFunctions)\n\u0002 Represented as arrows\n\u0002 AKA concepts\n\u0002 Real objects, data, people, \nmachines, and computers\n","lesson":"idef","title":"IDEFØ Relationships (Between"},{"page":48,"text":"48\nICOMs\n\u0002 Inputs\n\u0002 Controls\n\u0002 Outputs\n\u0002 Mechanisms\n","lesson":"idef","title":"ICOMs"},{"page":49,"text":"49\nInputs\n\u0002 Real Objects or Data Needed to Perform a \nFunction\n\u0002 Objects or Data Transformed by a Function\n\u0002 Labeled with a Noun or Noun Phrase\nINPUTS\nFUNCTION\n","lesson":"idef","title":"Inputs"},{"page":50,"text":"50\nOutput\n\u0002 Objects or Data Produced as a Result of the \nFunction\n\u0002 Labeled with a Noun or Noun Phrase\nINPUTS\nOUTPUTS\nFUNCTION\n","lesson":"idef","title":"Output"},{"page":51,"text":"51\nControl\n\u0002 That which Governs the Accomplishment of the Function\n\u0002 Things that Influence or Determine the Outputs\n\u0002 Labeled with a Noun or Noun Phrase\nINPUTS\nOUTPUTS\nCONTROLS\nFUNCTION\n","lesson":"idef","title":"Control"},{"page":52,"text":"52\nMechanism\n\u0002 Person, Device, or Data which Carries out the Function\n\u0002 The Means by which the Function is Performed\n\u0002 Labeled with a Noun or Noun Phrase\nINPUTS\nOUTPUTS\nCONTROLS\nMECHANISMS\nFUNCTIO\nN\n","lesson":"idef","title":"Mechanism"},{"page":53,"text":"53\nBox and Arrow Relations in a Diagram\n1\n2\n3\nINPUT\nOUTPUT TO INPUTS\nOUTPUT  \nTO CONTROL\nOUTPUT TO  \nMECHANISM\nOUTPUT\nARROWS \nBRANCHING\n(Split)\nFEED BACK OUTPUT \nTO CONTROL\n(Join)\n","lesson":"idef","title":"Box and Arrow Relations in a Diagram"},{"page":54,"text":"54\nArrows: \"Branching\"\nOutput can branch and be used by two functions \nsimultaneously or sequentially \nWithout labels we cannot tell how the branching occurs\n1\n2\n3\nOUTPUT \nDATA\nONCE THIS DATA \nIS SUPPLIED,  \nFUNCTIONS 2 & 3 \nCAN OPERATE \nSIMULTANEOUSLY \nOR SEQUENTIALLY\n","lesson":"idef","title":"Arrows: \"Branching\""},{"page":55,"text":"55\nArrows: \"Joining\"\nFINISHED SUB-PARTS\nPROCURED ITEMS\nPRODUCTION ITEMS\nCONTROL \nPRODUCTION \nITEMS & \nTOOLS\n","lesson":"idef","title":"Arrows: \"Joining\""},{"page":56,"text":"56\nArrows: \"Feedback\"\nSYSTEM \nREQUIREMENTS\nDRAFT \nSPECIFICATIONS\nCOMMENTS\nDRAFT SPECIFICATION  \nWITH DESIGN CHANGES\nDESIGN\nREVIEW\nAPPROVED \nDESIGN\n","lesson":"idef","title":"Arrows: \"Feedback\""},{"page":57,"text":"57\nBundling and Unbundling\nBundle:  Concepts B and C are bundled to form concept \nA.\nUnbundle:  Concept A is unbundled into concepts B and \nC.\nC\nB\nA\nA\nB\nC\n","lesson":"idef","title":"Bundling and Unbundling"},{"page":58,"text":"58\nBundles and Unbundles\nPerform\nBilling\nDeliver\nProducts\nA2\nKeep \nRecords\nA1\nOrders \nManagement\nDirectives\nFiles\nInvoices\nTransaction \nEntries\nBilling\nEntries\nPrices \n&Tax \nTables\nAccount\nEntries\nCustomer\nRecords\nUnbundle\nBundle\nA3\nTransactions\nFiles = Customer Records + Price & Tax Tables\nAccount Entries = Transaction Entries + Billing Entries\n","lesson":"idef","title":"Bundles and Unbundles"},{"page":59,"text":"59\nBundles and Un-bundles: PCB ASSEMBLY\nPlace chip\non board\nApply\nsolder\npaste\nA2\nLoad board\nonto m/c\nA1\nManagement\nDirectives\nBare boards\nChip \npositioned board\nplacement\ncompleted\ndata\nPlacement \nmethod\nUnbundle\nBundle\nA3\nPaste\napplied\nboard\nProcess Plan = loading details + solder paste details + chip placement \nmethod\nAssembly Records = soldering completed data + placement completed \ndata\nProcess plan\nSolder paste\nmethod\nsoldering\ncompleted\ndata\nAssembly\nRecords\n","lesson":"idef","title":"Bundles and Un-bundles: PCB ASSEMBLY"},{"page":60,"text":"60\nFunction Decomposition\n“Parent” Activities Represent a Higher Level of Abstraction than \nthat of Their “Children”\nA0\nA0\nA-0\nA1\nA2\nA3\nA4\nParent Diagram\nChild Diagram\nMore General\nMore Detailed\n","lesson":"idef","title":"Function Decomposition"},{"page":61,"text":"61\nFurther Decomposition\nParent Activity\nA0\nA1\nA2\nA3\nA4\nA3\nA32\nA33\nA34\nA31\nChild Diagram\nParent Diagram\n","lesson":"idef","title":"Further Decomposition"},{"page":62,"text":"62\nDecomposition\n\u0002 Establishes model hierarchy\n\u0002 Functions are comprised of other functions\n\u0002 Decompositions is a process of breaking down of the functions \n(level-by-level)\n\u0002 Data consistency is required throughout the level-by-level \ndecomposition breakdown\n","lesson":"idef","title":"Decomposition"},{"page":63,"text":"63\nComplexity Simplification Technique Tunneled \nArrows \nTunneled Arrows at Unconnected \nEnds\n(Concept Does Not Appear on the \nNext Higher Level.)\nTunneled Arrows at Connected \nEnds\n(Concept Does Not Appear on the \nNext Lower Level.)\n","lesson":"idef","title":"Complexity Simplification Technique Tunneled"},{"page":64,"text":"64\nTunneling Example\nThis control will not appear\non child diagram.\nThis control will still be \ndesignated as C3 on child \ndiagram.\nThis output will not be shown\non parent diagram.\nA0\nA-0\nParent Diagram\nA0\nA1\nA2\nA3\nC1\nC3\nO1\nI1\nChild Diagram\n","lesson":"idef","title":"Tunneling Example"},{"page":65,"text":"65\nSteps in Building a Model\n\u0002 1. Define Viewpoint, Purpose, and Context\n\u0002 2. Develop the Context Diagram (Putting the situation in \ncontext)\n\u0002 3. Decompose activities to fit scope of modeling task \n(complete modeling per rules, etc)\n\u0002 4. Develop glossary\n","lesson":"idef","title":"Steps in Building a Model"},{"page":66,"text":"66\nModel Orientation!!!!\n\u0002 Context (Subject)\nThe Boundaries of the Subject Matter\n\u0002 Viewpoint (Bias)\nThe Perspective from which a Subject is \nAnalyzed\n\u0002 Purpose (Objective)\nThe Reason(s) a Model is Created\n","lesson":"idef","title":"Model Orientation!!!!"},{"page":67,"text":"67\nExample - Context Diagram\nAcquire\nMaterials\nInventory Policy\nPurchase policy\nStock Levels\nPayments\nRejected Materials\nVendor\nABC Co.\nA0\nA-0 Diagram\n","lesson":"idef","title":"Example - Context Diagram"},{"page":68,"text":"68\nExample - Decomposition of the \nContext Diagram\nA0 Diagram\nPayments\nCheck Stock \nLevels & Det\nReorder Qty\nA1\nPrepare \nAuthorize & \nMail P OA2\nReceive PO \nProduce & \nShip\nA3\nReceive \nShipment  & \nInspect A4\nRestock \n& Make \nPayment A5\nInventory Policy\nStock \nLevels\nReorder \nQty\nPurchase Policy\nInvoice\nMaterial\nOK Material \nABC Co.\nVendor\nRejected  \nMateria\nl\nPurchase Order\nPO Prep. \nPolicy\nInspection Policy\n","lesson":"idef","title":"Example - Decomposition of the"},{"page":69,"text":"69\nFunction Model for Planning and Implementing a \nFeature Extraction module\n\u0002 Purpose: To obtain a better understanding of \nthe various tasks involved in planning and \nimplementation of a feature extraction module\n\u0002 Context: We will assume CAD model formats, \nprocess planning requirements and resources \navailable (people and computers) are known.  \nThe FE module will be built using available \nexisting resources (no new tools or software \nwill be purchased).\n\u0002 Viewpoint: that of an industrial / mfg engineer \nwho has a background in designing / building \nsoftware systems\n","lesson":"idef","title":"Function Model for Planning and Implementing a"}],"count":69,"title":"Structured analysis & IDEF0"},{"id":"gore","filename":"GORE-classical.pdf","pages":[{"page":1,"text":"Goal-Oriented \nRequirements Engineering\n(GORE)\n\u0001 Why and What?\n©Lawrence Chung\n\u0001 Why and What? \n\u0001 Classical Logic Approach\n\u0001 T l appear authoritative. \nThe product shall appear authoritative. \nConsiderations\nConsiderations\nInterface design may overlap the requirements gathering process. This particularly true if you are using prototyping \nInterface design may overlap the requirements gathering process. This particularly true if you are using prototyping \nas part of your requirements process. As prototypes develop it is important to capture the requirements that relate \nas part of your requirements process. As prototypes develop it is important to capture the requirements that relate \nto the look and feel. In other words, be sure that you understand your client's intentions for the product's look and \nto the look and feel. In other words, be sure that you understand your client's intentions for the product's look and \nfeel. Record these as requirements instead of merely having a prototype to which the client has nodded his approval.\nfeel. Record these as requirements instead of merely having a prototype to which the client has nodded his approval.\n10b. The style of the product\n10b. The style of the product \nContent\nContent\nA description of salient features of the product that are related to the way a potential customer will see the product. \nA description of salient features of the product that are related to the way a potential customer will see the product. \nFor example, if your client wants the product to appeal to the business executive, then a look and feel requirement is \nFor example, if your client wants the product to appeal to the business executive, then a look and feel requirement is \nthat the product has a conservative and professional appearance. Similarly if the product is for sale to children, then \nthat the product has a conservative and professional appearance. Similarly if the product is for sale to children, then \nthe look and feel requirement is that it be colorful and look like it's intended for children. …\nthe look and feel requirement is that it section describes your client's aspirations for how easy it will be for the intended users of the product to operate it. The product's usability is derived from the abilities of the expected users \nof the product and the complexity of its functionality\nof the product and the complexity of its functionality.\nThe usability requirements should cover such things as: \nThe usability requirements should cover such things as: \nEfficiency of use - how quickly or accurately the user can use the product. \nEfficiency of use - how quickly or accurately the user can use the product. \nEase of remembering - how much is the casual user expected to remember about using the product \nEase of remembering - how much is the casual user expected to remember about using the product \nError rates - for some products it is crucial that the user commits very few, or no, errors. \nError rates - for some products it is crucial that the user commits very few, or no, errors. \nOverall satisfaction in using the product - this is especially important for commercial, interactive products where there is a lot of competition. Web sites are good \nOverall satisfaction in using the product - this is especially important for commercial, interactive products where there is a lot of competition. Web sites are good \nexample of this. \nexample of this. \nFeedback - how much feedback does the user need in order to feel confident that the product is actually accurately doing what the user expects. The necessary degree of \nFeedback - how much feedback does the user need in order to feel confident that the product is actually accurately doing what the user expects. The necessary degree of \nfeedback will be higher for some products (eg: safety critical) than in others. \nfeedback will be higher for some products (eg: safety critical) than in others. \nMotivation\nMotivation\nTo guide the product's designers into building a product that will meet the expectations of its eventual users.\nTo guide the product's designers into building a product that will meet the expectations of its eventual users.\nExamples\nExamples\nThe product shall be easy for 11 year-old children to use. \nThe product shall be easy for 11 year-old children to use. \nThe product shall help the user to avoid making mistakes. \nThe product shall help the user to avoid making mistakes. \nThe product shall make the users want to use it. \nThe product shall make the users want to use it. \nThe product shall be used by people with no training, and possibly no understanding of English. \nThe product shall be used by people with no training, and possibly no understanding of English. \nFit Criterion\nFit Criterion\nThese examples may seem simplistic, but they do express the intention of the client. To completely specify what is meant by the requirement it is necessary to add a \nThese examples may seem simplistic, but they do express the intention of the client. To completely specify what is meant by the requirement it is necessary to add a \nmeasurement of acceptance. We call this a fit criterion. The fit criterion for the above examples would be:\nmeasurement of acceptance. We call this a fit criterion. The fit criterion for the above examples would be:\n[An agreed percentage, say 90%] of a test panel of 11 year olds shall be able to successfully complete [list of tasks] within [specified time]\n[An agreed percentage, say 90%] of a test panel of 11 year olds shall be able to successfully complete [list of tasks] within [specified time]\nOne month's use of the product shall result in a total error rate of less than [an agreed percentage, say 2%]\nOne month's use of the product shall result in a total error rate of less than [an agreed percentage, say 2%]\nAn anonymous survey shall show that [an agreed percentage, say 75%] of the users are regularly using the product after [an agreed time] familiarization period.\nAn anonymous survey shall show that [an agreed percentage, say 75%] of the users are regularly using the product after [an agreed time] familiarization period.\nConsiderations\nConsiderations\nRefer back to Section 3, the Users of the System, to ensure that you have considered the usability requirements from the perspective of all the different types of users.\nRefer back to Section 3, the Users of the System, to ensure that you have considered the usability requirements from the perspective of all the different types of users.\nIt may be necessary to have special consulting sessions with your users and your client to determine whether there are any special usability considerations that must be \nIt may be necessary to have special consulting sessions with your users and your client to determine whether there are any special usability considerations that must be \nbuilt into the product.\nbuilt into the product.\nYou could also consider consulting a usability laboratory that has experience with testing the usability of products that have constraints (sections 1-7 of this template) \nYou could also consider consulting a usability laboratory that has experience with testing the usability of products that have constraints (sections 1-7 of this template) \nsimilar to yours.\nsimilar to yours.\n \n","lesson":"nfr-templates","title":"NFRs:"},{"page":107,"text":"Lawrence Chung\nNFRs:\nNFRs:\nWith Volere Requirements Specification \nWith Volere Requirements Specification \nTemplate\nTemplate\n11b. Personalization and internationalization requirements\n11b. Personalization and internationalization requirements \nContent \nContent \nThis section describes the way in which the product can be altered or configured to take into account the \nThis section describes the way in which the product can be altered or configured to take into account the \nuser's personal preferences or choice of language. The personalization requirements should cover such \nuser's personal preferences or choice of language. The personalization requirements should cover such \nthings as: \nthings as: \nLanguages, spelling preferences, language idioms \nLanguages, spelling preferences, language idioms \nCurrencies including the symbols and decimal conventions \nCurrencies including the symbols and decimal conventions \nPersonal configuration options - there are a myriad of these \nPersonal configuration options - there are a myriad of these \nMotivation\nMotivation\nTo ensure that the product's users do not have to struggle with, or meekly accept, the cultural conventions \nTo ensure that the product's users do not have to struggle with, or meekly accept, the cultural conventions \nof the builder. \nof the builder. \nExamples\nExamples\nThe product shall retain the buyer's buying preferences. \nThe product shall retain the buyer's buying preferences. \nThe product shall allow the user to select a chosen language. \nThe product shall allow the user to select a chosen language. \nConsiderations\nConsiderations\nConsider the locations of the potential customers and users of your product. Any out of country users will \nConsider the locations of the potential customers and users of your product. Any out of country users will \nwelcome the opportunity to convert to their home spelling and expressions. \nwelcome the opportunity to convert to their home spelling and expressions. \nBy allowing users to customize the way in which they use the product, you are giving them the opportunity \nBy allowing users to customize the way in which they use the product, you are giving them the opportunity \nto participate more closely with your organization, as well as give them their own personal user \nto participate more closely with your organization, as well as give them their own personal user \nexperience. \nexperience. \nYou might also consider the configurability of the product. This allows different users to have different \nYou might also consider the configurability of the product. This allows different users to have different \nfunctional variations of the product. \nfunctional variations of the product. \n \n","lesson":"nfr-templates","title":"NFRs:"},{"page":108,"text":"Lawrence Chung\nNFRs:\nNFRs:\nWith Volere Requirements Specification \nWith Volere Requirements Specification \nTemplate\nTemplate\n11c. Ease of learning.\n11c. Ease of learning.\nContent\nContent\nA statement of how easy it should be to learn to use the product. This will range from zero time for products \nA statement of how easy it should be to learn to use the product. This will range from zero time for products \nintended for placement in the public domain (for example a parking meter or a web site) to a \nintended for placement in the public domain (for example a parking meter or a web site) to a \nconsiderable time for complex, highly technical products. (We know of one product where it was \nconsiderable time for complex, highly technical products. (We know of one product where it was \nnecessary for graduate engineers to spend 18 months in training before being qualified to use the \nnecessary for graduate engineers to spend 18 months in training before being qualified to use the \nproduct.)\nproduct.)\nMotivation\nMotivation\nTo quantify the amount of time that your client feels is allowable before a user can successfully use the \nTo quantify the amount of time that your client feels is allowable before a user can successfully use the \nproduct. This requirement will guide designers in how users will learn the product. For example, the \nproduct. This requirement will guide designers in how users will learn the product. For example, the \ndesigners may build elaborate interactive help facilities into the product, or the product may be \ndesigners may build elaborate interactive help facilities into the product, or the product may be \npackaged with a tutorial. Alternatively the product may have to be constructed so that all of its \npackaged with a tutorial. Alternatively the product may have to be constructed so that all of its \nfunctionality is apparent upon first encountering it.\nfunctionality is apparent upon first encountering it.\nExamples\nExamples\nThe product shall be easy for an engineer to learn. \nThe product shall be easy for an engineer to learn. \nA clerk shall be able to be productive within a short time. \nA clerk shall be able to be productive within a short time. \nThe product shall be able to be used by members of the public who will receive no \nThe product shall be able to be used by members of the public who will receive no \ntraining before using it. \ntraining before using it. \nThe product shall be used by engineers who will attend 5 weeks of training before using \nThe product shall be used by engineers who will attend 5 weeks of training before using \nthe product. \nthe product. \nFit Criterion\nFit Criterion\nFit criterion for the above example requirements are:\nFit criterion for the above example requirements are:\nAn engineer shall produce a [specified result] within [specified time] of beginning to use the product, \nAn engineer shall produce a [specified result] within [specified time] of beginning to use the product, \nwithout needing to use the manual.\nwithout needing to use the manual.\nAfter receiving [number of hours] training a clerk shall be able to produce [quantity of specified outputs] \nAfter receiving [number of hours] training a clerk shall be able to produce [quantity of specified outputs] \nper [unit of time].\nper [unit of time].\n[Agreed percentage] of a test panel shall successfully complete [specified task] within [specified time limit].\n[Agreed percentage] of a test panel shall successfully complete [specified task] within [specified time limit].\nThe engineers shall achieve [agreed percentage] pass rate from the final examination of the training.\nThe engineers shall achieve [agreed percentage] pass rate from the final examination of the training.\nConsiderations\nConsiderations\nRefer back to Section 3, the Users of the System, to ensure that you have considered the ease of learning \nRefer back to Section 3, the Users of the System, to ensure that you have considered the ease of learning \nrequirements from the perspective of all the different types of users. \nrequirements from the perspective of all the different types of users. \n \n","lesson":"nfr-templates","title":"NFRs:"},{"page":109,"text":"Lawrence Chung\nNFRs:\nNFRs:\nWith Volere Requirements Specification \nWith Volere Requirements Specification \nTemplate\nTemplate\n11d. Understandability and Politeness requirements. \n11d. Understandability and Politeness requirements. \nThis section is concerned with discovering requirements related to concepts and metaphors that are familiar to the intended end-\nThis section is concerned with discovering requirements related to concepts and metaphors that are familiar to the intended end-\nusers. \nusers. \nContent \nContent \nThis specifies the requirement for the product to be understood by its users. While usability refers to ease of use, efficiency etc., \nThis specifies the requirement for the product to be understood by its users. While usability refers to ease of use, efficiency etc., \nunderstanding determines whether the users instinctively know what the product will do for them. In other words, the product \nunderstanding determines whether the users instinctively know what the product will do for them. In other words, the product \nfits into their view of the world. You can think of this as the product being polite to its users and not expecting them to know or \nfits into their view of the world. You can think of this as the product being polite to its users and not expecting them to know or \nlearn things that have nothing to do with their business problem. \nlearn things that have nothing to do with their business problem. \nMotivation \nMotivation \nTo avoid forcing the user to learn terms and concepts that are part of the productÕs internal construction and are not relevant to \nTo avoid forcing the user to learn terms and concepts that are part of the productÕs internal construction and are not relevant to \nthe usersÕ world. To make the product more comprehensible and thus more likely to be adopted by its intended users. \nthe usersÕ world. To make the product more comprehensible and thus more likely to be adopted by its intended users. \nExamples \nExamples \nThe product shall use symbols and words that are naturally understandable by the user community. \nThe product shall use symbols and words that are naturally understandable by the user community. \nThe product shall hide the details of its construction from the user. \nThe product shall hide the details of its construction from the user. \nConsiderations \nConsiderations \nRefer back to Section 3, the Users of the Product, and consider the world from the point of view of each of the different types of \nRefer back to Section 3, the Users of the Product, and consider the world from the point of view of each of the different types of \nusers. \nusers. \n11e. Accessibility requirements.\n11e. Accessibility requirements. \nContent \nContent \nThe requirements for how easy it should be for people with common disabilities to access the product. These disabilities might be \nThe requirements for how easy it should be for people with common disabilities to access the product. These disabilities might be \nto do with sight, physical disablement, hearing, cognitive, or others. \nto do with sight, physical disablement, hearing, cognitive, or others. \nMotivation \nMotivation \nIn many countries it is required that some products are made available to the disabled. In any event, it seems self-defeating to \nIn many countries it is required that some products are made available to the disabled. In any event, it seems self-defeating to \nexclude this sizable community of potential customers. \nexclude this sizable community of potential customers. \nExamples \nExamples \nThe product shall be usable by partially-sighted users. \nThe product shall be usable by partially-sighted users. \nThe product shall conform to the Americans with Disabilities Act. \nThe product shall conform to the Americans with Disabilities Act. \nConsiderations \nConsiderations \nThere are users with disabilities other than the commonly-described ones. Similarly, there are partial disabilities that are fairly \nThere are users with disabilities other than the commonly-described ones. Similarly, there are partial disabilities that are fairly \ncommon. A simple, and not very consequential example, is that approximately 20% of males are red-green color blind.\ncommon. A simple, and not very consequential example, is that approximately 20% of males are red-green color blind. \n \n","lesson":"nfr-templates","title":"NFRs:"},{"page":110,"text":"Lawrence Chung\nNFRs:\nNFRs:\nWith Volere Requirements Specification \nWith Volere Requirements Specification \nTemplate\nTemplate\n12 Performance Requirements\n12 Performance Requirements\n12a. Speed and latency requirements\n12a. Speed and latency requirements\nExamples\nExamples\nAny interface between a user and the automated system shall have a maximum response \nAny interface between a user and the automated system shall have a maximum response \ntime of 2 seconds \ntime of 2 seconds \nThe response shall be fast enough to avoid interrupting the user's flow of thought \nThe response shall be fast enough to avoid interrupting the user's flow of thought \nThe product shall poll the sensor every 10 seconds \nThe product shall poll the sensor every 10 seconds \nThe product shall download the new status parameters within 5 minutes of a change \nThe product shall download the new status parameters within 5 minutes of a change \nFit Criterion - Unit of measurement, Required range of values\nFit Criterion - Unit of measurement, Required range of values\n12b. Safety critical requirements\n12b. Safety critical requirements\nExamples\nExamples\nThe product shall not emit ftware on which the product must operate.\nSpecification of system software on which the product must operate.\nSpecification of future environments in which the product is expected to operate.\nSpecification of future environments in which the product is expected to operate.\n14e. Installation requirements \n14e. Installation requirements \nExample \nExample \nThe product shall be able to be installed in the specified environment within 2 working days. \nThe product shall be able to be installed in the specified environment within 2 working days. \n \n","lesson":"nfr-templates","title":"NFRs:"},{"page":114,"text":"Lawrence Chung\nNFRs:\nNFRs:\nWith Volere Requirements Specification \nWith Volere Requirements Specification \nTemplate\nTemplate\n15 Security Requirements\n15 Security Requirements\n15a. Access requirements\n15a. Access requirements\nExamples\nExamples\nOnly direct managers can see the personnel records of their staff. \nOnly direct managers can see the personnel records of their staff. \nOnly holders of current security clearance can enter the building. \nOnly holders of current security clearance can enter the building. \nFit Criterion\nFit Criterion\nSystem function name or system data name\nSystem function name or system data name\nUser role/s and/or names of people who have clearance\nUser role/s and/or names of people who have clearance\n15b. Integrity requirements\n15b. Integrity requirements\nExamples\nExamples\nThe product shall prevent its data from incorrect data being introduced. \nThe product shall prevent its data from incorrect data being introduced. \nThe product shall protect itself from intentional abuse. \nThe product shall protect itself from intentional abuse. \n15c. Privacy requirements \n15c. Privacy requirements \nExamples \nExamples \nThe product shall make its user aware of its information practices before collection data from them. \nThe product shall make its user aware of its information practices before collection data from   let style=result===null?'':q.answer.includes(i)?'correct':picked.includes(i)?'incorrect':'';
  return `<label class="option ${style}"><input type="${q.answer.length>1?'checkbox':'radio'}" name="answer-${q.id}" value="${i}" data-choice="${q.id}" data-context="${context}" ${picked.includes(i)?'checked':''} ${disabled?'disabled':''}><span class="option-key">${String.fromCharCode(65+i)}</span><span>${escapeHTML(o)}</span></label>`;

function updateSIG(){let a=document.querySelector('[data-sig="a"]');if(!a)return;let names={S:'satisficed ✓',D:'denied ✗',C:'conflicting ⚡',U:'undetermined U'};
 let av=a.value,bv=document.querySelector('[data-sig="b"]').value,isBreak=document.querySelector('[data-sig="edge"]').value==='break',join=document.querySelector('[data-sig="join"]').value,p=false,n=false,note='';
 if(join==='contributions'){p=av==='S'||(bv==='S'&&!isBreak);n=bv==='S'&&isBreak;note='A satisficed Make source supplies positive evidence; a satisficed Break source supplies negative evidence. Denied sources do not supply the opposite conclusion. Both denied therefore leave U.';}
 else if(join==='and'){p=av==='S'&&bv==='S';n=av==='D'||bv==='D';note='All required children must be satisficed; denial of a required child supplies denial of the AND parent. The contribution selector is not used for this refinement case.';}
 else{p=av==='S'||bv==='S';n=av==='D'&&bv==='D';note='A sufficient satisficed alternative supports the parent; all alternatives must be denied to deny the OR parent. The contribution selector is not used for this case.';}
 let result=p?(n?'C':'S'):(n?'D':'U'),label=join==='contributions'?'Contributions':join.toUpperCase();
 $('sig-result').innerHTML=`<strong>A: ${names[av]} · B: ${names[bv]}</strong><p>Target (${label}): <strong>${names[result]}</strong>.</p><p>${note}</p>`;
}
function hydrateLabs(){
 document.querySelectorAll('[data-lab]').forEach(el=>{
  switch(el.dataset.lab){
   case 'sig-diagram':el.innerHTML='<div class="diagram-frame">'+sigDiagram()+'</div><p class="diagram-caption">Recreated study example. Thin clouds = NFRs; bold clouds = operationalizations; dashed cloud = claim. Contribution arrows point from the technique toward the affected quality. The claim illustrates rationale; it is not a proven fact.</p>';break;
   case 'sig':el.innerHTML=sigLab();updateSIG();break;
   case 'idef':el.innerHTML='<h3>Normalized standard IDEF0 illustration</h3><p>This illustration uses standard sides and gives tools the mechanism role. It is not a transcription of the supplied sketch shown above.</p><div class="diagram-frame">'+idefDiagram()+'</div><div class="lab"><div class="type-label">Quick self-check · standard notation</div><h3>Label the standard ICOM arrows</h3><div class="scope-row">'+[['left','Left','Input'],['top','Top','Control'],['right','Right','Output'],['bottom','Bottom','Mechanism']].map(([key,label])=>`<label class="form-field">${label}<select data-idef="${key}"><option value="">Choose…</option>${['Input','Control','Output','Mechanism'].map(t=>'<option>'+t+'</option>').join('')}</select></label>`).join('')+'</div>'+button('Check ICOM labels','idef-check','','secondary')+'<div id="idef-result" role="status"></div></div>';break;
   case 'loans':el.innerHTML=`<div class="lab"><div class="type-label">Boundary practice</div><h3>Will this customer be reported?</h3><label class="form-field">Past-due amounts for matching loans ($, comma-separated)<input id="loan-amounts" type="text" value="40, 35, 30" inputmode="decimal"></label><p class="hint-text">Try 60, 40 for the boundary; try a total above $100.00.</p>${button('Evaluate customer','loan-calc','','secondary')}<div id="loan-result" role="status"></div></div>`;break;
   case 'kaos':el.innerHTML=`<div class="lab"><div class="type-label">Pattern practice</div><h3>Classify the formalizable goals</h3>${[['Every accepted request eventually receives a response.','Achieve'],['After reset, the alarm eventually becomes inactive.','Cease'],['Whenever the train is moving, its doors are closed.','Maintain'],['Whenever the train is moving, its doors are never open.','Avoid']].map(([p,a],i)=>`<label class="form-field kaos-item">${escapeHTML(p)}<select data-kaos="${i}"><option value="">Choose…</option>${['Achieve','Cease','Maintain','Avoid'].map(x=>'<option>'+x+'</option>').join('')}</select></label>`).join('')}${button('Check goal patterns','kaos-check','','secondary')}<div id="kaos-result" role="status"></div></div>`;break;
  }
 });
}
function calculateLoans(){let raw=$('loan-amounts').value.trim(),parts=raw?raw.split(',').map(x=>x.trim()):[],a=parts.map(Number);if(!parts.length||parts.some(x=>!/^\d+(?:\.\d{1,2})?$/.test(x))||a.some(x=>!Number.isFinite(x)||x<0)){$('loan-result').innerHTML='<p class="feedback bad">Enter one or more nonnegative amounts, separated by commas, with at most two decimal places each.</p>';return;}let cents=a.reduce((s,x)=>s+Math.round(x*100),0);$('loan-result').innerHTML=`<p class="feedback ${cents>10000?'good':''}"><strong>Total past due: $${(cents/100).toFixed(2)}.</strong> ${cents>10000?'Write this customer to LOANS AT RISK.':'Exclude this customer from LOANS AT RISK.'} The rule is strictly greater than $100.00.</p>`;}
function checkKAOS(){let answers=['Achieve','Cease','Maintain','Avoid'],inputs=[...document.querySelectorAll('[data-kaos]')];let n=inputs.filter((x,i)=>x.value===answers[i]).length;$('kaos-result').innerHTML=`<div class="feedback"><strong>${n}/4 correct.</strong><p>In order: Achieve (eventually Q), Cease (eventually ¬Q), Maintain (always P → Q), Avoid (always P → ¬Q).</p></div>`;}
function checkIDEF(){let expected={left:'Input',top:'Control',right:'Output',bottom:'Mechanism'},n=Object.entries(expected).filter(([k,v])=>document.querySelector(`[data-idef="${k}"]`).value===v).length;$('idef-result').innerHTML=`<div class="feedback"><strong>${n}/4 correct.</strong><p>Input left · Control top · Output right · Mechanism bottom.</p></div>`;}

if(!location.hash&&state.lastRoute!=='home')location.hash='#/'+state.lastRoute;
parseRoute();
</script></body></html>
