m a normalized, consistent table.</p></div><figure class=\"class-figure\"><div data-slide-preview=\"struct:20\"></div><figcaption>Structured Analysis p. 20: the original six-rule table, including the inconsistent repeated N entries. <div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"20\">View full slide · 20 ↗</button></div></figcaption></figure><h3>Loop wording on the slide</h3><p>Slide 21 identifies post-test iteration as at least once and pre-test iteration as possibly zero times. Its prose says “until the condition is false” beside a REPEAT UNTIL template. For conventional <code>REPEAT … UNTIL stopCondition</code>, stop when the stop condition becomes true; for <code>WHILE continueCondition</code>, stop when it becomes false. Name the condition so the intended stopping rule is explicit.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"18\">Open class slides · 18 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"19\">Open class slides · 19 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"21\">Open class slides · 21 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"22\">Open class slides · 22 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"23\">Open class slides · 23 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"24\">Open class slides · 24 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"25\">Open class slides · 25 ↗</button></div>","source":"§8.2, §14 + added tables","priority":true,"questions":["structured-english-0","structured-english-1","structured-english-2","structured-english-3"],"frq":["frq-sa-5","frq-sa-6","frq-added-4","frq-added-9","frq-added-28"]},{"id":"idef","module":"struct","title":"SADT, IDEF0 & the process specification","intro":"Read each ICOM arrow by its position and function, then preserve it through decomposition.","keys":["Standard ICOM: input left, control top, output right, mechanism bottom.","The supplied sketch places User, Templates/standards and RE-tools on top; its left input is unlabeled.","Distinguish the original sketch from a normalized IDEF0 diagram; A-0 has one box."],"html":"<h3>The supplied process-spec slide: as drawn vs. standard ICOM</h3><figure class=\"class-figure\"><div data-slide-preview=\"process:1\"></div><figcaption>Original class process-spec sketch. The visible arrow positions must not be inferred from the label text alone. <div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"process\" data-value=\"1\">View full slide · 1 ↗</button></div></figcaption></figure><table><thead><tr><th>On this supplied slide</th><th>What can be stated safely</th></tr></thead><tbody><tr><td>User, Templates/standards, RE-tools</td><td>All three labels are above the box, with arrows entering its top. Under strict IDEF0 side semantics these are drawn as controls.</td></tr><tr><td>Left-side incoming arrow</td><td>Present but unlabeled; the slide does not name its input.</td></tr><tr><td>WRS doc and Vision doc</td><td>Shown on the output/right side; the Vision line is drawn thick and the sketch is not a complete standard model.</td></tr><tr><td>Mechanism / bottom arrow</td><td>No labeled bottom mechanism arrow is shown. Tools that perform the activity would normally be placed as mechanisms in a normalized IDEF0 model.</td></tr><tr><td>Decomposition</td><td>The sketch names Develop Phase I and Develop Phase II. It is a simplified two-stage teaching sketch, whereas standard non-context decompositions generally use 3–6 boxes.</td></tr></tbody></table><p>For a question about <strong>the given slide</strong>, reproduce its labels and positions. For a question asking for <strong>standard IDEF0</strong>, use input left, control top, output right and mechanism bottom; explicitly state any normalization you make. “User” by itself could represent an information source, participant or governing stakeholder depending on the model; do not invent the unlabeled input.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"29\">Open class slides · 29 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"30\">Open class slides · 30 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"34\">Open class slides · 34 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"43\">Open class slides · 43 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"44\">Open class slides · 44 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"46\">Open class slides · 46 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"49\">Open class slides · 49 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"50\">Open class slides · 50 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"51\">Open class slides · 51 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"52\">Open class slides · 52 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"63\">Open class slides · 63 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"64\">Open class slides · 64 ↗</button></div><div class=\"source-note\"><strong>Context diagram exception</strong><p>A-0 contains one context box. Standard decomposition diagrams generally use 3–6 boxes. The uploaded teaching sketch names Develop Phase I and Develop Phase II; treat that as a simplified sketch rather than a complete standard decomposition.</p></div><div data-lab=\"idef\"></div><h3 id=\"idef\">8.3 SADT and IDEF0</h3>\n<ul><li><b>SADT</b> (Structured Analysis and Design Technique): since the mid-1970s; inspiration for many tools; trademark of SofTech; “system” = any enterprise/organization (physical, manufacturing, software). <b>Context analysis</b> includes <b>technical</b> assessment (is the architecture realizable?), <b>operational</b> assessment (can it do task X in under a week?), <b>economic</b> assessment (can it be built for $20M, 1000 SEs, 2 years?).</li>\n<li><b>Arrow semantics in an actigram:</b> <b>Inputs</b> are consumed/transformed; <b>Outputs</b> are produced; <b>Controls</b> influence execution but are <i>not</i> consumed; <b>Mechanism</b> = the processor (machine, computer, person) that makes the activity happen. In a <b>datagram</b>: inputs = activities that produce the data; outputs = activities that consume it; controls influence the data’s internal state; mechanism = device for storage/representation.</li>\n<li><b>IDEF0</b> (Integration Definition for Function Modeling): released <b>Dec 1993</b>; “reference model” for system/enterprise function modeling and software-process modeling; a <b>FIPS</b> maintained by <b>NIST</b>; based on <b>ICAM</b> (US Air Force Wright Aeronautical Labs); closely resembles SADT actigrams; IDEF1X = ERD + generalization/specialization. <b>Stringent graphic rules:</b> rectangular boxes with square corners, solid lines; arrows bend only with 90° arcs, drawn vertically/horizontally, never diagonally.</li>\n<li>An IDEF0 <b>model</b> = activities and information within a particular <b>Context</b>, consistent <b>Viewpoint</b>, for a <b>Purpose</b>; a series of diagrams decomposing a subject; foundation for requirements specification, design, programming. <b>Context</b> = boundaries; <b>Viewpoint</b> = bias/perspective; <b>Purpose</b> = reason for the model.</li></ul>\n<table><tr><th>Arrow side</th><th>ICOM</th><th>Meaning</th></tr><tr><td>Left</td><td><b>I</b>nput</td><td>Real object/data needed or transformed</td></tr><tr><td>Top</td><td><b>C</b>ontrol</td><td>Governs/determines outputs (policies, standards)</td></tr><tr><td>Right</td><td><b>O</b>utput</td><td>Produced result</td></tr><tr><td>Bottom</td><td><b>M</b>echanism</td><td>Person, device or data that carries out the function</td></tr></table>\n<ul><li><b>Labels:</b> function labels = <b>verbs/verb phrases</b> in the box; arrow labels = <b>nouns/noun phrases</b>. First diagram has one box (<b>A-0</b>, bounds the context), then <b>A0</b>; <b>every diagram has a minimum of 3 and maximum of 6 boxes</b>. Boxes numbered A1…A6; children of A3 = A31, A32, …</li>\n<li><b>Arrow relations:</b> <b>branching</b> (split – an output feeds two functions simultaneously or sequentially; labels needed to say how), <b>joining</b>, <b>feedback</b> (output to control or input of an upstream function; e.g., design review comments), output to <b>mechanism</b>. <b>Bundling/unbundling</b>: Files = Customer Records + Price &amp; Tax Tables; Account Entries = Transaction Entries + Billing Entries; PCB assembly: Process Plan = loading details + solder-paste details + chip-placement method; Assembly Records = soldering-completed data + placement-completed data.</li>\n<li><b>Decomposition:</b> parent/child hierarchy; children are more detailed; data consistency required level-by-level. <b>Tunneled arrows</b> – “(…)” ends: at a <i>connected</i> end the concept does not appear on the next lower level; at an <i>unconnected</i> end it does not appear on the next higher level (e.g., control C3 not on the child diagram, an output not shown on the parent).</li>\n<li><b>Steps to build a model:</b> (1) define viewpoint, purpose and context; (2) develop the context diagram; (3) decompose activities to fit the scope; (4) develop a glossary.</li></ul>\n<div class=\"ex\"><b>Slide examples:</b> <b>ABC Co. “Acquire Materials”</b> context diagram (A-0/A0: inputs stock levels, rejected materials, payments; controls inventory policy, purchase policy; vendor) decomposed into A1 Check Stock Levels &amp; Determine Reorder Qty → A2 Prepare Purchase Order, Authorize &amp; Mail → A3 Receive PO, Produce &amp; Ship (vendor) → A4 Receive Material Shipment &amp; Inspect → A5 Restock &amp; Make Payment (Struct 67–68). <b>Generic IDEF0</b>: A1 Establish Understanding of Customer Requirements, A2 Design System, A3 Build Product (Struct 42). <b>Feature-extraction module</b> model: purpose = understand tasks in planning/implementing the module; context = CAD formats, process-planning requirements and resources known, built from existing resources; viewpoint = industrial/manufacturing engineer with software design background (Struct 69).</div>\n<h4>IDEF0 as a process specification (the example slide)</h4>\n<p>The “IDEF0-Process-Spec” slide shows the form your <b>Process Spec</b> should take: one box <b>“Develop Requirements”</b> with <b>input</b> User, <b>control</b> Templates/standards, <b>mechanism</b> RE-Tools, and <b>outputs</b> WRS doc and Vision doc; decomposed into <b>“Develop Phase I”</b> and <b>“Develop Phase II”</b>.</p>\n<svg viewbox=\"0 0 560 230\" role=\"img\" aria-label=\"IDEF0 Develop Requirements\"><rect class=\"b\" x=\"190\" y=\"70\" width=\"180\" height=\"80\" rx=\"0\"></rect><text x=\"280\" y=\"105\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\">Develop</text><text x=\"280\" y=\"125\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\">Requirements</text><text x=\"355\" y=\"144\" font-size=\"11\" text-anchor=\"end\">A0</text>\n<path class=\"l\" d=\"M60 110 H190\"></path><path class=\"l\" d=\"M180 105 L190 110 L180 115\"></path><text x=\"125\" y=\"102\" text-anchor=\"middle\" font-size=\"13\">User</text>\n<path class=\"l\" d=\"M280 20 V70\"></path><path class=\"l\" d=\"M275 60 L280 70 L285 60\"></path><text x=\"280\" y=\"16\" text-anchor=\"middle\" font-size=\"13\">Templates / standards</text>\n<path class=\"l\" d=\"M280 210 V150\"></path><path class=\"l\" d=\"M275 160 L280 150 L285 160\"></path><text x=\"280\" y=\"224\" text-anchor=\"middle\" font-size=\"13\">RE-Tools</text>\n<path class=\"l\" d=\"M370 95 H500\"></path><path class=\"l\" d=\"M490 90 L500 95 L490 100\"></path><text x=\"440\" y=\"88\" text-anchor=\"middle\" font-size=\"13\">WRS doc</text>\n<path class=\"l\" d=\"M370 125 H500\"></path><path class=\"l\" d=\"M490 120 L500 125 L490 130\"></path><text x=\"440\" y=\"142\" text-anchor=\"middle\" font-size=\"13\">Vision doc</text></svg>\n<div class=\"box\"><b>Link to the project:</b> Final Project II asks for a Process Spec “using notations” – this IDEF0 form is the template shown in class; decompose with 3–6 boxes (e.g., Develop Phase I, Develop Phase II, …) and keep ICOMs consistent between parent and child.</div>\n\n<h3>SADT examples and arrow relations</h3><p>The software-process example decomposes design work into more detailed activities; its preliminary/design requirements are inputs or controls according to their role, while people/tools are mechanisms. Actigrams center on activities; datagrams center on data and show producing/consuming activities.</p><p>Practice branching, joining, output-to-input/control/mechanism links, feedback, bundling/unbundling and the connected-vs-unconnected tunneling convention. The Acquire Materials example then balances its ICOMs across stock checking, purchasing, vendor shipment, inspection and restocking/payment.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"28\">Open class slides · 28 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"29\">Open class slides · 29 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"30\">Open class slides · 30 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"31\">Open class slides · 31 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"32\">Open class slides · 32 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"33\">Open class slides · 33 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"34\">Open class slides · 34 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"38\">Open class slides · 38 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"42\">Open class slides · 42 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"53\">Open class slides · 53 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"54\">Open class slides · 54 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"55\">Open class slides · 55 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"56\">Open class slides · 56 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"57\">Open class slides · 57 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"58\">Open class slides · 58 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"59\">Open class slides · 59 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"60\">Open class slides · 60 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"61\">Open class slides · 61 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"62\">Open class slides · 62 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"63\">Open class slides · 63 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"64\">Open class slides · 64 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"65\">Open class slides · 65 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"66\">Open class slides · 66 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"67\">Open class slides · 67 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"68\">Open class slides · 68 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"struct\" data-value=\"69\">Open class slides · 69 ↗</button></div>","source":"§8.3 + process-spec example","priority":true,"questions":["idef-0","idef-1","idef-2","idef-3"],"frq":["frq-sa-1","frq-sa-2","frq-sa-3","frq-added-29"]},{"id":"gore","module":"goals","title":"GORE, logic & traceability","intro":"Refine goals into sufficient requirements and retain links from their origins to verification.","keys":["Completeness is relative to the goal being refined and domain assumptions.","One Horn-clause body is AND; alternative clauses are OR.","Forward traces lead toward implementation/tests; backward traces lead toward needs/goals."],"html":"<ul><li><b>Why GORE? Completeness – reference-model perspective</b> (Zave &amp; Jackson, “Four Dark Corners of RE”, TOSEM 1997): if five criteria hold, RE is complete in the strongest sense. <b>Requirements are complete if sufficient to establish the goal they refine</b> (Yue 1987).</li>\n<li><b>Teleology</b> (Greek <i>telos</i> = end, purpose): the study of design and purpose; a teleological view holds all things are directed toward a final result – the philosophical root of <i>goal</i>-oriented RE.</li>\n<li>GORE = <i>interleaving, iterative</i> elicitation of goals (“Where is the use case diagram?” – goals precede use cases).</li>\n<li><b>Classical logic (Horn clause / Prolog style):</b> <code>H :- B1, …, Bn.</code> – to show/solve H, show/solve B1 and … and Bn (goal reduction as AND-refinement). Slide example: <code>sibling(X,Y) :- parent(Z,X), parent(Z,Y).</code> · <code>parent(X,Y) :- father(X,Y).</code> · <code>parent(X,Y) :- mother(X,Y).</code> (two clauses for <i>parent</i> = OR-alternatives).</li></ul>\n<h3>Traceability</h3>\n<ul><li><b>Forward traceability</b> – from a requirement to the work products that satisfy it (design, code, tests); <b>backward traceability</b> – from a work product/requirement back to its origin (stakeholder need, goal). Slide questions: “What would be forward/backward traceability?” “Traceability matrix vs graph-oriented traceability?” “Eliminate, rewrite or correct traceability?”</li>\n<li><b>Requirements Traceability Matrix (RTM):</b> created by associating requirements with the work products that satisfy them; tests are associated with the requirements they are based on and the product tested to meet them. Slides show a sample matrix and variations (school-district and USDA-FNS forms).</li>\n<li>Evolution is inevitable – traceability is a virtue (NFR deck).</li></ul>\n\n","source":"§9","priority":false,"questions":["gore-0","gore-1","gore-2","gore-3"],"frq":["frq-gore-1","frq-gore-2"]},{"id":"gore-completeness","module":"goals","title":"GORE’s five completeness criteria","intro":"Explain why a proof of sufficiency is only one part of a complete requirements argument.","keys":["Validate R with the customer and K against the environment.","Scope S to the interface, prove S,K ⊢ R and prove consistency.","P,C ⊢ S links the implemented program and machine to the specification."],"html":"<h3>The five completeness criteria on the class slide</h3><p>The GORE deck uses <code>K</code> for domain knowledge, serving the role of <code>D</code> elsewhere. Completeness requires validation and consistency as well as an entailment proof.</p><table><thead><tr><th>Criterion</th><th>What to explain</th></tr></thead><tbody><tr><td>1 · Requirements validated</td><td>Each requirement is acceptable to the customer, and the set represents all relevant customer desires for the project.</td></tr><tr><td>2 · Domain knowledge validated</td><td>Each statement in K has been checked as true of the environment.</td></tr><tr><td>3 · Specification properly scoped</td><td>S concerns machine-interface behavior; the slide excludes constraints on the environment, unshared actions/state components and references to the future. Distinguish this interface discipline from higher-level temporal goals.</td></tr><tr><td>4 · Sufficiency proved</td><td>Show <code>S, K ⊢ R</code>: implementing the specification in the stated environment establishes the requirements.</td></tr><tr><td>5 · Consistency proved</td><td>Show S and K are consistent. Entailment from inconsistent premises would not establish a meaningful solution.</td></tr></tbody></table><p>The machine/program bridge on the same slide is <code>P,C ⊢ S</code>: execution of program P on the machine described by C ensures S at the interface. Here P means <strong>program</strong>, not the problem symbol used elsewhere.</p><figure class=\"class-figure\"><div data-slide-preview=\"gore:3\"></div><figcaption>GORE p. 3: the complete five-criterion list and the program/machine bridge. <div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"3\">View full slide · 3 ↗</button></div></figcaption></figure>","source":"GORE-classical pp. 3–4","priority":true,"questions":["gore-completeness-0","gore-completeness-1","gore-completeness-2","gore-completeness-3"],"frq":["frq-added-12","frq-added-13"]},{"id":"vending-trace","module":"goals","title":"Vending-machine refinement & traceability","intro":"Read AND/OR logic in a concrete refinement and justify a design through its requirements links.","keys":["One clause body is AND; separate clauses with the same head are OR.","Display and input alternatives refine customer_selection(Product).","Trace both directions to find unjustified design and unrealized requirements."],"html":"<h3>Classical logic: the vending-machine example</h3><p>The top goal <code>serve_customer</code> is AND-refined into customer selection, product availability, payment and vending/refund. Each goal is expanded only as far as needed to state its conditions and alternatives.</p><pre><code>serve_customer :-\n    customer_selection(Product),\n    selection_availability(Product),\n    customer_payment(Product, Payment),\n    vend_payment(Product, Refund).\n\ncustomer_selection(Product) :-\n    display_choices,\n    get_customer_choice(Product).\n\ndisplay_choices :- vertical_display.\ndisplay_choices :- horizontal_display.</code></pre><p>Conditions in one rule body are AND requirements. Multiple rules for the same head are OR alternatives. The slide also explores mouse selection, button selection and voice selection as alternatives for getting the customer’s choice.</p><table><thead><tr><th>Stage</th><th>What is added</th></tr></thead><tbody><tr><td>Identify the goal</td><td>Serve the customer, then identify the domain-specific service.</td></tr><tr><td>Analyze necessary conditions</td><td>Selection, inventory, sufficient payment, dispensing and change/refund.</td></tr><tr><td>Incrementally expand</td><td>Customer selection needs choices displayed and a way to obtain the selected product.</td></tr><tr><td>Elaborate alternatives</td><td>Vertical/horizontal displays; mouse/button/voice selection.</td></tr><tr><td>Trace decisions</td><td>Link each design choice back to the goal it supports, and each requirement forward to a realizing design. Record alternatives, tradeoffs and rationale.</td></tr></tbody></table><h3>Traceability is evidence about dependency</h3><p>A design element with no requirement link may be an accidental or unnecessary design choice. A requirement with no realization link may be unmet. A matrix is convenient for tabular links; a graph can represent several relationship types and make impact paths visible.</p><p>The sibling rule in the deck is a simplified logic example. If self-siblings are excluded, the domain definition also needs <code>X ≠ Y</code>.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"7\">Open class slides · 7 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"8\">Open class slides · 8 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"9\">Open class slides · 9 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"10\">Open class slides · 10 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"11\">Open class slides · 11 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"12\">Open class slides · 12 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"13\">Open class slides · 13 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"14\">Open class slides · 14 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"gore\" data-value=\"15\">Open class slides · 15 ↗</button></div>","source":"GORE-classical pp. 7–15","priority":true,"questions":["vending-trace-0","vending-trace-1","vending-trace-2","vending-trace-3"],"frq":["frq-added-14","frq-added-15"]},{"id":"kaos","module":"goals","title":"KAOS goal elaboration & responsibility","intro":"Refine goals until a capable agent can realize each leaf, with obstacles and conflicts made explicit.","keys":["Requirement: software-agent responsibility; expectation: environment-agent responsibility.","WHY goes upward to intent; HOW goes downward to refinement.","An agent must monitor relevant conditions and control the results assigned to it."],"html":"<ul><li>[Dardenne, van Lamsweerde, Fickas 1993]; early 90s; <b>first major teleological requirements-modeling language</b>; tool support; industrial case studies. <b>Two parts:</b> a <b>semi-formal goal-structuring model</b> and <b>formal definitions in (linear) temporal logic</b>.</li>\n<li><b>Goal patterns:</b> <b>Achieve</b> (liveness) <code>P → ◊Q</code> (eventually); <b>Maintain</b> (safety/“always”) <code>□(P → Q)</code>; <b>Avoid</b> <code>□(P → ¬Q)</code>. □ = necessarily/always, ◊ = possibly/eventually. Prior’s tense logic (appendix): <code>Pp</code> (was), <code>Fp</code> (will), <code>Hp</code> (always in the past), <code>Gp</code> (always in the future); extensions <i>Since</i> and <i>Until</i>.</li>\n<li><b>Method (goal elaboration):</b> define initial high-level goals and the objects they refer to; define initial agents and their capabilities; then iterate: <b>refine goals by AND/OR decomposition</b>; identify <b>obstacles</b> and <b>conflicts</b>; <b>operationalize</b> goals into constraints (software requirements) assignable to individual agents; refine/formalize object and action definitions. <b>Stop</b> when every subgoal is <b>realizable by an individual agent</b> – expressible in conditions the agent can <i>monitor</i> and <i>control</i>.</li></ul>\n<table><tr><th>Term</th><th>Definition</th></tr>\n<tr><td><b>Goal</b></td><td>Prescriptive statement of intent about the system (existing or to-be) whose satisfaction needs cooperation of some agents (software + environment)</td></tr>\n<tr><td><b>Domain property</b></td><td>Descriptive statement about the environment (physical laws, organizational norms)</td></tr>\n<tr><td><b>Requirement</b></td><td>Realizable goal under responsibility of an agent in the <b>software-to-be</b> (monitored/controlled objects)</td></tr>\n<tr><td><b>Expectation</b> (assumption)</td><td>Realizable goal under responsibility of an agent in the <b>environment</b>; cannot be enforced by software</td></tr>\n<tr><td><b>Operation</b></td><td>Input–output relation over objects</td></tr>\n<tr><td><b>Object model</b></td><td>State of the system = aggregation of object states; shown as a UML class diagram</td></tr></table>\n<div class=\"box\"><b>Symbols on KAOS slides 3–6:</b> □ = necessary (always), ◊ = possible (eventually), e.g. □Fp, ◊Fp (slide 3 side box). Goals (Achieve/Maintain/Avoid[…]) are slanted boxes; softgoals are clouds; AND/OR refinement arrows; an X between two goals = conflict; <i>why?</i> goes up, <i>how?</i> goes down; agents carry “Resp” links to leaf goals; the object model is a UML class diagram. The supplied train diagram now shows the named responsibility boxes and Resp links; use the linked class slides to identify the agents.</div>\n<div class=\"box\">Both requirements and expectations are <i>optative</i>; requirements are enforced by the <b>software</b>, expectations only by <b>environment agents</b>. Satisfaction relations: R, As, S, Ac, G (requirements, assumptions/expectations, specifications, accuracy goals, goals).</div>\n<div class=\"ex\"><b>Automated Train Control example</b> (van Lamsweerde, ICSE 2000): object model; <b>WHY</b> questions elicit higher-level/new goals and softgoals; <b>HOW</b> questions elicit refinements down to formalizable goals; agent interfaces (monitored/controlled variables); <i>Maintain[SafeCmdMsg]</i>, worst-case stopping distance; <b>operationalization</b> via domain pre- and postconditions – strengthen conditions so linked goals are ensured; for software agents this yields requirements on operations. <b>Conflicting goals:</b> a <b>boundary condition</b> shows logical inconsistency; resolution e.g. <b>keep the safety goal and weaken the other</b>.</div>\n\n<div class=\"source-note\"><strong>Responsibility boxes in the supplied diagram</strong><p>On pp. 5–6, the boxes labeled Tracking System, OnBoard TrainController, Speed/Acceleration ControlSystem and Communication Infrastructure identify responsible agents; Resp links assign leaf goals to them. Read the class figure in the train-control lesson.</p></div><h3>The satisfaction relations on the supplied slide</h3><table><thead><tr><th>Relation</th><th>What the extra conditions mean</th></tr></thead><tbody><tr><td><code>S, Ac, D ⊨ R</code> and <code>S, Ac, D ⊭ false</code></td><td>Specifications, accuracy goals and domain properties establish requirements, with consistent premises.</td></tr><tr><td><code>R, As, D ⊨ G</code> and <code>R, As, D ⊭ false</code></td><td>Requirements, environment expectations/assumptions and domain properties establish goals, with consistent premises.</td></tr></tbody></table><p>This is a more detailed KAOS argument than the shorter WRSPM relation. A difference involving accuracy goals, expectations or consistency is substantive; swapping the order of the same premises is not.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"4\">Open class slides · 4 ↗</button></div>","source":"§10","priority":true,"questions":["kaos-0","kaos-1","kaos-2","kaos-3"],"frq":["frq-kaos-1","frq-kaos-3","frq-kaos-4"]},{"id":"formalizable-goals","module":"goals","title":"Formalizable goals of KAOS","intro":"Recognize and write Achieve, Cease, Maintain and Avoid goals with an explicit temporal scope.","keys":["Achieve / Cease: something eventually becomes true / false.","Maintain / Avoid: a required condition holds / a bad condition never holds.","A deadline needs bounded eventuality; eventually alone does not mean within 30 seconds."],"html":"<h3>Formalizable goals of KAOS</h3><p>A formalizable goal has a precise condition over defined objects, states and time. Refine vague intentions until their satisfaction can be evaluated. <code>P</code> is the trigger/context; <code>Q</code> is the target condition. <code>□</code> means always and <code>◇</code> means eventually.</p><table><thead><tr><th>Pattern</th><th>Typical temporal form</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>Achieve</td><td><code>□(P → ◇Q)</code></td><td>Each trigger is eventually followed by Q. Liveness.</td><td>Every accepted request eventually receives a response.</td></tr><tr><td>Cease</td><td><code>□(P → ◇¬Q)</code></td><td>Each trigger is eventually followed by Q becoming false. Liveness.</td><td>After reset, the alarm eventually stops sounding.</td></tr><tr><td>Maintain</td><td><code>□(P → Q)</code></td><td>Whenever P holds, Q must hold. Safety.</td><td>While a train is moving, its doors are closed.</td></tr><tr><td>Avoid</td><td><code>□(P → ¬Q)</code></td><td>Whenever P holds, Q must be false. Safety.</td><td>While a train is moving, its doors are never open.</td></tr></tbody></table><p>Some KAOS presentations use an implicitly always-quantified implication, and distinguish persistent forms such as <code>P → □Q</code>. State the intended scope. <code>◇≤30s Q</code> adds a deadline; unbounded eventuality alone promises no deadline.</p><p>A softgoal such as “easy to use” needs clarification before it becomes a checkable objective. The leaf must also be assigned to an agent able to monitor the relevant state and control the required result.</p><p class=\"src\">Supplemental pattern reference: <a href=\"https://www.cs.scranton.edu/~mccloske/courses/se507/vanLams_kaos_presentation.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">A. van Lamsweerde, Goal-Oriented Requirements Engineering ↗</a></p><div data-lab=\"kaos\"></div><h3>Class-slide formula practice</h3><p>The supplied train slide calls <code>Maintain[TrackSegmentSpeedLimit]</code> and <code>Maintain[WCS-DistBetweenTrains]</code> formalizable goals. Study their quantified definitions in the new train-control lesson.</p><div class=\"actions\"><button class=\"button secondary\" data-action=\"lesson\" data-value=\"kaos-train\">Study the class train formulas</button></div><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"3\">Open class slides · 3 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"5\">Open class slides · 5 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"17\">Open class slides · 17 ↗</button></div><div class=\"source-note\"><strong>A label inconsistency in the KAOS deck</strong><p>Page 3 lists Maintain next to “Liveness,” but the appendix on p. 17 calls Maintain/Avoid “always” goals. Classify the formula itself: an invariant such as □(P→Q) is a safety constraint, while P→◇Q expresses eventual progress. State the formula and example when explaining the distinction.</p></div><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"3\">Open class slides · 3 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"17\">Open class slides · 17 ↗</button></div>","source":"§10 + added four-pattern table","priority":true,"questions":["formalizable-goals-0","formalizable-goals-1","formalizable-goals-2","formalizable-goals-3"],"frq":["frq-kaos-2","frq-added-5","frq-added-6","frq-added-31"]},{"id":"kaos-train","module":"goals","title":"KAOS train-control formulas & conflicts","intro":"Read the actual train formulas, agent interfaces and operational conditions from the supplied lecture slides.","keys":["Know TrackSegmentSpeedLimit, WCS-DistBetweenTrains and SafeCmdMsg.","Distinguish monitored train state from controlled command outputs.","The speed goals conflict when f(distance-to-obstacle) ≤ 7 under the stated acceleration condition."],"html":"<h3>The formalizable goals actually shown in class</h3><table><thead><tr><th>Goal</th><th>Formula / interpretation</th></tr></thead><tbody><tr><td>Maintain[TrackSegmentSpeedLimit]</td><td><code>∀ tr:Train, s:TrackSegment:<br>On(tr,s) ⇒ tr.Speed ≤ s.SpeedLimit</code><br>A train on a segment stays within that segment’s speed limit.</td></tr><tr><td>Maintain[WCS-DistBetweenTrains]</td><td><code>∀ tr1,tr2:Train:<br>Following(tr1,tr2) ⇒ tr1.Loc − tr2.Loc &gt; tr1.WCS-Dist</code><br>WCS-Dist is worst-case stopping distance. Read Following and the location convention exactly as defined by the model; do not silently reverse the inequality.</td></tr><tr><td>Maintain[SafeCmdMsg]</td><td>For every sent command message cm associated with train t1 following t2:<br><code>cm.Accel ≤ F(t1,t2) ∧ cm.Speed &gt; G(t1)</code>.<br>The slide treats F and G as named bounds; it does not provide their numeric definitions.</td></tr></tbody></table><p>The implication in these formulas is read as an invariant over the relevant states. The exact train examples are <strong>Maintain</strong> goals. Achieve/Maintain/Avoid are named in the deck; Cease is retained in the Quest as supplemental KAOS pattern knowledge.</p><figure class=\"class-figure\"><div data-slide-preview=\"kaos:5\"></div><figcaption>KAOS p. 5: softgoals, formalizable goals, WHY/HOW refinements and the train object model. <div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"5\">View full slide · 5 ↗</button></div></figcaption></figure><h3>WHY, HOW and responsibility in the train diagram</h3><ul><li>WHY moves from maintaining worst-case separation toward avoiding collisions and achieving safe transport.</li><li>HOW refines separation into safe speed/acceleration commands, safe train response to commands and assumptions about the preceding train’s stopping behavior.</li><li>The boxes named Tracking System, OnBoard TrainController, Speed/Acceleration ControlSystem and Communication Infrastructure are <strong>agents</strong> assigned leaf goals by <code>Resp</code> links. Use these labels to identify the responsibility boxes in the figure.</li><li>The Train and TrackSegment compartments form an object model. A cloud such as Min[TimeBetweenStations] is a softgoal, not a formalized invariant.</li></ul><h3>Monitored vs. controlled phenomena</h3><table><thead><tr><th>Interface element</th><th>Role in the slide</th></tr></thead><tbody><tr><td>Train.Loc / Train.Speed</td><td>Monitored information about the train; the Tracking System supplies train information.</td></tr><tr><td>CommandMessage</td><td>A controlled output of the Speed/Acceleration ControlSystem.</td></tr><tr><td>Train.Accel</td><td>Controlled through the OnBoard TrainController in the depicted architecture.</td></tr><tr><td>Realizable leaf</td><td>Its responsible agent must be able to observe the needed conditions and control the required result.</td></tr></tbody></table><h3>Operationalization</h3><p>For <code>SendCommandMessage</code>, the domain precondition includes <code>¬cm.Sent</code>; the domain postcondition includes <code>cm.Sent ∧ cm.TrainID = tr.ID</code>. Strengthen these domain conditions with required preconditions/postconditions or triggers so the assigned goals are ensured. For a software agent, those strengthened conditions become requirements on the operation.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"6\">Open class slides · 6 ↗</button></div><h3>Derive the conflict boundary</h3><p>Under <code>Acc_CM ≥ 0</code>, one goal requires <code>Speed_CM ≤ Speed + f(distance-to-obstacle)</code>, while another requires <code>Speed_CM &gt; Speed + 7</code>. They cannot both hold when <code>f(distance-to-obstacle) ≤ 7</code>. Keep the safety bound and weaken the other goal, for example by allowing an exception when that boundary holds. The existence of the boundary state, not merely drawing an X, establishes the conflict.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"7\">Open class slides · 7 ↗</button></div>","source":"KAOS-AORE pp. 5–7","priority":true,"questions":["kaos-train-0","kaos-train-1","kaos-train-2","kaos-train-3"],"frq":["frq-added-16","frq-added-17"]},{"id":"istar","module":"agents","title":"i*: strategic dependency & rationale","intro":"Model why intentional actors rely on one another, not only which messages they exchange.","keys":["SD: goal, softgoal, resource and task dependencies among actors.","SR: internal task decomposition and means–ends reasoning.","KAOS emphasizes formal goal refinement; i* emphasizes intentional actors and organizational dependencies."],"html":"<ul><li>Hammer, “Reengineering Work: <i>Don’t Automate, Obliterate</i>” (HBR 1990): is the system to be built per the SRS going to be helpful or harmful? how do we come up with the SRS? – motivates modeling the <b>organizational context</b>.</li>\n<li><b>i*</b> – early 90s (Yu); gives structure to asking <b>“why?”</b> in RE; models organizational context of information systems; based on the <b>intentional actor</b>.</li>\n<li><b>Strategic Dependency (SD) model</b> – relationships <i>between</i> actors: <b>goal/softgoal dependency</b> (actor depends on another to attain a goal), <b>resource dependency</b> (needs a resource), <b>task dependency</b> (needs another to carry out a task).</li>\n<li><b>Strategic Rationale (SR) model</b> – concerns and interests <i>inside</i> actors: task decompositions; <b>means-ends</b> links between tasks and goals.</li>\n<li>Slide question: “Can you represent this in UML?” (UML has actors but no native intentional dependencies.) <b>GORE (KAOS)</b> focuses on goals; <b>AORE (i*)</b> on agents/actors and their dependencies.</li></ul>\n\n","source":"§11","priority":false,"questions":["istar-0","istar-1","istar-2","istar-3"],"frq":["frq-kaos-5"]},{"id":"istar-case","module":"agents","title":"i* insurance case & enterprise reengineering","intro":"Identify depender, dependee and dependency type, and explain the organizational reason for a system.","keys":["SD dependencies connect actors; SR exposes internal rationale and alternatives.","Car-repair diagrams distinguish goals, resources, tasks and softgoals.","An implemented SRS can still automate an unhelpful business process."],"html":"<h3>Why enterprise reengineering precedes automation</h3><p>The order-processing example connects a buyer, dealer, customer support, factory, transportation, accounting and financing. Long delays and errors motivate asking which goals should be supported and whose work should change. Implementing an SRS faithfully does not prove that the resulting organizational process helps its stakeholders.</p><table><thead><tr><th>Perspective</th><th>Questions to ask</th></tr></thead><tbody><tr><td>Goals</td><td>Why should this system exist? Whose goals are being pursued: customer, dealer, factory, supplier, driver, loan officer, developer?</td></tr><tr><td>Work</td><td>Which agents, activities and operations does the system support?</td></tr><tr><td>Information</td><td>Which information flows help the enterprise operate?</td></tr><tr><td>Cross-functional behavior</td><td>How does the workflow coordinate roles rather than merely automate each local activity?</td></tr></tbody></table><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"9\">Open class slides · 9 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"10\">Open class slides · 10 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"11\">Open class slides · 11 ↗</button></div><h3>Read the car-insurance Strategic Dependency example</h3><table><thead><tr><th>Dependency element</th><th>Class-slide example / meaning</th></tr></thead><tbody><tr><td>Depender</td><td>The actor relying on another actor for the dependency.</td></tr><tr><td>Dependee</td><td>The actor expected to deliver it.</td></tr><tr><td>Goal dependency</td><td>Car Repaired / Repairs Be Covered: a desired outcome, without prescribing the means.</td></tr><tr><td>Resource dependency</td><td>Claims Payout / Payment for Repairs: information or resources another actor provides.</td></tr><tr><td>Task dependency</td><td>Appraise Damages: a specified activity the other actor must perform.</td></tr><tr><td>Softgoal dependency</td><td>Fair Repair Appraisal / Customer Be Happy / Minimal Repairs: quality intentions requiring judgment.</td></tr></tbody></table><figure class=\"class-figure\"><div data-slide-preview=\"kaos:14\"></div><figcaption>KAOS p. 14: body shop, car owner, insurance company and appraiser, with the dependency legend. <div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"14\">View full slide · 14 ↗</button></div></figcaption></figure><h3>Strategic Rationale alternatives</h3><p>The SR diagram opens the reasoning behind <code>ClaimBeSettled</code>. It compares handling the claim centrally, letting an agent handle a small claim and letting a body shop handle a small claim. It further decomposes activities such as verifying policy, preparing a settlement offer and making an offer to settle.</p><p>UML can draw actors and interactions, but ordinary UML associations do not directly provide i*’s intentional dependency and means–ends semantics. The model asks what a software agent should do <em>and why</em>.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"12\">Open class slides · 12 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"13\">Open class slides · 13 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"kaos\" data-value=\"15\">Open class slides · 15 ↗</button></div>","source":"KAOS-AORE pp. 9–15","priority":true,"questions":["istar-case-0","istar-case-1","istar-case-2","istar-case-3"],"frq":["frq-added-18","frq-added-19"]},{"id":"nfr-basics","module":"nfr","title":"NFR concepts, properties & classifications","intro":"Clarify which quality matters, to whom, in what context, and how it interacts with other qualities.","keys":["NFRs can be subjective, graded, interacting and relative.","Address quality goals alongside functional requirements throughout development.","FURPS+: Functionality, Usability, Reliability, Performance, Supportability, plus other constraints."],"html":"<h3 id=\"nfr-what\">12.1 What are NFRs? Why?</h3>\n<ul><li><b>Why:</b> concerns like quality drive just about everything – brochures sell <i>qualities</i> (luxury, safety, ease of use, security) not basic function (cars, cell phones, home networking, CASE tools). Soft is harder than hard.</li>\n<li><b>Colloquially</b> “-ilities” (understandability, usability, modifiability, interoperability, reliability, portability, maintainability, scalability, traceability…), “-ities” (security, simplicity, integrity, safety, modularity…), “-ness” (user-friendliness, robustness, timeliness, responsiveness, correctness…), plus performance, efficiency, accuracy, cost, time-to-market, etc. They are <b>soft: subjective, ambiguous, conflicting, global</b>.</li>\n<li><b>IEEE definition:</b> a software requirement describing not <i>what</i> the software will do but <i>how</i> it will do it – performance, external interface requirements, design constraints, quality attributes; <b>difficult to test, so usually evaluated subjectively</b>. Generally: informally stated, often contradictory, difficult to enforce during development and evaluate before delivery.</li></ul>\n<h3>12.2 Classification schemes</h3>\n<table><tr><th>#</th><th>Scheme</th><th>Categories</th></tr>\n<tr><td>1</td><td>Roman 1985</td><td>Interface, performance (time/space bounds, reliability, security, survivability), operating, lifecycle, economic, political requirements</td></tr>\n<tr><td>2</td><td>Sommerville 1992</td><td>Process, product and external considerations</td></tr>\n<tr><td>3</td><td>McCall’s list</td><td>3 classes + 3 levels (product operation, revision, transition)</td></tr>\n<tr><td>4</td><td>Grady 1992 – <b>FURPS+</b></td><td><b>F</b>unctionality, <b>U</b>sability, <b>R</b>eliability, <b>P</b>erformance, <b>S</b>upportability (+ testability, extensibility, adaptability, maintainability, compatibility, configurability, serviceability, installability, localizability, robustness)</td></tr>\n<tr><td>5</td><td>Boehm 1976 <b>Software Quality Tree</b></td><td>2 classes (as-is utility, maintainability, portability) + 3 levels (e.g., reliability → accuracy, completeness, robustness/integrity, consistency; efficiency; human engineering; testability, understandability, modifiability)</td></tr>\n<tr><td>6</td><td>Brugge – design-goal relationships</td><td>Client vs end user vs developer/maintainer concerns (low cost, usability, runtime efficiency, portability, modifiability…)</td></tr></table>\n<p>Classification “is supposed to bring order into chaos, but…” – NFRs remain subjective in both definitions and solutions.</p>\n<h3>12.3 Four essential properties of NFRs (“what”)</h3>\n<div class=\"def\"><b>Non-functional, subjective, graded, interacting – and relative</b> (in both definitions <i>and</i> solutions).\n<ul><li><b>Subjective:</b> “security” – protection of data alone fine with Chris; plus availability fine with Pat; plus accuracy – Alex; plus virus filtering – Neo; plus blocking adware – Gail. Solutions too: password (Chris) → + periodic change (Pat) → + fingerprint (Alex) → fingerprint rechecked hourly (Neo) → + co-presence of two people (Gail).</li>\n<li><b>Graded:</b> worse↔better, expensive↔cheaper, slower↔faster; e.g., “protection of data alone” ≪ “protection + availability”; password ≪ password + fingerprint.</li>\n<li><b>Interacting:</b> <b>conflicting</b> (the whole is less than the sum of its parts – password + hourly fingerprint is good for security but hurts ease-of-use) or <b>synergistic</b> (the whole is more than the sum – restricted access helps data accuracy; simplicity is key to ease-of-use).</li>\n<li><b>Relative priorities:</b> varies among stakeholders and contexts (security vs performance vs reliability vs usability vs safety).</li></ul></div>\n<p><b>Mathematical perspective:</b> a function composes: <code>f(x,y) = f1(f2(x), f3(y))</code> (e.g., sum: R×R→R). A non-functional property composes <i>globally</i> and non-additively: <code>nf(x,y) = nf1(nf2(x), nf3(y))</code> or with a normalizing <code>n(·)</code> – e.g., Fast(f), Fast(f2), Precise(f)…; “how fast can it be done?”, “how precise is the answer?”</p>\n<h3>12.4 NFRs and the RE process</h3>\n<ul><li>Quality of <b>product</b> and quality of <b>process</b>: garbage in, garbage out → get the right requirements <i>and</i> the right process. Where are NFRs in RE – before, after, or alongside FRs? (Answer implied: interleaved with goals, FRs, architecture, models.)</li>\n<li><b>Product-oriented</b> approaches: measure the system once built (metrics). <b>Process-oriented</b>: use NFRs to drive design decisions. <b>Quantitative</b>: measurable scales, calculate how much a design meets targets. <b>Qualitative</b>: relationships among quality goals, trade-off reasoning. Quotes: Sommerville – measurement as practised in other engineering is <i>impossible</i> for software; Deming – “the most important things can’t be measured”; Einstein – “Not everything that can be counted counts, and not everything that counts can be counted.”</li></ul>\n<div class=\"source-note\"><strong>Quality requirements can be testable</strong><p>A vague quality goal needs clarification; a quantified quality requirement can have an objective fit criterion. “Non-functional” does not mean inherently untestable or permission to prescribe an implementation.</p></div>","source":"§12.1–12.4","priority":false,"questions":["nfr-basics-0","nfr-basics-1","nfr-basics-2","nfr-basics-3"],"frq":["frq-nfr-1","frq-added-11"]},{"id":"quality-methods","module":"nfr","title":"Quality trees, measurement & QFD","intro":"Read the classification branches and weighted-rating example, and distinguish the House of Quality from a SIG.","keys":["McCall groups qualities under operation, revision and transition.","The weighted example is 0.3×6 + 0.6×5 + 0.1×7 = 5.5.","QFD is a what/how matrix; SIGs make softgoal refinements and contributions explicit."],"html":"<h3>Classification trees: the details behind the headings</h3><table><thead><tr><th>Scheme</th><th>Details shown in the supplied deck</th></tr></thead><tbody><tr><td>Roman</td><td>Interface, performance, operating, lifecycle, economic and political. Performance includes time/space, reliability, security and survivability; lifecycle includes design quality and development limits.</td></tr><tr><td>Sommerville</td><td>Process considerations (method, implementation environment, decision tracing, design choices), product considerations (integration, performance, capacity, security, integrity), external considerations (social, economic, contractual and political).</td></tr><tr><td>McCall: product operation</td><td>Usability, integrity, efficiency, correctness and reliability.</td></tr><tr><td>McCall: product revision</td><td>Maintainability, testability and flexibility.</td></tr><tr><td>McCall: product transition</td><td>Reusability, portability and interoperability.</td></tr><tr><td>Boehm</td><td>General utility branches to portability, as-is utility and maintainability. As-is utility includes reliability, efficiency and human engineering; maintainability includes testability, understandability and modifiability.</td></tr><tr><td>FURPS+</td><td>Functional capability, usability, reliability, performance and supportability overlap other quality classifications. The slide includes security under functionality and accuracy under reliability, illustrating why labels alone do not settle meaning.</td></tr></tbody></table><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"11\">Open class slides · 11 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"12\">Open class slides · 12 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"13\">Open class slides · 13 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"14\">Open class slides · 14 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"15\">Open class slides · 15 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"16\">Open class slides · 16 ↗</button></div><h3>From a quality concept to a measure</h3><p>The product-oriented diagram goes from a quality concept to a measurable quantity, then to counts or observations from a design or execution. Its examples connect reliability to failure timing, complexity to information flow/module calls and usability to time needed to learn or complete tasks.</p><h3>Weighted quality rating — exact slide example</h3><table><thead><tr><th>Property</th><th>Relative weight</th><th>Rating</th><th>Weighted contribution</th></tr></thead><tbody><tr><td>Speed</td><td>0.3</td><td>6</td><td>1.8</td></tr><tr><td>Size</td><td>0.6</td><td>5</td><td>3.0</td></tr><tr><td>Ease of use</td><td>0.1</td><td>7</td><td>0.7</td></tr><tr><td>Total</td><td>1.0</td><td>—</td><td>5.5 / 10</td></tr></tbody></table><p>Choose relevant attributes, assign weights, rate alternatives on a defined scale, compute weight × rating and sum. The arithmetic does not justify the choice of properties, weights, scales or ratings; those assumptions must be explained.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"20\">Open class slides · 20 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"21\">Open class slides · 21 ↗</button></div><h3>Quality Function Deployment (QFD): the House of Quality</h3><p>QFD relates customer “whats” to technical “hows,” with importance, relationships and correlations shown in a matrix and its roof. The lecture describes it as intuitive and rich in relationships, but criticizes its lack of explicit links to problems and the lack of structured NFR and solution refinements in the depicted form. A QFD matrix is not a SIG.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"41\">Open class slides · 41 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"42\">Open class slides · 42 ↗</button></div>","source":"NFR-18 slides 10–21, 41–42","priority":true,"questions":["quality-methods-0","quality-methods-1","quality-methods-2","quality-methods-3"],"frq":["frq-added-20","frq-added-21"]},{"id":"nfr-measures","module":"nfr","title":"Individual NFRs & quality measures","intro":"Use measures to clarify quality targets while recognizing context and tradeoffs.","keys":["Availability = MTTF / (MTTF + MTTR); multiply by 100 for percent.","Under the notes’ convention, MTBF = MTTF + MTTR.","Dependability brings availability, reliability, safety and security together."],"html":"<h3 id=\"nfr-ind\">12.5 Individual NFRs</h3>\n<table><tr><th>NFR</th><th>Key points</th></tr>\n<tr><td><b>Reliability</b></td><td>Behave consistently in a user-acceptable manner. <b>MTTF</b> (mean time to failure), <b>MTTR</b> (to repair), <b>MTBF</b> = MTTF+MTTR; <b>Availability = MTTF / (MTTF + MTTR) × 100%</b>. Hardware “<b>bathtub curve</b>” (infant mortality → constant failure rate → wear &amp; tear) – issues: does software wear out? do two copies differ? Requirements like “no more than X bugs/1K LOC” need a way to count bugs: <b>bebugging</b> (Monte Carlo seeding): detected seeded / total seeded = detected real / total real → total bugs = seeded × detected / detected-seeded.</td></tr>\n<tr><td><b>Portability</b></td><td>Ease of converting software to another platform; e.g., # of target statements; improved by standardized languages/OSs/tools (C/C++/Java, J2EE/J2ME/.NET); hard to quantify.</td></tr>\n<tr><td><b>Efficiency</b></td><td>Use of scarce resources (CPU, memory, disk, buffers, channels). Dimensions: <b>capacity</b>, <b>degradation of service</b> (what happens at X+1 widgets – degrade or crash), <b>timing constraints</b> (stimulus–response, response–response, stimulus–stimulus, response–stimulus, e.g., dial tone within 10 s).</td></tr>\n<tr><td><b>Usability</b></td><td>Broadly: quality, fit to use; narrowly: good UI. Make it measurable: “95% of users complete tasks X, Y, Z in under 10 min without assistance; 80% task Y in 10 min; 77% task Z in 5 min.” <b>Usability inspection</b> and heuristics: Nielsen’s 9 / Molich–Nielsen’s 10 (simple natural dialogue; speak the user’s language; minimize memory load; consistency; feedback; clearly marked exits; shortcuts; precise and constructive error messages; prevent errors; help and documentation). Also promptness, tolerance, guidance, coherence.</td></tr>\n<tr><td><b>Dependability</b></td><td>Dimensions: <b>availability</b> (deliver services when requested), <b>reliability</b> (as specified), <b>safety</b> (no catastrophic failure), <b>security</b> (protect against accidental/deliberate intrusion). Costs of failure (direct: life, business; indirect: litigation, goodwill). Improve reliability through fault avoidance, detection/removal, tolerance. <b>Safety</b>: hazard identification, risk analysis, classification (<i>intolerable</i> / <i>ALARP</i> / <i>acceptable</i>), IEC 61508 life cycle; <b>fault tree</b> (deductive: start with the failure/hazard and work back to causes). <b>Security</b> threats: denial of service, corruption of programs/data, unauthorized disclosure.</td></tr></table>\n","source":"§12.5","priority":false,"questions":["nfr-measures-0","nfr-measures-1","nfr-measures-2","nfr-measures-3"],"frq":["frq-nfr-5","frq-added-30"]},{"id":"dependability-details","module":"nfr","title":"Dependability metrics, safety & security","intro":"Choose a reliability metric with meaningful units and follow the hazard/security reasoning in the appendix.","keys":["POFOD is per demand; ROCOF is a rate; MTTF is time; AVAIL is a fraction.","Classify failure types and distinguish avoidance, removal and tolerance.","Use explicit assumptions for series/redundant failure probabilities; distinguish all four timing pairs."],"html":"<h3>Reliability metrics in the appendix</h3><table><thead><tr><th>Metric</th><th>Meaning</th><th>Suitable use / unit</th></tr></thead><tbody><tr><td>POFOD</td><td>Probability of failure on demand.</td><td>For occasional demands, including emergency systems. <code>0.0001</code> means 1 failed demand per 10,000 demands on average.</td></tr><tr><td>ROCOF</td><td>Rate of occurrence of failures.</td><td>Failures per stated time or operation interval; define the denominator. <code>2/1000</code> is incomplete without the interval/unit.</td></tr><tr><td>MTTF</td><td>Mean time to failure.</td><td>Expected operating time until failure, in stated time units.</td></tr><tr><td>AVAIL</td><td>Probability/fraction of time service is available.</td><td>For continuous service. <code>0.999</code> corresponds to 99.9% availability, or about 999 up units per 1,000 units in the model.</td></tr></tbody></table><p>Classify failure types before setting targets: transient/permanent; recoverable/unrecoverable; corrupting/non-corrupting. Specify hardware, software and operator responsibilities, and distinguish functional error-detection/recovery behavior from quality targets.</p><h3>Failure combination: state the assumptions</h3><p>If a series service needs all independent components, failure probability is <code>1 − ∏(1 − pᵢ)</code>. A sum is an approximation for small failure probabilities, or an upper bound by the union bound; it is not generally an exact formula for dependent components. For independent redundant components where all must fail before service fails, use <code>∏pᵢ</code>; identical components give <code>pⁿ</code>.</p><div class=\"source-note\"><strong>Slide shorthand</strong><p>Slide 93 gives “sum” and “p to the nth” shorthand. State the event model and independence assumptions when using either, so the arithmetic expresses the intended architecture.</p></div><h3>Safety and security vocabulary</h3><table><thead><tr><th>Term / technique</th><th>Meaning / role</th></tr></thead><tbody><tr><td>Hazard</td><td>A condition with potential for harm; distinguish it from an accident and the resulting damage.</td></tr><tr><td>Risk assessment</td><td>Consider hazard probability and severity; classify as intolerable, ALARP or acceptable. ALARP means as low as reasonably practicable.</td></tr><tr><td>Safety measures</td><td>Hazard avoidance, hazard detection/removal and damage limitation. Complete safety cannot be presumed: specification gaps, hardware failure, software limits and incorrect inputs remain relevant.</td></tr><tr><td>Fault tree</td><td>Start from a hazard/failure and work backward to potential causes. The lecture also contrasts this with forward/inductive analysis from causes.</td></tr><tr><td>Vulnerability / threat / attack</td><td>A weakness; a potential adverse cause/event; and an attempt to exploit a weakness. Controls reduce likelihood or consequences.</td></tr><tr><td>Security cycle</td><td>Identify/evaluate assets → analyze threats and risks → assign threats to assets → examine available controls → specify protection and response.</td></tr><tr><td>Reliability improvement</td><td>Fault avoidance, detection/removal and fault tolerance; tests exercise a workload, so field use may expose different faults.</td></tr></tbody></table><h3>Timing constraints: all four event pairs</h3><table><thead><tr><th>Pair</th><th>Class example</th></tr></thead><tbody><tr><td>Stimulus → response</td><td>Phone picked up → system dial tone within 10 seconds.</td></tr><tr><td>Response → response</td><td>Dial tone generated → system records “phone in use” within 1 microsecond.</td></tr><tr><td>Stimulus → stimulus</td><td>User types login name → user types password within 15 seconds.</td></tr><tr><td>Response → stimulus</td><td>Dial tone supplied → user starts dialing within 1 minute.</td></tr></tbody></table><p>Some timing constraints describe environment behavior rather than an outcome software can enforce. Assign the responsibility explicitly.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"25\">Open class slides · 25 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"88\">Open class slides · 88 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"89\">Open class slides · 89 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"90\">Open class slides · 90 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"91\">Open class slides · 91 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"92\">Open class slides · 92 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"93\">Open class slides · 93 ↗</button></div>","source":"NFR-18 slides 25, 88–93","priority":true,"questions":["dependability-details-0","dependability-details-1","dependability-details-2","dependability-details-3"],"frq":["frq-added-22","frq-added-23"]},{"id":"sig","module":"nfr","title":"NFR Framework & Softgoal Interdependency Graphs","intro":"Build a SIG from English, justify contributions, then evaluate the tradeoffs from leaves upward.","keys":["Type[Topic], with ! or !! priorities, states the quality and scope.","NFR, operationalizing and claim softgoals have different roles.","Make/Help/Hurt/Break differ in strength and sign; mixed evidence differs from unknown evidence."],"html":"<h3>Plain English → SIG: worked example</h3><p><strong>Statement:</strong> Account security requires integrity, confidentiality and availability. Integrity requires accurate and complete records. Password and fingerprint authentication help confidentiality. Fingerprint authentication hurts ease of use.</p><div data-lab=\"sig-diagram\"></div><table><thead><tr><th>Step</th><th>What to put in the graph</th></tr></thead><tbody><tr><td>1. Name goals</td><td>Security[Accounts], Integrity[Accounts], Confidentiality[Accounts], Availability[Accounts], Accuracy[Records], Completeness[Records], EaseOfUse[Login].</td></tr><tr><td>2. Refine</td><td>Use AND for all required aspects; use OR only where alternatives suffice.</td></tr><tr><td>3. Operationalize</td><td>Add Password authentication and Fingerprint authentication as bold-outline operationalizing clouds. If both are required, represent the combined technique explicitly.</td></tr><tr><td>4. Contribute</td><td>Draw + Help arrows from the techniques to Confidentiality, and a − Hurt arrow from Fingerprint to EaseOfUse. Do not claim Make without evidence that the technique is sufficient.</td></tr><tr><td>5. Justify</td><td>Add a dashed claim cloud when evidence or an assumption explains a choice or contribution. Claims are rationale, not automatically established facts.</td></tr><tr><td>6. Evaluate</td><td>Assign justified leaf labels, propagate upward and inspect conflicts. Record priorities and trace choices to the quality goals.</td></tr></tbody></table><h3>Label propagation — what an exam answer must explain</h3><table><thead><tr><th>Link / label</th><th>Interpretation</th></tr></thead><tbody><tr><td>Make ++</td><td>Strong positive contribution: decisive evidence in favor of the destination when the source is accepted.</td></tr><tr><td>Help +</td><td>Partial positive support; does not by itself guarantee a satisficed destination.</td></tr><tr><td>Hurt −</td><td>Partial negative support; does not by itself guarantee a denied destination.</td></tr><tr><td>Break −−</td><td>Strong negative contribution: decisive evidence against the destination when the source is accepted.</td></tr><tr><td>AND</td><td>All required children must be satisficed to support the parent; denial of a required child can deny it.</td></tr><tr><td>OR</td><td>One sufficient alternative can support the parent; denying just one alternative does not deny the parent.</td></tr><tr><td>Conflicting</td><td>Both positive and negative evidence are present. This differs from not knowing.</td></tr><tr><td>Undetermined U</td><td>The available evidence does not justify a decision.</td></tr></tbody></table><div class=\"source-note\"><strong>Use contribution strength as well as sign.</strong><p>Do not collapse Help into Make or Hurt into Break. The lab below uses decisive Make/Break links and four labels so its cases are explicit. Detailed partial-label or numeric schemes must use the rules given in the course deck.</p></div><div data-lab=\"sig\"></div><p class=\"src\">Framework reference: <a href=\"https://personal.utdallas.edu/~chung/ftp/science_sa3.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Subramanian & Chung, NFR Framework notation ↗</a></p><h3 id=\"sig\">12.6 The NFR Framework (Chung, Nixon, Yu, Mylopoulos)</h3>\n<div class=\"def\"><b>Softgoal:</b> no clear-cut criterion for being met; NFRs are subjective, relative, interdependent; no optimal solution → <b>satisficing</b> (achieved within acceptable limits). One softgoal can contribute positively/negatively, fully/partially to others. The framework is <b>qualitative, process-oriented</b>; uses <b>Softgoal Interdependency Graphs (SIGs)</b>, a <b>labeling (evaluation) procedure</b>, and <b>catalogues</b> (like design patterns) for NFR knowledge and correlations. NFRs are the basis for exploring alternatives and the criteria for selecting among them (rationalization).</div>\n<table><tr><th>Element</th><th>Details</th></tr>\n<tr><td>Softgoal types</td><td><b>NFR softgoal</b>; <b>operationalizing softgoal</b> (satisficing technique/solution – “cloud” with bold outline); <b>claim softgoal</b> (justification/argument supporting a choice, dashed cloud)</td></tr>\n<tr><td>Syntax</td><td>Softgoal ::= <b>Priority Type [Topic]</b> – e.g., <code>!!Accuracy[Account]</code>. Priority marks <b>!</b> (important), <b>!!</b> (very important); topic/parameter narrows scope (global → local), e.g., Security[Home Networking].</td></tr>\n<tr><td>Decomposition</td><td><b>AND</b> (all subgoals needed) and <b>OR</b> (alternatives). Three refinement kinds: refine <b>type</b>, refine <b>topic</b>, refine <b>priority</b>; plus <b>operationalize</b>.</td></tr>\n<tr><td>Contributions</td><td><b>Make (++) &gt; Help (+) &gt; Hurt (−) &gt; Break (−−)</b> – plus “U” (undetermined) when unknown.</td></tr>\n<tr><td>Labels (evaluation)</td><td><b>satisficed (✓), denied (✗), conflicting, undetermined</b>; propagated bottom-up through AND/OR and contributions; the result tells whether top-level softgoals are satisficed. Priorities can be used (quantitative variant on NFR-18 slide 64: numeric values −1…1, priorities !!, !).</td></tr>\n<tr><td>Semantics</td><td>Proposition = softgoal ∪ contribution. <code>If satisficed(HELP(G0,G1)) then ∃ propositions G2…Gn such that …</code>; <code>Und(G0,G1) = MAKE ∨ HELP ∨ HURT ∨ BREAK</code>.</td></tr></table>\n<div class=\"ex\"><b>Construction process (iterative, interleaving):</b> post NFR softgoals → refine them until meaning is clear (type, topic list, priority) → operationalize → refine operationalizing softgoals until all parts and relationships are designed (“one person’s floor is another person’s ceiling”) → justify with claim softgoals → evaluate satisficing degree.</div>\n<div class=\"ex\"><b>Worked slide examples:</b> <b>Security</b> → Integrity, Confidentiality, Availability; <b>Authentication</b> → password / fingerprint / password+fingerprint; <b>Performance</b> → Time-P, Space-P, Responsiveness → indexing (single-level, multi-level; keyword-based, category-based). <b>Home networking</b> (HACS): security of garage door, home networking, home security controller; lighting fixed vs variable; claim “no reported break-in incidents due to fixed lighting” (NFR-18 59–65). <b>Accounts example</b> (NFR-18 45–47): Secure Accounts → Availability, Integrity (Accuracy/Completeness), Confidentiality of Accounts; topics Regular/Gold/Premier account, highSpending, history; operationalizations Validation and Auditing; claims “one of the vital few”, “policy of rigorous examination on high spending”; agents (class-I secretary, supervisor, manager, auditor) as topics.</div>\n<h3>12.7 Knowledge reuse, reference model, Dos &amp; Don’ts</h3>\n<ul><li><b>Catalogues &amp; correlation rules</b> (NFR-18 69): e.g., Security [weaponry-info] → Integrity/Confidentiality/Availability; Authentication, Fingerprint verification; claims (“MIL Std”, “common practice”; fingerprinting can feel like criminal treatment or like VIP treatment) vs User-friendliness.</li>\n<li><b>NFR Framework + reference model (NFR-18 71–77):</b> <b>Patient monitoring example</b> – D1: a nurse is always close enough to hear a buzzer; D2: sound from the heart falling below a threshold means the heart is (about to) stop; S1: if sensor sound falls below the threshold, actuate buzzer; R1: a warning system notifies the nurse if the heartbeat (is about to) stop; C: microphone as sensor, buzzer as actuator. Goals: G01 best-quality patient care; G02 best-quality monitoring of heart failure; softgoals: low-cost, low-maintenance, easily configurable, proven (warning system); fast (notification); well qualified nurse; clear sound; safe &amp; secure but loud enough buzzer. Alternatives R1′ buzzer vs R1″ beeper. Designation categories: eh (environment-hidden: nurse, heartbeat), ev (visible: sounds from chest), sv (system-visible: buzzer), sh (system-hidden: internal data). Slide 77 continues to <b>architecture</b> (functional components monitor → determine → control sound; stylistic components).</li>\n<li><b>Dos:</b> relate to FRs; clarify scope/topic; identify agents; relate definitions of NFRs to each other and solutions to each other; refine definitions and solutions as many times as needed; prioritize; discover and safeguard against conflicts; discover synergies; discover operationalizations as reasons for conflicts/synergies; determine and justify strengths of contributions; explore alternatives; consider multiple solutions and scenarios; quantify if necessary; evaluate (subjectively/objectively); establish traceability.</li>\n<li><b>Don’ts:</b> absolute security/reliability/safety; “one definition fits all / one solution solves all”; “the contribution is such and such because I say so”; refine only once; dissociate from FRs; “they fall from the sky”; “no quantification, no existence”; “everybody needs the same”; “you name it, our system does it”. NFRs may be more important than FRs but should consume fewer resources.</li>\n<li><b>Conflict-resolution walk-through (NFR-18 80–83):</b> email with zip attachment. Attempted resolutions: delete the email → misunderstanding between sender/receiver → move to junk folder → receiver may not check → notify receiver → notify sender too → still an attack when opened → delete and block the sender / allow only allowed senders / delete only the attachment. Formalized: <code>Security[PC] → S[email] → S[sender] ∧ S[recipient] ∧ S[body] ∧ S[attachment]</code>; Denied(S[attachment]) → Denied(S[email]) → Denied(S[PC]) (label propagation upward).</li></ul>\n","source":"§12.6–12.7 + worked SIG lab","priority":true,"questions":["sig-0","sig-1","sig-2","sig-3"],"frq":["frq-nfr-2","frq-nfr-3","frq-nfr-4","frq-added-7"]},{"id":"sig-class-examples","module":"nfr","title":"SIG class examples & exact propagation","intro":"Work the class elixir/bomb exercise and trace the account and home-network examples without reversing an implication.","keys":["Accepted Make/Break sources supply positive/negative evidence; denied sources do not establish the opposite.","Both active opposing sources conflict; both denied leave U in the class quiz.","Refine type, topic, priority and operationalizations; claims can justify links."],"html":"<h3>The actual label-propagation quiz</h3><p>Read the arrow’s meaning before applying a rule. A strong positive link supplies sufficient positive evidence from an accepted source; denying that source does not prove the destination false. The corresponding point holds for a strong negative link.</p><table><thead><tr><th>Source / relation</th><th>What can be concluded from that evidence alone</th></tr></thead><tbody><tr><td>Satisficed elixir, Make → healthy</td><td>Positive evidence: healthy can be satisficed.</td></tr><tr><td>Satisficed bomb, Break → healthy</td><td>Negative evidence: healthy can be denied.</td></tr><tr><td>Denied elixir on a Make link</td><td>No positive evidence from that source; the target is undetermined without other support.</td></tr><tr><td>Denied bomb on a Break link</td><td>No negative evidence from that source; it does not prove healthy.</td></tr><tr><td>Satisficed Make source and satisficed Break source</td><td>Conflicting support and opposition.</td></tr><tr><td>Both sources denied</td><td>Undetermined, as explicitly labeled U in the slide.</td></tr><tr><td>AND with every required child satisficed</td><td>The parent can be satisficed. A denied required child can deny it.</td></tr><tr><td>OR with a sufficient satisficed alternative</td><td>The parent can be satisficed. A denied alternative alone does not deny it.</td></tr></tbody></table><figure class=\"class-figure\"><div data-slide-preview=\"nfr:63\"></div><figcaption>NFR slide 63: the elixir/bomb quiz, mixed evidence and AND/OR cases. <div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"63\">View full slide · 63 ↗</button></div></figcaption></figure><p>The claim cloud at the right of the quiz attaches to a contribution, demonstrating that rationale may justify an interdependency, not only a goal node. Slide 64 introduces numeric labels and priority marks as a quantitative variant; it does not establish one universal weighted scoring rule for every SIG.</p><h3>Formal semantics on slides 66–67</h3><ul><li>Propositions include softgoals <em>and contributions</em>, so evaluation can depend on whether the link is itself accepted.</li><li>A satisficed source plus an accepted MAKE
