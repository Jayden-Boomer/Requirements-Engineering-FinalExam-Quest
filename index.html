r…","options":["Worst-case stopping distance","World-class software diagram","Workflow control state","Weighted claim support"],"answer":[0],"explanation":"It is the separation needed under the worst-case stopping assumption."},{"id":"kaos-train-1","lesson":"kaos-train","tier":1,"prompt":"Which is the class formula for TrackSegmentSpeedLimit?","options":["On(tr,s) ⇒ tr.Speed > s.SpeedLimit","Following(tr1,tr2) ⇒ tr1 = tr2","cm.Sent ⇒ ¬cm.Sent","On(tr,s) ⇒ tr.Speed ≤ s.SpeedLimit"],"answer":[3],"explanation":"The invariant bounds the train’s speed by the segment’s allowed speed."},{"id":"kaos-train-2","lesson":"kaos-train","tier":2,"prompt":"Which is a controlled output of the Speed/Acceleration ControlSystem in the interface diagram?","options":["A customer’s opinion","CommandMessage","The patient’s heartbeat","A QFD rating"],"answer":[1],"explanation":"The system monitors relevant train information and issues command messages."},{"id":"kaos-train-3","lesson":"kaos-train","tier":3,"prompt":"Under nonnegative commanded acceleration, SpeedCM ≤ Speed + f(d) and SpeedCM > Speed + 7 conflict when…","options":["the two formulas are printed on separate pages.","f(d) > 7 in every case.","the agent has no name.","f(d) ≤ 7."],"answer":[3],"explanation":"When f(d) ≤ 7, the upper bound is at most Speed+7, while the other goal demands a value strictly above it."},{"id":"istar-case-0","lesson":"istar-case","tier":0,"prompt":"In i*, the actor relying on another actor is the…","options":["depender.","metaclass.","dependee.","data store."],"answer":[0],"explanation":"The depender needs the dependency fulfilled; the dependee is expected to supply it."},{"id":"istar-case-1","lesson":"istar-case","tier":1,"prompt":"Claims Payout is modeled most naturally as which dependency type?","options":["Resource","Task","Softgoal only","Generalization"],"answer":[0],"explanation":"A payout is a resource delivered by another actor, rather than an unspecified quality intention."},{"id":"istar-case-2","lesson":"istar-case","tier":2,"prompt":"Which model compares central claim handling with agent/body-shop handling and shows internal tasks?","options":["Only an ERD","Only an IDEF0 arrow","Strategic Rationale","Only the context DFD"],"answer":[2],"explanation":"SR reveals internal reasoning, decompositions and alternatives for achieving ClaimBeSettled."},{"id":"istar-case-3","lesson":"istar-case","tier":3,"prompt":"Why does the reengineering example ask whether an SRS-based system will help or harm?","options":["An SRS can never contain a valid requirement.","Business workflow is irrelevant to RE.","Agents cannot have different goals.","Faithful implementation can still automate an unsuitable organizational process."],"answer":[3],"explanation":"Enterprise and agent modeling examine whether the selected process and goals are worth implementing."},{"id":"quality-methods-0","lesson":"quality-methods","tier":0,"prompt":"McCall’s three groups are…","options":["Inception, construction and deployment","Product operation, revision and transition","Inputs, outputs and actors","Claims, goals and programs"],"answer":[1],"explanation":"The quality tree distinguishes operational qualities, change-related qualities and transition/reuse qualities."},{"id":"quality-methods-1","lesson":"quality-methods","tier":1,"prompt":"What is 0.3×6 + 0.6×5 + 0.1×7 in the slide’s rating example?","options":["1.0","7.0","6.0","5.5"],"answer":[3],"explanation":"The weighted contributions are 1.8, 3.0 and 0.7; their sum is 5.5."},{"id":"quality-methods-2","lesson":"quality-methods","tier":2,"prompt":"Which item is in McCall’s product revision group?","options":["Testability","Portability","Correctness","Interoperability"],"answer":[0],"explanation":"Revision groups maintainability, testability and flexibility; transition includes reusability, portability and interoperability."},{"id":"quality-methods-3","lesson":"quality-methods","tier":3,"prompt":"What is a stated lecture criticism of the depicted QFD approach?","options":["It contains no relationships of any kind.","It eliminates the need to justify priorities.","It does not explicitly structure NFR/solution refinements or link them to problems.","It is identical to KAOS temporal logic."],"answer":[2],"explanation":"The slides call QFD intuitive and relationship-rich, while contrasting it with explicit problem/goal/solution reasoning."},{"id":"dependability-details-0","lesson":"dependability-details","tier":0,"prompt":"POFOD measures…","options":["average repair time.","probability of failure on demand.","number of actors per use case.","priority of a formal object definition."],"answer":[1],"explanation":"It is a probability per demand, useful for services with occasional demands."},{"id":"dependability-details-1","lesson":"dependability-details","tier":1,"prompt":"A component has POFOD 0.0001. This corresponds to about…","options":["10 failures per demand.","1 failure every 10 seconds.","1 failed demand per 10,000 demands.","100% availability."],"answer":[2],"explanation":"The denominator is demands, not time; 0.0001 = 1/10,000."},{"id":"dependability-details-2","lesson":"dependability-details","tier":2,"prompt":"Which example is a response → stimulus timing constraint?","options":["System records phone-in-use after generating the dial tone.","System returns a dial tone after handset pickup.","User types a password after entering a login name.","User starts dialing within one minute after receiving a dial tone."],"answer":[3],"explanation":"The first event is a system response and the second an environment/user stimulus."},{"id":"dependability-details-3","lesson":"dependability-details","tier":3,"prompt":"Two independent redundant components must both fail for service failure; each has failure probability p. What is the combined probability?","options":["1−p²","p²","p/2","2p exactly in all architectures"],"answer":[1],"explanation":"Both failures form an intersection. Independence gives p×p; the architecture/event assumption is essential."},{"id":"sig-class-examples-0","lesson":"sig-class-examples","tier":0,"prompt":"The elixir and bomb sources are both denied in the class quiz. Which destination label is explicitly shown?","options":["Always satisficed","A new actor","U, undetermined","Always denied"],"answer":[2],"explanation":"The slide labels the both-denied contribution case U: neither source supplies the active positive/negative evidence."},{"id":"sig-class-examples-1","lesson":"sig-class-examples","tier":1,"prompt":"A denied source on a Make link, without any other evidence, implies…","options":["the link becomes an OR refinement.","the destination must be denied.","the destination is not established; do not automatically deny it.","the destination is necessarily satisfied."],"answer":[2],"explanation":"Make is sufficient positive support from an accepted source. Its converse/contrapositive is not supplied by this qualitative rule."},{"id":"sig-class-examples-2","lesson":"sig-class-examples","tier":2,"prompt":"Accuracy[Account] → Accuracy[GoldAccount] primarily refines…","options":["only the quality type.","the actor’s inheritance.","the programming language.","the topic."],"answer":[3],"explanation":"Accuracy remains the type while the scoped subject changes from all accounts to gold accounts."},{"id":"sig-class-examples-3","lesson":"sig-class-examples","tier":3,"prompt":"Why can a claim attach to a contribution arrow?","options":["It makes empirical evidence unnecessary.","It can justify why that operationalization has the stated effect on the quality.","It converts every Help to Make automatically.","It replaces the domain with code."],"answer":[1],"explanation":"Contributions are propositions in the slide’s semantics, so rationale can support the link as well as a node."},{"id":"nfr-reference-0","lesson":"nfr-reference","tier":0,"prompt":"In the patient-monitoring designation example, chest sounds are…","options":["a class operation.","environment-visible.","a claim dependency.","system-hidden."],"answer":[1],"explanation":"They originate in the environment and are visible to the machine through its sensor."},{"id":"nfr-reference-1","lesson":"nfr-reference","tier":1,"prompt":"Which assumption supports notifying the nurse by buzzer?","options":["All patient state is system-hidden.","A nurse is close enough to hear it.","Every buzzer is automatically secure.","Programs cannot affect the environment."],"answer":[1],"explanation":"The machine can sound the buzzer yet fail to notify a nurse if the environment assumption is false."},{"id":"nfr-reference-2","lesson":"nfr-reference","tier":2,"prompt":"The internal representation of sensor data is which category?","options":["System-hidden","Environment-hidden","Environment-visible","System-visible only"],"answer":[0],"explanation":"The internal representation belongs to the system and is hidden from the environment."},{"id":"nfr-reference-3","lesson":"nfr-reference","tier":3,"prompt":"A TO-BE design changes from buzzer to beeper. What should be revisited?","options":["Assumptions, quality tradeoffs and trace links supporting the notification goal","Only the file’s font size","Only the order of glossary entries","Nothing, because all properties transfer automatically"],"answer":[0],"explanation":"Property preservation needs an argument after a change; different notification mechanisms may rely on different assumptions."}],"frq":[{"id":"frq-big-1","lesson":"reference","prompt":"Explain D, S ⊨ R and R, D ⊨ G. What do D, S, R and G each mean?","criteria":["D = domain/world assumptions (descriptive)","S = specification: what the software does at its interface","R = requirements: what is wanted in the environment","G = goals (hard and soft) that counter the problem P","S achieves R only <i>given</i> D; R achieves G given D"],"model":"D describes the environment. S, the specification, is what the machine does at its interface; with D, S entails R, the requirements in the environment. R together with D satisfies the goals G, which counter the problem P.","flag":"Prof flagged","original":true},{"id":"frq-big-2","lesson":"reference","prompt":"True/False: “S achieves R to solve P in D.” Justify. (Your notes are unclear why the professor called a variant false.)","criteria":["State D,S ⊨ R and explain why assumptions matter","Relate requirements to goals and the problem","Distinguish specification from the implemented machine","Explain that reordering premises does not reverse entailment; preserve the slide-specific uncertainty"],"model":"Under the stated assumptions, S together with D entails R, and R with D supports goals G that counter problem P. S is a specification, not the entire machine. D,S ⊨ R and S,D ⊨ R have the same logical meaning; reordering the premises alone cannot make the statement false. The source notes do not preserve enough of the professor’s exact variant to determine why it was marked false.","flag":"Prof flagged","original":true},{"id":"frq-big-3","lesson":"reference","prompt":"Why should a requirement not specify algorithms or data structures?","criteria":["Requirements describe the environment, not the machine","Algorithms/data structures are design decisions (overspecification)","Overspecifying restricts solutions and may demand unsolvable things"],"model":"Requirements should contain only information about the environment. Algorithms (sorting, searching, routing) and data structures (stack, queue, tree) are design choices; including them overspecifies and constrains the solution.","flag":"","original":true},{"id":"frq-qual-1","lesson":"quality","prompt":"List and define the nine desirable properties of a requirement.","criteria":["Correct, complete, consistent","Unambiguous = exactly one interpretation","Verifiable = finite, cost-effective check","Ranked for importance and stability","Modifiable, traceable, understandable"],"model":"Correct (true statement of need); complete (all significant requirements); consistent (no conflicts); unambiguous (one interpretation); verifiable (cost-effective check exists); ranked for importance/stability; modifiable (changes don't disturb structure); traceable (origin found); understandable (users and developers comprehend).","flag":"Prof flagged (Elicitation slide 18)","original":true},{"id":"frq-qual-2","lesson":"quality","prompt":"Define consistency of a requirements set in logic terms and give one inference rule.","criteria":["A set Φ is consistent iff there is no φ with Φ⊢φ and Φ⊢¬φ","Modus ponens: A→B, A ⊢ B"],"model":"Φ is consistent iff no formula φ exists such that both φ and ¬φ can be derived from Φ. Modus ponens: from A→B and A infer B.","flag":"","original":true},{"id":"frq-elic-1","lesson":"elicitation-question","prompt":"List three applications where ethnomethodology is highly effective, and say why.","criteria":["Gives three distinct applications (slide: stock brokerage, HCI; add your own e.g. hospital workflow, call center, warehouse)","Explains the say–do problem/tacit knowledge","Mentions observing in a natural setting"],"model":"(1) Stock brokerages – many parallel calls and screens that traders cannot describe. (2) Human–computer interaction studies – real usage differs from described usage. (3) e.g. hospital/nurse workflows or call centers. In each, people do things they cannot articulate (say–do problem), so observation in the natural setting reveals the real process.","flag":"Prof flagged","original":true},{"id":"frq-elic-2","lesson":"techniques","prompt":"Explain the “say–do” problem and the ethnomethodology cycle, including two issues with it.","criteria":["People know how to do things they cannot/will not describe; descriptions can be inaccurate (tacit knowledge)","Cycle: plan ahead → observe/record → analyze","Issues: ethical/legal (recording without notice), observer effect, time-consuming analysis"],"model":"The say–do problem: what people say they do differs from what they do. Ethnomethodology observes them in a natural setting: plan, observe/record, analyze. Issues: consent/legal problems with recording, people behave differently when watched, and analysis is time-consuming.","flag":"","original":true},{"id":"frq-elic-3","lesson":"techniques","prompt":"Describe the four tasks of sampling and give your own example.","criteria":["Data determination (time per transaction, errors, peaks, success/failure)","Population (e.g., transactions in 4 branches for a week)","Type: purposive, simple random, or systematic; every k-th item is systematic","Sample size (bigger = costlier, more confident)"],"model":"Determine the data (e.g., transaction time and errors), the population (all transactions at four branches in a week), the sampling type, and the sample size. Purposive selection targets important cases; simple random sampling randomly selects items; taking every k-th item is systematic sampling, commonly with a random start. Explain representativeness and the cost/confidence tradeoff.","flag":"","original":true},{"id":"frq-elic-4","lesson":"techniques","prompt":"What makes a good questionnaire, and when do you use one instead of sampling or interviews?","criteria":["Seeks attitudes, beliefs, behavior","Avoid open questions; use closed Y/N or 1–5 scales","Keep short; scoring scheme; group related questions","Anonymity helps honest answers"],"model":"Use it for attitudes, beliefs and behavior that hard data and interviews don't capture. Keep it short, use closed questions with a scoring scheme (1–5), group inter-related questions, and consider anonymity.","flag":"","original":true},{"id":"frq-elic-5","lesson":"techniques","prompt":"Name the four tenets of JAD and contrast JRP with JAD.","criteria":["Group dynamics","Visual aids","Organized, rational process","WYSIWIG documentation","JRP = high-level managers/business goals; JAD = end-user needs"],"model":"Four tenets: group dynamics, visual aids, organized rational process, WYSIWIG documentation. JRP involves high-level managers (business goals, critical success factors); JAD focuses on end users' needs.","flag":"","original":true},{"id":"frq-elic-6","lesson":"techniques","prompt":"What is domain analysis? Describe FODA's three phases and the structure vs context diagram.","criteria":["Reuse of generic domain modelling patterns reduces elicitation effort","Context analysis, domain modeling, architecture modeling","Structure diagram: domain relative to higher/lower/peer domains","Context diagram: data flows between application and entities"],"model":"Domain analysis reuses generic domain models across similar applications (e.g., resource allocation: airline, hotel, car rental). FODA: context analysis, domain modeling, architecture modeling. The structure diagram is an informal block diagram of the domain among higher/lower/peer domains; the context diagram is a DFD of the generalized application's flows with external entities.","flag":"","original":true},{"id":"frq-onto-1","lesson":"ontology","prompt":"Distinguish instances, classes and metaclasses using the Person/Course/John slides.","criteria":["Instances = tokens/specific things (John, a particular course)","Classes = collections of instances (Person, Course)","Metaclass/entity = collection of classes (Entity; Activity for relationships)","Same three levels as token / class / meta ontology"],"model":"John is an instance (token) of the class Person; the specific course is an instance of Course. Person and Course are in turn instances of a higher-level concept (Entity), with relationships such as “takes” an Activity. This gives token, class and meta levels.","flag":"Prof flagged (slides 3–5)","original":true},{"id":"frq-onto-2","lesson":"ontology","prompt":"What is a metamodel? How does it relate to a model, and what does it (not) define?","criteria":["Metamodel defines concepts and relationships (usually as a class diagram)","Emphasize abstract syntax and well-formedness; structure alone does not determine all semantics","A model is an instance of its metamodel if it respects the structure","A model should conform to its metamodel like a program to its grammar"],"model":"A metamodel defines modeling concepts and allowed relationships, often through a class diagram and well-formedness constraints. A model conforms when it follows those rules, like a program conforms to a language grammar. The course emphasizes structure: structural conformance alone does not establish the modeled behavior’s meaning or correctness.","flag":"","original":true},{"id":"frq-ent-1","lesson":"enterprise","prompt":"The sample Vision says the problem is “Keeping current on collegiate sports events.” What is wrong, and how would you fix it?","criteria":["It states a desired goal, not the existing difficulty","Use template: The problem of … affects … the impact of which …","Example fix: users cannot easily keep up with events they care about"],"model":"That is a goal (what users want), not a problem. Rewrite: “The problem of users being unable to easily keep up with the collegiate sports events they care about affects fans, the impact of which is missed games and lower engagement. A successful solution would …”","flag":"Prof flagged","original":true},{"id":"frq-ent-2","lesson":"enterprise","prompt":"List the Vision document outline and state the purpose of the Vision document.","criteria":["11 sections: Introduction → Appendix 1 feature attributes","Communicates what and why between management, marketing, project team","Gets all parties “working from the same book”","Sets scope and priority of high-level stakeholder requests"],"model":"1 Introduction, 2 Positioning, 3 Stakeholder and User Descriptions, 4 Product Overview, 5 Product Features, 6 Constraints, 7 Quality Ranges, 8 Precedence and Priority, 9 Other Product Requirements, 10 Documentation Requirements, 11 Appendix – Feature Attributes. It conveys the what and why of the product so everyone works from the same book.","flag":"","original":true},{"id":"frq-ent-3","lesson":"uml-erd","prompt":"Which UML diagram shows what in business modeling (use case, activity, class, sequence/collaboration)?","criteria":["Use case → business context","Activity → workflows/behavior (decision, fork/join, swimlanes)","Class → static structure of workers and entities","Sequence/collaboration → dynamic interactions realizing activity behavior"],"model":"Use case diagrams show business context; activity diagrams show workflows (decisions, parallel threads, swimlanes); class diagrams show static structure of business workers/entities; sequence and collaboration diagrams show interactions that realize the workflow.","flag":"","original":true},{"id":"frq-ent-4","lesson":"enterprise","prompt":"List five categories of business actors and describe how to find business use cases.","criteria":["Customers, partners, suppliers, authorities, owners/investors, subsidiaries, external systems","Name by role and define responsibility","Business use cases = value each actor gets; start with customers and their lifecycle","Also supporting and management processes"],"model":"Business actors: customers, partners, suppliers, authorities (legal/regulatory), subsidiaries, owners/investors, outside information systems. Find business use cases by asking what value each actor gets, beginning with customer services/lifecycle, then supporting (staff, IT, legal) and management processes.","flag":"","original":true},{"id":"frq-ent-5","lesson":"uml-erd","prompt":"You are shown a UML class diagram and asked if it is correct. What do you check?","criteria":["Classes vs instances (are objects drawn as classes?)","Associations with sensible names/multiplicities and navigability","Generalization arrows point to the superclass; no wrong relationships","Attributes/operations placed in the right class; association class used when the relationship has attributes"],"model":"Check that classes (not instances) are shown, associations are named with correct multiplicities, generalization arrows point from subclass to superclass, attributes/operations belong to the right class, and an association class is used when an association itself carries attributes.","flag":"Prof flagged (slide 26)","original":true},{"id":"frq-sa-1","lesson":"idef","prompt":"Describe the supplied “Develop Requirements” sketch as drawn. Then distinguish it from standard IDEF0 ICOM placement and comment on its decomposition.","criteria":["Develop Requirements is the function box","User, Templates/standards and RE-tools are visibly above it with top-entering arrows","The left incoming arrow is unlabeled; WRS doc and Vision doc are on the right","Standard ICOM is input left, control top, output right, mechanism bottom; performing tools are normally mechanisms","The slide names Develop Phase I / Phase II as a simplified two-stage sketch; standard decomposition generally uses 3–6 boxes"],"model":"The supplied sketch places User, Templates/standards and RE-tools above Develop Requirements, with arrows entering from the top. Its left incoming arrow is unlabeled. WRS doc and Vision doc are on the output/right side, and the lower sketch names Develop Phase I and Develop Phase II. This is simplified and does not consistently apply standard ICOM: input left, control top, output right and mechanism bottom. Tools that perform the function would normally be mechanisms. State explicitly whether reproducing the class drawing or normalizing it.","flag":"Prof flagged (3 pts)","original":true,"originalPrompt":"Draw (describe) the IDEF0 “Develop Requirements” process-spec example and label every ICOM. Then say how it decomposes."},{"id":"frq-sa-2","lesson":"idef","prompt":"State IDEF0's rules: ICOM positions, labels, number of boxes per diagram, and the three things a model must declare.","criteria":["Input left, Control top, Output right, Mechanism bottom","Box labels = verbs; arrow labels = nouns","A-0: one context box; decomposition diagrams generally 3–6 boxes","Context, Viewpoint, Purpose"],"model":"Input left, control top, output right, mechanism bottom. Functions use verb phrases and arrows use noun phrases. A-0 has one context box; decomposition diagrams generally contain 3–6 boxes. State context (boundary), viewpoint (perspective) and purpose.","flag":"","original":true},{"id":"frq-sa-3","lesson":"idef","prompt":"What is the difference between a control and an input? What is a mechanism? What is a tunneled arrow?","criteria":["Inputs are consumed/transformed; controls influence but are not consumed","Mechanism = person, machine or computer performing the activity","Tunneled arrow: concept doesn't appear on the lower (connected end) or higher level (unconnected end)"],"model":"Inputs are consumed or transformed by the activity; controls govern it but are not consumed. The mechanism is the person/machine that carries out the activity. Tunneled arrows are written in parentheses: at a connected end the concept doesn't appear on the next lower level; at an unconnected end it doesn't appear on the next higher level.","flag":"","original":true},{"id":"frq-sa-4","lesson":"dfd","prompt":"List the DFD elements, the DFD rules and three differences between a DFD and a flowchart.","criteria":["Process, dataflow, data store, external entity","Unique names; no logical decisions; leveling preserves inputs/outputs; context diagram first","DFD: data vs control; parallel vs sequential; differing timing vs single program"],"model":"Elements: processes (bubbles), dataflows (arrows), data stores (parallel lines) and external entities (rectangles). Rules: unique names, no decisions or ordering, balance inputs/outputs between levels, start with a context diagram. DFDs show data flow, allow parallel processes with different timing; flowcharts show control flow of a single sequential program.","flag":"","original":true},{"id":"frq-sa-5","lesson":"structured-english","prompt":"Write Structured English for: for each customer, total the past-due amounts of their loans; if the total exceeds $100.00, report the customer in LOANS AT RISK, otherwise exclude.","criteria":["Nested for-each customer / for-each loan","Running totals (number of loans, principal, balance, past due)","If total past due > $100.00 then write to LOANS AT RISK else exclude","Reset all four totals before the matching-loan loop for each customer; exactly $100.00 is excluded"],"model":"1. For each CUSTOMER NUMBER in CUSTOMERS: a. For each LOAN matching the customer: keep running totals of NUMBER OF LOANS, ORIGINAL PRINCIPAL, CURRENT BALANCE, AMOUNTS PAST DUE. b. If total AMOUNTS PAST DUE > $100.00 then write the customer and attributes to LOANS AT RISK, else exclude. Initialize the four totals to zero at the start of each customer; do not carry totals between customers. Exactly $100.00 does not pass the strict threshold.","flag":"Prof flagged (slide 22)","original":true},{"id":"frq-sa-6","lesson":"structured-english","prompt":"Build a decision table (condition stubs, action stubs, rules) for a discount rule of your choice.","criteria":["Rows: condition stubs and action stubs","Columns: rules with condition entries (Y/N) and action entries (X)","Covers all combinations/no ambiguity"],"model":"Practice policy: bookstores receive 25% for orders ≥50 and 15% otherwise; other customers receive 10% for orders ≥50 and 0% otherwise. Conditions are Bookstore? and Order ≥50?; rules are YY→25%, YN→15%, NY→10%, NN→0%. Mark one action per rule. All four combinations are covered without contradiction.","flag":"","original":true},{"id":"frq-gore-1","lesson":"gore","prompt":"Why goal-oriented RE? Explain completeness in GORE and what teleology means.","criteria":["Complete if requirements are sufficient to establish the goal they refine","Teleology = study of design/purpose (telos = end)","Goals drive elicitation (before use cases)"],"model":"GORE derives requirements from goals; requirements are complete when sufficient to establish the goal they refine. Teleology (telos = end) is the study of purpose, the philosophical basis for goal orientation.","flag":"","original":true},{"id":"frq-gore-2","lesson":"gore","prompt":"Define forward and backward traceability and compare a traceability matrix with graph-oriented traceability.","criteria":["Forward: requirement → design/code/tests that satisfy it","Backward: work product/requirement → origin (need/goal)","Matrix: simple tabular links; graph: explicit nodes/links, supports navigation and impact analysis"],"model":"Forward traceability follows a requirement to the work products and tests satisfying it; backward traceability follows an artifact back to the requirement or stakeholder need that originated it. A matrix is a table associating requirements with work products; a graph represents the artifacts and links explicitly, easier for navigation and impact analysis.","flag":"","original":true},{"id":"frq-nfr-1","lesson":"nfr-basics","prompt":"Explain why NFRs are subjective, graded, interacting and relative. Use security (or another NFR) as your example.","criteria":["Subjective: protection of data alone fine for Chris, more for Pat, Alex, Neo, Gail","Graded: worse↔better; password < password+fingerprint","Interacting: conflicting (security vs ease of use) or synergistic","Relative priorities across stakeholders/contexts"],"model":"“Security” means different things to different people (Chris: data protection; Pat: plus availability; Alex: plus accuracy…) and so do solutions (password → password + periodic change → + fingerprint…). They are graded (better/worse), interact (password+hourly fingerprint helps security but hurts ease of use; restricted access helps data accuracy) and rank differently by context.","flag":"","original":true},{"id":"frq-nfr-2","lesson":"sig","prompt":"Convert this to a SIG: “The system must be secure. Security means integrity, confidentiality and availability. Use password and fingerprint authentication. Fingerprint hurts ease of use.” Describe nodes, links and notation.","criteria":["Top NFR softgoal Security[System] decomposed (AND) into Integrity, Confidentiality, Availability","Operationalizing softgoals for authentication, with justified Help contributions; distinguish combined factors from OR alternatives","Ease-of-use NFR softgoal with Hurt (−) link from Fingerprint","Use Type[Topic], priorities (!), claims if justified"],"model":"AND-refine Security[System] into Integrity, Confidentiality and Availability. Add Password authentication and Fingerprint authentication as operationalizing softgoals, with justified Help contributions to Confidentiality (or other justified security aspects). Add EaseOfUse[Login] and a Hurt link from Fingerprint. If both factors are required, represent the combined technique explicitly. Use Type[Topic], optional priority marks, and claim softgoals to record rationale. Do not assert Make or absolute security merely because authentication is present.","flag":"Prof flagged: plain English → SIG (his slides 41–42; PDF numbering differs, go by title)","original":true},{"id":"frq-nfr-3","lesson":"sig","prompt":"List the SIG contribution types, label types and how labels propagate through AND/OR.","criteria":["Make, Help, Hurt, Break (+ Undetermined)","Labels: satisficed, denied, conflicting, undetermined","AND: all children must be satisficed; OR: at least one satisficed","Make/Break provide strong positive/negative evidence; Help/Hurt are partial; mixed support is conflicting, not simply unknown"],"model":"Make (++), Help (+), Hurt (−), Break (−−), with unknown/undetermined contributions where appropriate. Labels include satisficed, denied, conflicting and undetermined. Propagate bottom-up: an AND needs all required children; an OR can use a sufficient alternative. Consider both strength and sign: partial Help/Hurt alone does not guarantee full satisficing/denial. Distinguish conflicting evidence from insufficient evidence.","flag":"Prof flagged (slide 58/63, 6 pts)","original":true},{"id":"frq-nfr-4","lesson":"sig","prompt":"Describe the process of constructing a SIG.","criteria":["Post NFR softgoals; refine type, topic, priority","Operationalize and refine operationalizing softgoals","Justify with claim softgoals","Evaluate the degree of satisficing"],"model":"Iteratively: post NFR softgoals; refine them (type, topic list, priority) until the meaning is clear; operationalize; refine operationalizing softgoals until the design is complete; justify with claims; evaluate satisficing.","flag":"","original":true},{"id":"frq-nfr-5","lesson":"nfr-measures","prompt":"State availability and MTBF formulas and name the FURPS+ categories.","criteria":["Availability = MTTF/(MTTF+MTTR) × 100%","MTBF = MTTF + MTTR","Functionality, Usability, Reliability, Performance, Supportability (+)"],"model":"Availability = MTTF/(MTTF+MTTR)×100%. MTBF = MTTF+MTTR. FURPS+ = Functionality, Usability, Reliability, Performance, Supportability plus testability, extensibility, adaptability, maintainability, compatibility, configurability, serviceability, installability, localizability, robustness.","flag":"","original":true},{"id":"frq-kaos-1","lesson":"kaos","prompt":"KAOS notation: what symbols appear on the KAOS slides (3–6), and what does each mean? (□, ◊, goal shape, softgoal, conflict, agent)","criteria":["□ means always/necessary and ◇ means eventually/possible in the stated logic","Identify slanted goal boxes, softgoal clouds, AND/OR refinement and X for conflict","Named responsibility boxes such as Tracking System are agents linked by Resp","The object model uses UML classes; distinguish it from goals and agents"],"model":"The supplied class figures use slanted boxes for goals, clouds for softgoals, AND/OR refinements and X for conflict. Named boxes such as Tracking System and OnBoard TrainController are responsible agents, connected to leaf goals by Resp links. The object model uses UML class compartments. □ is always/necessary; ◇ is eventually/possible, with temporal scope made explicit.","flag":"Prof flagged (3 pts; slide 5 symbol)","original":true},{"id":"frq-kaos-2","lesson":"formalizable-goals","prompt":"Define liveness and safety with KAOS examples.","criteria":["Liveness: something good eventually happens – Achieve: P → ◊Q","Safety: something bad never happens – Avoid □(P→¬Q) (Maintain □(P→Q) is “always” goal)","Give an example (e.g., train doors stay closed while moving; train eventually stops at station)"],"model":"Liveness: something good eventually happens – Achieve goals, P → ◊Q (e.g., a stopped train eventually receives a go command). Safety: something bad never happens – Avoid goals □(P → ¬Q) (e.g., doors never open while the train moves); Maintain goals □(P → Q) keep a condition always true.","flag":"Prof flagged (2 pts)","original":true},{"id":"frq-kaos-3","lesson":"kaos","prompt":"Explain KAOS goal elaboration and what “realizable” means.","criteria":["Start with high-level goals and objects, agents","Refine with AND/OR, find obstacles and conflicts, operationalize","Stop when each subgoal is realizable by one agent (monitorable and controllable)","WHY up, HOW down"],"model":"Define initial goals/objects/agents; iteratively refine goals with AND/OR, identify obstacles and conflicts, operationalize goals into requirements assigned to agents, and formalize. A goal is realizable when an agent can monitor and control the variables in it.","flag":"","original":true},{"id":"frq-kaos-4","lesson":"kaos","prompt":"Distinguish goal, domain property, requirement and expectation in KAOS.","criteria":["Goal: prescriptive intent needing cooperation of agents","Domain property: descriptive (physical laws, norms)","Requirement: realizable goal assigned to a software agent","Expectation: realizable goal assigned to an environment agent (not enforceable by software)"],"model":"A goal is prescriptive intent involving system agents; a domain property is descriptive (laws, norms); a requirement is a realizable goal assigned to a software-to-be agent; an expectation is a realizable goal assigned to an environment agent and cannot be enforced by software.","flag":"","original":true},{"id":"frq-kaos-5","lesson":"istar","prompt":"Contrast KAOS (GORE) with i* (AORE): what are SD and SR models?","criteria":["i*: intentional actors; asks “why”","SD = dependencies between actors: goal, softgoal, resource, task","SR = internal rationale: task decomposition, means-ends links","KAOS focuses on goals with formal temporal logic and agents"],"model":"i* models organizational context with intentional actors. The Strategic Dependency model shows goal/softgoal/resource/task dependencies among actors; the Strategic Rationale model shows each actor's internal reasoning via task decompositions and means-ends links. KAOS focuses on goal refinement with formal definitions in temporal logic.","flag":"","original":true},{"id":"frq-low-1","lesson":"scenarios","prompt":"Compare include, extend and generalization for use cases with an example of each.","criteria":["Include: base delegates to supplier; ManageIncident includes CreateIncident; OpenIncident includes ViewMap","Extend: base complete alone; ReportEmergency extended by Help","Generalization: ValidateUser → CheckPassword, CheckFingerprint"],"model":"Include factors out mandatory behavior (OpenIncident includes ViewMap; ManageIncident decomposes into create/handle/close). Extend adds optional behavior to a complete base (Help extends ReportEmergency). Generalization specializes a parent use case (ValidateUser → CheckPassword/CheckFingerprint).","flag":"","original":true},{"id":"frq-low-2","lesson":"problem-frames","prompt":"List the five basic problem frames and the three domain types.","criteria":["Required behavior, commanded behavior, information display, simple workpieces, transformation","Causal, biddable, lexical"],"model":"Frames: required behavior, commanded behavior, information display, simple workpieces, transformation. Domains: causal (predictable), biddable (unpredictable, e.g., humans), lexical (data representation).","flag":"","original":true},{"id":"frq-low-3","lesson":"analysis","prompt":"Explain fishbone and Pareto analysis and when to use each.","criteria":["Fishbone: ask “why” to find contributing causes (problem behind the problem), also validate a solution","Pareto: rank causes by contribution; 20% of causes drive 80% of the problem"],"model":"A fishbone diagram lists contributing causes by repeatedly asking “why”; it can also validate a proposed solution. Pareto analysis ranks causes by % contribution so you tackle the vital few (80/20).","flag":"","original":true},{"id":"frq-added-1","lesson":"rup","prompt":"Expand RUP. Name its four phases, the focus of each and the relationship between phases and iterations.","criteria":["Rational Unified Process","Inception: scope, business case, stakeholders and key needs","Elaboration: validated architecture and major risk reduction","Construction: build/integrate; Transition: deployment and user acceptance","Each phase can contain several iterations; disciplines overlap phases"],"model":"RUP is the Rational Unified Process. Inception aligns scope, business case and key needs. Elaboration validates the architectural foundation and addresses major risks. Construction builds and integrates increments. Transition deploys the product and supports user acceptance. Phases can have multiple iterations; requirements, design, implementation and testing are disciplines whose emphasis changes across the lifecycle.","flag":"Added focus practice","original":false},{"id":"frq-added-2","lesson":"rup","prompt":"Map Vision, Stakeholder Requests, Use-Case Specifications, Supplementary Specification and Glossary to their purposes.","criteria":["Vision: high-level what/why, problem, scope and priorities","Stakeholder Requests: original needs and requests","Use-Case Specifications: interactions, flows, alternatives and exceptions","Supplementary Specification: cross-cutting NFRs/constraints","Glossary: shared terms"],"model":"Vision summarizes the problem, product direction, scope, features and priorities. Stakeholder Requests capture stakeholder input. Use-Case Specifications describe actors and interaction flows with alternatives and exceptions. Supplementary Specification records cross-cutting qualities and constraints beyond individual flows. Glossary aligns terminology; high-level NFR summaries can also appear in Vision.","flag":"Added focus practice","original":false},{"id":"frq-added-3","lesson":"uml-erd","prompt":"Explain the difference between an ERD and a UML class diagram, with an enrollment example.","criteria":["Both show concepts, attributes and relationships","ERD emphasizes information/data structure and cardinalities","Class diagram can include operations and richer object relationships","Avoid absolutes: EER can include inheritance; domain classes may omit operations","Example: Enrollment stores grade and may offer recordGrade() in the class model"],"model":"An ERD models entities, their attributes and data relationships, usually with cardinality and possibly key information. A UML class diagram models static domain/software structure and can also show operations, responsibilities, inheritance and composition. An ERD can represent Student–Course enrollment with grade; a class model can use Enrollment with grade and recordGrade(). Enhanced ER supports specialization, and an analysis class model need not show operations.","flag":"Added focus practice","original":false},{"id":"frq-added-4","lesson":"structured-english","prompt":"Recreate the Structured English constructs table and explain which loops may execute zero times.","criteria":["Sequence performs steps in order","IF/THEN/ELSE and CASE express selection","Decision tables handle multiple condition combinations","REPEAT/UNTIL is post-test and executes at least once","WHILE is pre-test; FOR EACH may have zero matches"],"model":"Sequence performs successive steps. IF/THEN/ELSE handles a condition; CASE selects among named alternatives; a decision table maps combinations of several conditions to actions. REPEAT/UNTIL runs the body before testing and executes at least once. WHILE tests first and may execute zero times. FOR EACH processes a collection and executes zero times for an empty collection.","flag":"Added focus practice","original":false},{"id":"frq-added-5","lesson":"formalizable-goals","prompt":"Name and formalize the four KAOS goal patterns. Give one example of each and distinguish liveness from safety.","criteria":["Achieve: □(P → ◇Q), eventual truth","Cease: □(P → ◇¬Q), eventual falsity","Maintain: □(P → Q), required condition whenever P","Avoid: □(P → ¬Q), bad condition forbidden whenever P","Achieve/Cease are liveness; Maintain/Avoid are safety; state temporal scope"],"model":"Achieve: every accepted request eventually gets a response, □(Accepted→◇Responded). Cease: after reset, the alarm eventually becomes inactive, □(Reset→◇¬Alarm). Maintain: moving trains have closed doors, □(Moving→Closed). Avoid: moving trains never have open doors, □(Moving→¬Open). Achieve/Cease express eventual progress; Maintain/Avoid express safety constraints. Some KAOS notation uses an implicitly global implication; make the temporal scope explicit.","flag":"Added focus practice","original":false},{"id":"frq-added-6","lesson":"formalizable-goals","prompt":"Translate “every accepted request receives its matching response within 30 seconds.” Why is plain eventually insufficient?","criteria":["Trigger: request accepted","Outcome: matching response for that same request","Always quantify over triggers/requests","Use bounded eventually ◇≤30s","Unbounded ◇ imposes no finite deadline"],"model":"For every request r: □(Accepted(r) → ◇≤30s Responded(r)), with the accepted event and matching-response event clearly defined. Unbounded eventually guarantees only a later response, not that it arrives before a 30-second deadline. The bound and request identity are both essential.","flag":"Added focus practice","original":false},{"id":"frq-added-7","lesson":"sig","prompt":"Label this decisive SIG: Security AND-refines to Integrity and Confidentiality. Integrity is satisficed; Confidentiality is denied. What if the refinement were OR? What if a destination had strong evidence both for and against it?","criteria":["AND case: denied because one required child is denied","OR case: satisficed because one sufficient child is satisficed","Both strong positive and negative evidence: conflicting","Unknown evidence is undetermined, a different case","Do not treat partial Help/Hurt as decisive Make/Break"],"model":"With the stated decisive labels, the AND parent is denied because Confidentiality is required and denied. An OR parent is satisficed by the Integrity alternative. A destination supported and opposed by strong evidence is conflicting. Undetermined means evidence is insufficient. Help/Hurt carry partial support and need the course’s specific evaluation rules rather than automatic decisive conclusions.","flag":"Added focus practice","original":false},{"id":"frq-added-8","lesson":"analysis","prompt":"Explain the AHP normalization procedure and identify an inconsistent set of judgments.","criteria":["Build reciprocal pairwise matrix with diagonal 1","Sum columns and divide each cell by its column sum","Average each normalized row for an approximate priority","Check aᵢⱼ = aᵢₖ × aₖⱼ","Example: r1=2r2 and r2=3r3 imply r1=6r3; a judgment of 5 is inconsistent"],"model":"Construct a reciprocal pairwise comparison matrix with ones on the diagonal. Normalize each column by its sum, then average the entries in each row to estimate relative priority. Consistency requires multiplicative transitivity: aij = aik·akj. If r1 is twice r2 and r2 is three times r3, r1 should be six times r3; a direct comparison of five is inconsistent and should be examined.","flag":"Added focus practice","original":false},{"id":"frq-added-9","lesson":"structured-english","prompt":"Explain the data dictionary symbols =, +, [ ], { } and ( ), and give a short ORDER example.","criteria":["= means consists of","+ means sequence/combination","[ ] means selection","{ } means repetition, optionally with bounds","( ) means optional; provide a coherent example"],"model":"“=” means consists of, “+” combines components, “[A,B]” selects an alternative, “{…}” repeats a component and “(…)” makes it optional. Example: ORDER = ORDER NUMBER + [PERSONAL CUSTOMER NUMBER, CORPORATE ACCOUNT NUMBER] + 1{PRODUCT NUMBER + QUANTITY}N + (QUOTE NUMBER). The numbered braces bound repetition from one through N.","flag":"Added focus practice","original":false},{"id":"frq-added-10","lesson":"sysml","prompt":"Using the historical SysML appendix, name two additional diagram types and explain BDD vs IBD.","criteria":["Scope answer to SysML 1.x course material","Requirement diagram","Parametric diagram","BDD: blocks and structural relationships","IBD: internal parts and connections"],"model":"In the SysML 1.x material, requirement diagrams model requirements and relationships; parametric diagrams express constraints among system properties. A Block Definition Diagram defines blocks and their structural relationships. An Internal Block Diagram shows internal parts and connections. The historical notes describe this version as a UML-based systems language.","flag":"Added focus practice","original":false},{"id":"frq-added-11","lesson":"nfr-basics","prompt":"Rewrite “login shall be fast and secure” into two clearer quality requirements and explain how to evaluate them.","criteria":["Define a latency measure, load and operating conditions","State a threshold/percentile and test procedure","Define the security scope and relevant threats/access policy","State checkable security controls or criteria with justified assumptions","Avoid claiming absolute security"],"model":"Illustrative performance requirement: under 500 concurrent sessions in the specified test environment, 95% of valid login attempts shall receive a result within two seconds, measured by the defined load test. Illustrative security requirement: access to protected account data shall be rejected unless the user has authenticated and is authorized for that account, checked by positive and negative access tests. Clarify threat scope, retry/session policies and assumptions; these criteria do not prove absolute security.","flag":"Added focus practice","original":false},{"id":"frq-added-12","lesson":"gore-completeness","prompt":"State the five GORE completeness criteria and explain why consistency is separate from sufficiency.","criteria":["Validate R against customer desires","Validate K against the environment","Scope S to the machine interface under the slide’s restrictions","Prove S,K ⊢ R","Prove consistency of S and K"],"model":"Validate each requirement and the whole requirements set with the customer; validate domain knowledge K; ensure S follows the interface restrictions; prove S,K entail R; and prove S,K consistent. A sufficiency proof under contradictory premises does not establish a feasible solution. The additional P,C ⊢ S argument links the program/machine to the specification.","flag":"Added from GORE p. 3","original":false},{"id":"frq-added-13","lesson":"gore-completeness","prompt":"Distinguish K, R, S, P and C in the completeness slide and write its two main proof relations.","criteria":["K = domain knowledge","R = requirements; S = specification","P = program; C = machine description","S,K ⊢ R","P,C ⊢ S"],"model":"K is the validated domain knowledge, R the requirements and S the specification. P is the program and C the machine description. S,K ⊢ R establishes requirements from specification plus domain; P,C ⊢ S establishes the specification from execution on the described machine. This use of P is distinct from P meaning a problem.","flag":"Added from GORE p. 3","original":false},{"id":"frq-added-14","lesson":"vending-trace","prompt":"Refine serve_customer using the vending-machine example and show both an AND rule and OR alternatives.","criteria":["Top-level selection, availability, payment and vending/refund","customer_selection requires display_choices AND get_customer_choice","One rule body expresses AND","Vertical/horizontal displays are alternative rules for the same head","Mouse/button/voice choice alternatives can be elaborated"],"model":"serve_customer requires customer_selection(Product), selection_availability(Product), customer_payment(Product,Payment) and vend_payment(Product,Refund). customer_selection(Product) requires display_choices and get_customer_choice(Product). A clause body is AND. Separate display_choices clauses for vertical_display and horizontal_display express OR alternatives; input can similarly use mouse, buttons or voice.","flag":"Added from GORE pp. 8–11","original":false},{"id":"frq-added-15","lesson":"vending-trace","prompt":"A design element has no requirement link and a requirement has no design link. Explain the two findings and the role of rationale.","criteria":["Backward tracing checks the design element’s justification","Unlinked design may be accidental/unnecessary","Forward tracing checks requirement realization","Unlinked requirement may be unmet","Record alternatives, tradeoffs and reasons"],"model":"Trace the design element backward to the need or requirement it serves; no link may signal accidental design, though the link or requirement may simply be missing. Trace the requirement forward to a realizing design and tests; no link may indicate an unmet requirement. Record alternatives, tradeoffs and rationale so later changes can revisit the decision rather than preserve an unexplained choice.","flag":"Added from GORE pp. 12–15","original":false},{"id":"frq-added-16","lesson":"kaos-train","prompt":"Write and explain the two formalizable Maintain goals shown under the train object model.","criteria":["TrackSegmentSpeedLimit quantifies Train and TrackSegment","On(tr,s) implies tr.Speed ≤ s.SpeedLimit","WCS-DistBetweenTrains quantifies the two trains","Following(tr1,tr2) implies tr1.Loc−tr2.Loc > tr1.WCS-Dist","Explain worst-case stopping distance and respect the model’s location convention"],"model":"Maintain[TrackSegmentSpeedLimit]: for every train tr and segment s, On(tr,s) ⇒ tr.Speed ≤ s.SpeedLimit. Maintain[WCS-DistBetweenTrains]: for every tr1,tr2, Following(tr1,tr2) ⇒ tr1.Loc−tr2.Loc > tr1.WCS-Dist. The first keeps speed within the segment limit; the second maintains separation beyond worst-case stopping distance under the slide’s Following and location definitions.","flag":"Added from KAOS p. 5","original":false},{"id":"frq-added-17","lesson":"kaos-train","prompt":"Derive the conflict between the two commanded-speed goals and describe the lecture’s resolution.","criteria":["Both formulas are conditioned on nonnegative commanded acceleration","First goal imposes SpeedCM ≤ Speed + f(distance)","Second imposes SpeedCM > Speed + 7","Inconsistent when f(distance) ≤ 7","Keep the safety bound and weaken the competing goal with a boundary exception"],"model":"With AccCM ≥ 0, require SpeedCM ≤ Speed+f(distance-to-obstacle) and SpeedCM > Speed+7. When f(distance-to-obstacle) ≤ 7, no value can satisfy both bounds. The slide keeps the safety goal and weakens the other, allowing an exception at that boundary. This gives a reasoned conflict condition rather than merely labeling two goals as conflicting.","flag":"Added from KAOS p. 7","original":false},{"id":"frq-added-18","lesson":"istar-case","prompt":"Identify the actors and dependency types in the car-insurance SD example, and distinguish depender from dependee.","criteria":["Actors: car owner, body shop, insurer and appraiser","Depender relies on the dependee","Goal example: Car Repaired / Repairs Be Covered","Resource: payment/payout; task: Appraise Damages","Softgoal: Fair Repair Appraisal / Customer Be Happy / Minimal Repairs"],"model":"The actors include Car Owner, Body Shop, Insurance Company and Appraiser. The depender relies on a dependee to fulfill a dependency. Car Repaired and Repairs Be Covered are outcome goals; Claims Payout and Payment for Repairs are resources; Appraise Damages is a task; Fair Repair Appraisal, Customer Be Happy and Minimal Repairs are quality intentions. Read the direction from the diagram’s legend rather than guessing from proximity.","flag":"Added from KAOS pp. 13–14","original":false},{"id":"frq-added-19","lesson":"istar-case","prompt":"Why does the order-processing example motivate agent-oriented RE, and what additional information does an SR model expose?","criteria":["Ask whose goals the system supports","Implementing an SRS does not prove the process is beneficial","Consider cross-functional roles/information/workflow","SR shows internal tasks and means–ends alternatives","Example: central vs agent vs body-shop handling of small claims"],"model":"The order-processing example has many roles and handoffs, so automating a document can preserve delays and conflicting incentives. Agent-oriented RE asks whose goals matter and what the system should do for them. An SR model opens an actor’s internal rationale: ClaimBeSettled can be achieved through central handling, an agent or a body shop, with tasks such as policy verification, preparing an offer and settling.","flag":"Added from KAOS pp. 9–15","original":false},{"id":"frq-added-20","lesson":"quality-methods","prompt":"Reproduce McCall’s three groups and at least two qualities in each, then explain the weighted-rating example.","criteria":["Operation examples: usability, integrity, efficiency, correctness, reliability","Revision: maintainability, testability, flexibility","Transition: reusability, portability, interoperability","Weights 0.3,0.6,0.1 with ratings 6,5,7","Weighted sum 5.5; justify scales and weights"],"model":"Product operation includes usability, integrity, efficiency, correctness and reliability. Product revision includes maintainability, testability and flexibility. Product transition includes reusability, portability and interoperability. In the separate weighted-rating example, 0.3×6+0.6×5+0.1×7=5.5/10. The calculation is only as meaningful as its chosen properties, scales, weights and ratings.","flag":"Added from NFR slides 13,21","original":false},{"id":"frq-added-21","lesson":"quality-methods","prompt":"What does QFD’s House of Quality relate, and what criticisms does the lecture make when comparing it with goal-based NFR modeling?","criteria":["Customer whats related to technical hows","Importance, relationship and correlation information","Intuitive and rich in relationships","No explicit problem relationship in the depicted approach","NFRs and solutions not explicitly structured/refined as SIGs"],"model":"The House of Quality relates customer wants to technical characteristics, with importance, relationships and correlations shown in a matrix/roof. The lecture calls it intuitive and rich in relationships, but notes no explicit relationship to problems and no explicit structure for refining NFRs and solutions in that depiction. A SIG instead organizes scoped softgoals, operationalizations and contribution-based rationale.","flag":"Added from NFR slides 41–42","original":false},{"id":"frq-added-22","lesson":"dependability-details","prompt":"Distinguish POFOD, ROCOF, MTTF and AVAIL, with a suitable unit or application for each.","criteria":["POFOD: probability per demand; occasional/emergency demands","ROCOF: failures per stated interval or operations","MTTF: expected time to failure","AVAIL: fraction/probability of time service is up","Explain denominators rather than interchanging probabilities and rates"],"model":"POFOD is probability of failure per demand, suitable for infrequently demanded services; 0.0001 is one in 10,000 demands. ROCOF counts failures per stated time or operation interval. MTTF is mean operating time until failure. AVAIL is the long-run fraction/probability of available service, useful for continuous services. State units and event models; a rate is not a probability.","flag":"Added from NFR slide 93","original":false},{"id":"frq-added-23","lesson":"dependability-details","prompt":"Explain the event assumptions for series failure and redundant failure, then name the safety risk classes.","criteria":["Series service fails if any needed component fails","Independent series failure = 1−product(1−pi)","A sum is an approximation/upper bound, not a general exact dependent formula","Independent all-fail redundancy = product(pi), or p^n for identical components","Risk classes: intolerable, ALARP, acceptable"],"model":"A series service needing all independent components fails with probability 1−∏(1−pi). A simple sum is a small-probability approximation or a union-bound upper bound. If independent redundant components all must fail before service fails, the probability is ∏pi, or p^n for identical components. The safety appendix groups risks as intolerable, ALARP (as low as reasonably practicable) and acceptable.","flag":"Added from NFR slides 91,93","original":false},{"id":"frq-added-24","lesson":"sig-class-examples","prompt":"Work the elixir/bomb label-propagation cases, including both sources denied. Explain why denying a Make source does not prove denial of the target.","criteria":["Accepted elixir on Make supports healthy","Accepted bomb on Break opposes healthy","Both accepted gives conflict","Both denied gives U","A sufficient positive/negative contribution does not justify inferring its converse"],"model":"An accepted elixir on Make supports healthy; an accepted bomb on Break opposes healthy. Both active sources give conflicting evidence. If both are denied, the slide labels the target U because neither active support is supplied. Denying the sufficient Make source does not rule out other ways to establish healthy; denying the Break source likewise does not establish healthy.","flag":"Added from NFR slide 63","original":false},{"id":"frq-added-25","lesson":"sig-class-examples","prompt":"Distinguish type refinement, topic refinement, operationalization, priority and claim using the account/home-network examples.","criteria":["Security→Integrity/Confidentiality/Availability refines type","Accuracy[Account]→Accuracy[GoldAccount] refines topic","Authentication/indexing are operationalizations","! and !! encode priority","Claims justify a goal, choice or contribution and need evidence"],"model":"Refining Security into Integrity, Confidentiality and Availability changes quality type. Refining Accuracy[Account] into Accuracy[GoldAccount] narrows the topic. Password/fingerprint authentication and indexing operationalize quality goals. ! and !! record importance. A dashed claim such as a report about fixed lighting explains a choice or contribution but must itself be justified; it does not prove absolute security.","flag":"Added from NFR slides 44–69","original":false},{"id":"frq-added-26","lesson":"nfr-reference","prompt":"Explain the patient-monitoring D/S/R argument and identify its four designation categories.","criteria":["D1 nurse can hear buzzer; D2 threshold indicates heart failure","S1 actuates buzzer when sensed sound is low","R1 notifies nurse of impending heart failure","eh nurse/heartbeat; ev chest sounds","sv buzzer; sh internal sensor-data representation"],"model":"D1 says a nurse is close enough to hear the buzzer; D2 relates low sensed heart sound to impending heart stoppage. S1 activates the buzzer below the threshold; together they support R1, notifying the nurse. The slide designates the nurse/heartbeat as environment-hidden, chest sounds as environment-visible, the buzzer as system-visible and the internal sensor-data representation as system-hidden.","flag":"Added from NFR slides 71–72","original":false},{"id":"frq-added-27","lesson":"nfr-reference","prompt":"What must be checked when evolving the warning system from buzzer to beeper, and how does the lecture connect this to architecture?","criteria":["Revisit notification assumptions","Compare quality concerns and alternatives","Follow dependency/trace links across AS-IS and TO-BE","Identify monitoring, determining and buzzer-control functions","Do not assume changed mechanisms preserve all properties"],"model":"Recheck the assumptions that let a mechanism notify a nurse, compare cost, maintenance, configurability, speed, signal quality and safety, and follow the problem/goal/requirement/specification trace links across versions. At architecture level, the lecture separates monitoring the sound, determining the condition and controlling the warning. A new mechanism needs an updated preservation argument.","flag":"Added from NFR slides 74–77","original":false},{"id":"frq-added-28","lesson":"structured-english","prompt":"State the class book-discount policy and identify the inconsistency in the literal six-rule table.","criteria":["Bookstore: >6 gets25%; otherwise0%","Other librarian/individual: ≥50→15%,20–49→10%,6–19→5%,otherwise0%","Literal non-bookstore columns repeat N for order>6","This conflicts with ≥50/20–49 quantity cases if every condition is global","Normalize bookstore-only tests to don’t-care outside that branch"],"model":"Read the intended policy as bookstore orders above six copies receiving 25%, otherwise 0%; librarians/individuals receive 15% at 50+, 10% at 20–49, 5% at 6–19 and 0% otherwise. The literal slide repeats N under Order size >6 in non-bookstore columns even for ≥50 copies, creating inconsistent combinations. Scope that test to the bookstore branch or use don’t-care entries when normalizing.","flag":"Added from Structured Analysis p. 20","original":false},{"id":"frq-added-29","lesson":"idef","prompt":"Explain SADT actigrams vs. datagrams and illustrate branching, joining, feedback and tunneling.","criteria":["Actigram centers on activities; datagram centers on data","Branching splits a concept; labels explain components/reuse","Joining combines; feedback returns output as earlier input/control","Connected-end tunnel omitted at next lower level","Unconnected-end tunnel omitted at next higher level"],"model":"An actigram models an activity with inputs, controls, outputs and mechanisms. A datagram centers on data and relates producing/consuming activities. Branching splits or shares a concept; joining combines concepts; feedback sends an output back as an earlier input/control. A tunnel at the connected box end omits the concept at the next lower level; one at the unconnected end omits it at the next higher level.","flag":"Added from Structured Analysis pp. 29–34,53–64","original":false},{"id":"frq-added-30","lesson":"nfr-measures","prompt":"Work the exact bebugging example: 10 seeded bugs, 120 total detections including 6 seeded. Estimate remaining original bugs and explain the counting convention.","criteria":["Detection rate6/10=0.6","Original detected bugs=120−6=114","Estimated original total114/0.6=190","Remaining original190−114=76","Assume equal detectability/representative seeding; slide’s200 total includes10 seeded"],"model":"Six of ten seeded bugs found implies a 0.6 detection rate. Of 120 total detections, 114 are original bugs. Estimate 114/0.6=190 original bugs, leaving 190−114=76 original bugs. The slide’s alternative total200 includes the10 seeds; removing120 found bugs plus4 remaining seeds also leaves76. This relies on comparable detection rates; severity and unequal detectability limit the estimate.","flag":"Added from NFR slide 24","original":false},{"id":"frq-added-31","lesson":"formalizable-goals","prompt":"Read Prior’s Pp, Fp, Hp and Gp, then distinguish the Since and Until extensions.","criteria":["Pp: p held at some past time","Fp: p holds at some future time","Hp: p held throughout the past","Gp: p holds throughout the future","Since/Until connect persistence of a condition to a past/future event; state argument order explicitly"],"model":"Pp means p was true at some earlier time; Fp means p will be true at some later time; Hp means p was always true in the past; Gp means p will always be true in the future. The slide describes Spq as q true since a time when p was true, and Upq as q continuing until a time when p becomes true. Keep the slide’s parameter order explicit because notation conventions can differ.","flag":"Added from KAOS p. 17","original":false}],"originalNotes":"<h1>Requirements Engineering – Study Guide</h1>\n<p class=\"sub-t\">CS/SE 4351 · built from the 10 files you attached (Elicitation, Analysis-Modeling-Specification, Scenario Analysis, Enterprise Modeling, Structured Analysis/IDEF0, GORE, KAOS/i*, NFR decks, IDEF0 process-spec example). Slide examples are collected in <a href=\"#ex\">Section 14</a>. Use the <b>Test</b> tab (top) to practice free-response questions.</p>\n\n<h2 id=\"how\">0. How to use this guide</h2>\n<ul>\n<li>Sections 1–13 follow the lecture material topic by topic. <b>Yellow boxes</b> = things that are easy to get wrong or sound like exam questions. <b>Green boxes</b> = worked examples. <b>Blue boxes</b> = definitions.</li>\n<li>Section 14 lists specific slide examples (with deck + slide/page number where the deck is numbered) because past questions targeted specific slides. Know the <i>picture</i> and the <i>point</i> of each.</li>\n<li>Slide numbers: <span class=\"m\">NFR-18</span> = the 120-slide ppt; <span class=\"m\">NFR-4in1</span> = the 27-page handout; <span class=\"m\">Struct</span> = Structured-Analysis.pdf slide number; <span class=\"m\">Elic</span> = Elicitation deck (numbered by topic when slide numbers weren't printed). The Enterprise and AMS decks are cited by slide title.</li>\n</ul>\n\n\n<h2 id=\"signals\">0b. Exam signals from your OneNote (read this first)</h2>\n<p>Test 2 is Thursday 11/19, in class, free response, 40% of the course grade. Topics covered after Test 1: Elicitation; UML, ontology &amp; metamodeling; Enterprise modeling &amp; Vision documents; Structured analysis &amp; process spec (IDEF0); GORE; NFR/SIG; KAOS &amp; agent-oriented RE. Scenario analysis is on the syllabus but not flagged (lower priority). The “modules 4–8” boundary in your notes is tentative.</p>\n<table><tr><th>Topic</th><th>What your notes record</th><th>Confidence</th><th>Where in this guide</th></tr>\n<tr><td>Ethnomethodology</td><td>List 3 applications where it is highly effective</td><td>Explicit</td><td>§4.1</td></tr>\n<tr><td>Enterprise modeling</td><td>“S achieves R to solve P in D” as True/False</td><td>Explicit</td><td>§1, §7.1</td></tr>\n<tr><td>Vision document</td><td>Identify the error in the second sample’s problem statement (CSPS Vision p. 2: “Keeping current on collegiate sports events” is a <i>goal</i>, not a problem)</td><td>Explicit</td><td>§7.2</td></tr>\n<tr><td>UML class diagram</td><td>Slide 26: judge whether a diagram is correct; slides 23, 39–40 (possible association class)</td><td>Very likely</td><td>§7.4, §4b</td></tr>\n<tr><td>Structured analysis</td><td>Slide 22: fill in answers beside question marks (the PDF slide 22 is the Structured English loans example)</td><td>Explicit in notes</td><td>§8.2</td></tr>\n<tr><td>Process specification</td><td>Process-spec question worth 3 points (IDEF0 “Develop Requirements” example)</td><td>Explicit</td><td>§8.3</td></tr>\n<tr><td>NFR Framework</td><td>Slides 41–42: convert plain-English requirements into a graph (maybe 8 pts)</td><td>Strong</td><td>§12.6</td></tr>\n<tr><td>NFR label propagation</td><td>Slide 58 (≈ slide 63–64 in the PPT): label a SIG (maybe 6 pts)</td><td>Strong</td><td>§12.6</td></tr>\n<tr><td>KAOS notation</td><td>Label the dog-eared rectangle (3 pts); slide 5 “absolute symbol”</td><td>Explicit (symbol unclear)</td><td>§10 – check slides 3–6</td></tr>\n<tr><td>KAOS</td><td>Define liveness and safety with examples (2 pts)</td><td>Explicit</td><td>§10</td></tr></table>\n<div class=\"box\"><b>Slide-numbering warning:</b> your professor’s screen numbering differs from the downloaded files (NFR slide 44 on screen ≈ slide 40 in the PDF). Identify slides by title and picture, not number. Also unresolved in your notes: why “S,D satisfies R” was called false, and the “should/must = optional” shorthand (standard usage: <b>shall/must</b> = binding, <b>should/may</b> = non-binding).</div>\n\n<h2 id=\"big\">1. The big picture: D, W, R, S, G, P</h2>\n<p>The course keeps returning to one reference-model formula (Zave &amp; Jackson, WRSPM):</p>\n<div class=\"def\"><b>D, S ⊨ R</b> – the <b>S</b>pecification, given <b>D</b>omain (world) assumptions, achieves the <b>R</b>equirements.<br>\n<b>R, D ⊨ G</b> – the Requirements, given domain properties, satisfy (or <i>satisfice</i>, for soft goals) the <b>G</b>oals, which in turn counter the <b>P</b>roblem.<br>\nLong form used in slides: <code>MG, ProgG ⊨ SG; SG, DG ⊨ RG; RG, DG ⊨ G; (G ⊨ ¬P) ∨ (G ⊭ ¬P)</code> (the NFR deck's version carries the same idea; subscript <i>s</i> = softgoal side).</div>\n<table><tr><th>Symbol</th><th>Meaning</th><th>Mood</th></tr>\n<tr><td>W / D</td><td>World / Domain assumptions – facts about the environment</td><td>indicative (descriptive)</td></tr>\n<tr><td>R</td><td>Requirements – what the customer wants in the environment</td><td>optative (prescriptive)</td></tr>\n<tr><td>S</td><td>Specification – what the software must do at the interface</td><td>optative</td></tr>\n<tr><td>P</td><td>Program (implementation) / also \"Problem\" in the GORE formula</td><td>–</td></tr>\n<tr><td>G</td><td>Goals – stakeholder intents (hard goals and softgoals)</td><td>optative</td></tr>\n<tr><td>M</td><td>Machine (computer + program)</td><td>–</td></tr></table>\n<div class=\"box\"><b>Key slogan (appears in Elicitation, AMS, Enterprise Modeling):</b> “Requirements should contain nothing but information about the environment.” Requirements are about the <i>world</i> (the problem), not the machine. Over-specifying algorithms/data structures is a defect.</div>\n<ul>\n<li><b>Fn vs NFn:</b> in the NFR deck, functional (Fn) and non-functional (NFn) sides both sit between W, R, S; NFRs are operationalized through <i>nfr-operationalizations</i> while FRs through <i>fr-operationalizations</i>.</li>\n<li><b>Early vs late RE</b> and <b>requirements creeping rate</b> = percentage of change per unit time (“Can you cope with 50%/month?”).</li>\n<li><b>Relativism</b>: truth depends on the observer (meanings of words, assumptions about context, categories, perceptual limits, cognitive ability, values/experience). “In the land of the blind, the one-eyed man is king.”</li>\n<li><b>Wicked problem</b>: understanding real-world problems, how they relate to stakeholder needs, and proposing solutions; “One man’s ceiling is another man’s floor.”</li>\n</ul>\n\n<h2 id=\"ams\">2. Requirements analysis, modeling &amp; specification <span class=\"tag\">AMS deck</span></h2>\n<p>Topics: Problem · Carving the solution (product) space · Prioritizing requirements. Analysis, modeling and specification is <b>a continuous loop</b> (“How many cycles do you go through in your project?”). Einstein quote: <i>“It is more important to understand the problem than the solution.”</i></p>\n<h3 id=\"ams-prob\">2.1 What is a problem?</h3>\n<div class=\"def\"><b>Problem = TO-BE − AS-IS.</b> A problem is the difference between things as they are now (AS-IS) and as they are desired (goals / TO-BE). If AS-IS ≈ TO-BE there is little or no problem. Exercise on the slides: Student Application Processing System (AS-IS, TO-BE, Problem).</div>\n<p><b>Problem-analysis roadmap:</b> enterprise/business problem <i>or</i> solution idea/opportunity → identify stakeholders for the problem, root-cause analysis → actual problem identified &amp; defined → understand the problem in the context of business goals, identify constraints on system/project → gain agreement on the problem definition w.r.t. root causes → problem validated/adjusted → reassess that the solution idea is the best solution, consider alternatives and choose best → <i>best solution identified</i> → define solution system boundary, expand stakeholder list for solution → <b>elicit requirements</b>.</p>\n<p><b>Are requirements about the problem or the solution?</b> Both: “One man’s problem is another man’s solution; one man’s floor is another man’s ceiling.” Requirements exist at many levels of abstraction (stakeholder needs → features → software requirements → design/test/documentation) and you can ask <i>Why?</i> going up and <i>How?</i> going down.</p>\n<p><b>Carving the product space:</b> requirements represent a <i>compromise</i> among Environmental, Economic, Political and Feasibility concerns. Problem space = Problem, Needs. Solution space = Features (externally observable service by which the system directly fulfills stakeholder requests), Software Requirements (black-box specification of how the solution interacts with the outside world), Design, Test Procedures, User Documentation, with <b>traceability</b> across them.</p>\n<h3 id=\"ams-root\">2.2 The problem behind the problem</h3>\n<ul>\n<li><b>Fishbone (Ishikawa) diagram:</b> start from the perceived business problem (“Customers are dissatisfied with our service”); list contributing causes (e.g., banking at night, no privacy while banking, queues too long, too few branch locations); keep asking “Why?” and expand each rib.</li>\n<li><b>Validating a solution</b> with a fishbone: start from the perceived solution (“We need ATMs”); list reasons it is the right solution; keep asking why.</li>\n<li>The slides ask: <i>Which is better – fishbone or fault-tree diagram (FTD)?</i> and show a <b>Problem Interdependency Graph (PIG)</b>.</li>\n<li><b>Too many problems? Pareto principle (80–20 rule):</b> Pareto observed 80% of Italy’s wealth owned by 20% of people (1896). “Vital few, trivial many”: 20% of effort yields 80% of benefit. <b>Pareto-effect analysis</b>: bar chart of % contribution of each cause (banking at night, more locations, banking at airport, queues too long, privacy, other) – rank and attack the biggest contributors first.</li>\n</ul>\n<h3 id=\"ams-ahp\">2.3 Prioritizing: Analytic Hierarchy Process (AHP) [Karlsson &amp; Ryan 1997]</h3>\n<ol>\n<li>For <i>n</i> requirements build an <i>n × n</i> matrix; compare each pair: entry (i, j) = 1 equal value · 3 slightly more preferred · 5 strongly · 7 very strongly · 9 extremely; entry (j, i) = 1/entry(i, j).</li>\n<li>Sum each column → divide every entry by its column sum (normalize) → sum each row → divide row sum by <i>n</i>. Result = each requirement’s estimated <b>share of total project value</b>.</li>\n<li>Check <b>consistency</b>: a<sub>ij</sub> = a<sub>ik</sub> · a<sub>kj</sub> (transitivity). Pairwise judgments are subjective/ad hoc and may be inconsistent → compute the consistency index.</li>\n</ol>\n<div class=\"ex\"><b>Worked slide example (4 requirements):</b><pre>      r1   r2   r3   r4\nr1    1   1/3   2    4\nr2    3    1    5    3\nr3   1/2  1/5   1   1/3\nr4   1/4  1/3   3    1\ncolumn sums: 4.75  1.87  11  8.33 → normalize → row sums 1.05, 1.98, 0.34, 0.62\n÷4 → r1 = 0.26, r2 = 0.50, r3 = 0.09, r4 = 0.16</pre>\nInconsistency shown on slide: row 1 gives r1 = ⅓·r2 and r1 = 2·r3 ⇒ r2 = 6·r3, but row 2 says r2 = 5·r3.</div>\n<div class=\"box\"><b>“Shall” words (IEEE 830-1998):</b> <b>shall</b> = binding provision; <b>should/may</b> = non-binding; <b>will</b> = declaration of purpose (“The government will furnish…”) or future tense.</div>\n<h3 id=\"ams-vision\">2.4 Vision document &amp; stakeholders</h3>\n<ul>\n<li><b>Stakeholder:</b> an individual materially affected by the outcome of the system or the project(s) producing it. Slide example: Registrar (Kelly Hansen) – fields: Representative, Description, Type (User), Responsibilities, Success Criteria, Involvement, Deliverables, Comments/Concerns.</li>\n<li><b>Modeling is not perfect</b> [Jackson 1995]: there will always be phenomena in the model not present in the domain and vice-versa; perfecting the model is not always a good use of time.</li>\n<li>Exercise: Application Processing System — D = functional, workflow, informational, business model; P = complaints (external &amp; internal), weaknesses; G = wants and needs countering P (hard and soft); R = interaction model between D and S; S = functional, informational, behavioral models.</li>\n<li>Vision outline and problem-statement template are in <a href=\"#em\">Section 7</a>.</li>\n</ul>\n\n<h2 id=\"elic\">3. Critical issues &amp; desirable qualities of requirements <span class=\"tag\">Elicitation deck</span></h2>\n<div class=\"def\"><b>Qualities of a (software) requirement</b> [Leffingwell &amp; Widrig 1999; IEEE 830-1993 §4.3.2]:\n<table><tr><th>Quality</th><th>Meaning</th></tr>\n<tr><td>Correct</td><td>A true statement of something the system must do (external consistency with the real world)</td></tr>\n<tr><td>Complete</td><td>All significant requirements of concern to the user are included</td></tr>\n<tr><td>Consistent</td><td>Does not conflict with other requirements</td></tr>\n<tr><td>Unambiguous</td><td>One and only one interpretation (“A shall do B to C”)</td></tr>\n<tr><td>Verifiable</td><td>A finite, cost-effective process exists with which a person or machine can check it</td></tr>\n<tr><td>Ranked for importance and stability</td><td>Priority and likelihood of change recorded</td></tr>\n<tr><td>Modifiable</td><td>Changes don’t affect the structure/style of the rest of the set</td></tr>\n<tr><td>Traceable</td><td>The origin of each requirement can be found</td></tr>\n<tr><td>Understandable</td><td>Can be comprehended by users and developers</td></tr></table></div>\n<h3>3.1 Ambiguity (unambiguous)</h3>\n<p>“Mary had a little lamb.” – nine readings arise from dictionary senses of <i>have</i> and <i>lamb</i> (owned a sheep; acquired a sheep; ate lamb meat; gave birth to a young antelope; tricked a gullible small person…). The <b>“sweet spot”</b> slide plots <i>understandability</i> against <i>ambiguity</i>: natural language is understandable but ambiguous; formal notation i
