 link supports the target; a satisficed source plus an accepted BREAK link opposes it.</li><li>HELP/HURT are weaker relations that need additional propositions to complete a sufficient positive/negative argument. Do not turn either into a decisive conclusion solely from its sign.</li><li>The undetermined relation represents uncertainty among possible contribution types, not proof of a harmless effect.</li></ul><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"64\">Open class slides · 64 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"65\">Open class slides · 65 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"66\">Open class slides · 66 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"67\">Open class slides · 67 ↗</button></div><h3>Account and home-network refinements</h3><ul><li><strong>Type:</strong> Security → Integrity / Confidentiality / Availability; Integrity → Accuracy / Completeness.</li><li><strong>Topic:</strong> Accuracy[Account] → Accuracy[RegularAccount], Accuracy[GoldAccount], Accuracy[PremierAccount]; debit/credit, high spending, history and agent roles further scope a topic.</li><li><strong>Operationalization:</strong> authentication → password, fingerprint, combined factors; performance → indexing → single/multi-level or keyword/category methods.</li><li><strong>Functional choices:</strong> home-network garage door, oven and lighting affect information/physical security and ease of use.</li><li><strong>Priority and claims:</strong> ! / !! show importance; “no reported break-ins due to fixed lighting” is a claim to examine, not a guarantee of security.</li><li><strong>Knowledge reuse:</strong> catalogues include methods, correlation rules and reusable patterns. They still require domain-specific justification.</li></ul><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"44\">Open class slides · 44 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"45\">Open class slides · 45 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"46\">Open class slides · 46 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"47\">Open class slides · 47 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"48\">Open class slides · 48 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"49\">Open class slides · 49 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"50\">Open class slides · 50 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"51\">Open class slides · 51 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"52\">Open class slides · 52 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"53\">Open class slides · 53 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"54\">Open class slides · 54 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"55\">Open class slides · 55 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"56\">Open class slides · 56 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"57\">Open class slides · 57 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"58\">Open class slides · 58 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"59\">Open class slides · 59 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"60\">Open class slides · 60 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"61\">Open class slides · 61 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"62\">Open class slides · 62 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"68\">Open class slides · 68 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"69\">Open class slides · 69 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"70\">Open class slides · 70 ↗</button></div>","source":"NFR-18 slides 43–70","priority":true,"questions":["sig-class-examples-0","sig-class-examples-1","sig-class-examples-2","sig-class-examples-3"],"frq":["frq-added-24","frq-added-25"]},{"id":"nfr-reference","module":"nfr","title":"Patient monitoring & property-preserving evolution","intro":"Connect quality goals to environment assumptions, interface phenomena and architecture.","keys":["A buzzer specification depends on the nurse-hears-buzzer and sensing assumptions.","Distinguish environment-hidden/visible and system-hidden/visible phenomena.","Follow trace links when the AS-IS model or a TO-BE assumption changes."],"html":"<h3>Patient monitoring: the reference model made concrete</h3><table><thead><tr><th>Element</th><th>Class example</th></tr></thead><tbody><tr><td>Need / problem</td><td>Detect a failing heart; constant manual vigilance is difficult and can fail.</td></tr><tr><td>Requirement R1</td><td>Notify the nurse if the patient’s heartbeat is about to stop.</td></tr><tr><td>Domain D1</td><td>A nurse is close enough to hear the buzzer.</td></tr><tr><td>Domain D2</td><td>Heart sound falling below the chosen threshold indicates imminent heart stoppage.</td></tr><tr><td>Specification S1</td><td>If sensor sound is below the threshold, actuate the buzzer.</td></tr><tr><td>Machine / implementation</td><td>Microphone sensor, buzzer actuator, program and platform.</td></tr></tbody></table><h3>The four designation categories</h3><table><thead><tr><th>Category</th><th>Example from the slide</th></tr></thead><tbody><tr><td>eₕ · environment-hidden</td><td>The nurse and the patient’s heartbeat.</td></tr><tr><td>eᵥ · environment-visible</td><td>Sounds from the patient’s chest that the system can sense.</td></tr><tr><td>sᵥ · system-visible</td><td>The buzzer at the nurse’s station.</td></tr><tr><td>sₕ · system-hidden</td><td>The internal representation of sensed data.</td></tr></tbody></table><h3>Attach quality concerns at the right points</h3><p>Care/monitoring goals refine into a low-cost, low-maintenance, configurable and proven warning system; fast notification; a capable nurse; a clear signal; and a safe, secure yet loud-enough warning. Compare alternatives such as a buzzer and a beeper, and keep the domain assumptions visible.</p><p>At the architecture level, the example shows functions to monitor sound, determine the condition and control the buzzer. Quality reasoning follows the chain from intent to requirements, specification and architecture.</p><h3>Property-preserving evolution</h3><p>The AS-IS → TO-BE₁ → TO-BE₂ diagrams retain dependencies among problems, goals, domain properties, requirements and specifications. When one changes, use trace links to check whether the justification of a downstream decision still holds; do not assume a property survives a changed assumption.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"71\">Open class slides · 71 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"72\">Open class slides · 72 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"73\">Open class slides · 73 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"74\">Open class slides · 74 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"75\">Open class slides · 75 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"76\">Open class slides · 76 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"77\">Open class slides · 77 ↗</button></div>","source":"NFR-18 slides 71–77","priority":true,"questions":["nfr-reference-0","nfr-reference-1","nfr-reference-2","nfr-reference-3"],"frq":["frq-added-26","frq-added-27"]},{"id":"nfr-templates","module":"nfr","title":"NFRs in RUP, Volere & UML","intro":"Keep quality requirements organized and traceable when they affect several features or use cases.","keys":["Vision records high-level constraints; Supplementary Specification records cross-cutting details.","Volere adds motivation and fit criteria.","Scattered “special requirements” text can hide cross-cutting NFRs and weaken traceability."],"html":"<h3 id=\"nfr-tmpl\">12.8 Where NFRs go: RUP Vision, Volere, UML</h3>\n<ul><li><b>Where:</b> RE, system/software architecting, design, implementation, V&amp;V, testing, maintenance, project planning, configuration management, decision making. <b>How to represent:</b> informal → tabular → visual; a template row: Name, Description, Type, Topic, Agent, Viewpoint, Priority, Affected NFRs, Affecting NFRs/Operationalizations, Claim.</li>\n<li><b>RUP Vision (Home Appliance Control System, HACS v1.2):</b> NFRs live in §6 Constraints – 6.1 Security (authentication by ID+password; encryption of transmissions; Homeowner/Business Owner can monitor &amp; change, Customer-Care users can only monitor and place a medical-alert request), 6.2 Usability (easy; emergency request by push button/voice), 6.3 Responsiveness (2 s average local, 4 s remote), 6.4 Capacity (max sequences)…</li>\n<li><b>Volere template</b> (Atlantic Systems Guild): project drivers (1–3), constraints (4–7), functional (8–9), <b>NFR sections 10–17: 10 Look &amp; Feel, 11 Usability &amp; Humanity (ease of use, personalization/internationalization, ease of learning, understandability/politeness), 12 Performance (speed/latency, safety-critical, precision, reliability &amp; availability, capacity), 13 Operational (physical environment, technological environment, partner applications, productization), 14 Maintainability &amp; Support (maintenance, special conditions, supportability, adaptability), 15 Security (access, integrity, privacy, audit, immunity), 16 Cultural &amp; Political, 17 Legal (compliance, standards)</b>. Each requirement has content, motivation, examples, and a <b>fit criterion</b>.</li>\n<li><b>UML and NFRs:</b> UML is the de facto OOA standard but <b>FR-dominant</b>. Use-case template embeds NFRs as text in “special requirements” → problems (NFR-18 119): (1) NFRs not modeled/organized and not visual; (2) not traceable to architecture and design; (3) error-prone if an NFR applies to several use cases. Proposed: <b>NFR association points</b> – Actor–NFR, Actor–Use case association–NFR, Use case–NFR, System boundary–NFR associations, with <b>NFR goals</b> and propagation (Pricing System example: Submit Price Proposal, Approve Price Proposal, Update Bill of Material, Send RFP…). <b>Other integration schemes (NFR-4in1 p. 26):</b> Cysneiros (LEL text; SIG + class/ERD extensions), Lee (use cases for NFRs), Moreira (stereotyped unnamed use cases e.g. &lt;&lt;Security&gt;&gt;), Dimitrov (annotations; performance only) – none is use-case-driven, organizes NFRs, preserves use-case principles and is generic.</li></ul>\n\n<h3>HACS: the exact constraints shown in class</h3><p>The HACS Vision example uses a six-section outline ending with Constraints, with Security, Usability, Responsiveness and Capacity subsections, plus a COTS-components appendix. This example is shorter than the generic Vision outline elsewhere in your notes.</p><table><thead><tr><th>Constraint</th><th>Class example</th></tr></thead><tbody><tr><td>Security</td><td>Identifier/password authentication; homeowners/business owners may monitor and change state; Customer Care may monitor and manually request a medical-alert ambulance. Encrypt transmissions for privacy.</td></tr><tr><td>Usability</td><td>Safety-related services should be easy to invoke; ambulance, police or fire requests by a button or voice activation.</td></tr><tr><td>Responsiveness</td><td>Average local response within 2 seconds; average remote response within 4 seconds. An average is not a maximum or percentile.</td></tr><tr><td>Lighting capacity</td><td>20 sequences and 50 controllable lights for indoor lighting; the same limits for outdoor lighting.</td></tr><tr><td>Entertainment capacity</td><td>20 sequences and 10 controllable radios/CD players/televisions.</td></tr><tr><td>Safety/security capacity</td><td>20 sequences and 50 controllable sensors/cameras/VCRs/emergency notifications in the listed group.</td></tr></tbody></table><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"94\">Open class slides · 94 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"95\">Open class slides · 95 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"99\">Open class slides · 99 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"100\">Open class slides · 100 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"101\">Open class slides · 101 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"102\">Open class slides · 102 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"103\">Open class slides · 103 ↗</button></div><h3>Volere subsection details that supplement the earlier summary</h3><table><thead><tr><th>Section</th><th>Subtopics and fit-criterion cues</th></tr></thead><tbody><tr><td>10 · Look and Feel</td><td>Appearance and style; define the desired experience and observable criteria.</td></tr><tr><td>11 · Usability and Humanity</td><td>Ease of use, personalization/internationalization, ease of learning, understandability/politeness and accessibility. Language, currency and conventions belong here; define the user population and acceptable learning effort.</td></tr><tr><td>12 · Performance</td><td>Speed/latency, safety-critical behavior, precision/accuracy, reliability/availability, robustness/fault tolerance, capacity, scalability and longevity. State units, ranges, loads, operating periods and growth horizons.</td></tr><tr><td>13 · Operational</td><td>Physical environment, technological environment, partner applications and productization (distribution/packaging/installation experience).</td></tr><tr><td>14 · Maintainability and Support</td><td>Maintenance, special maintenance conditions, supportability, adaptability and installation. Define change effort, target platforms and installation duration where relevant.</td></tr><tr><td>15 · Security</td><td>Access, integrity, privacy, audit and immunity against undesirable software. Access criteria identify the function/data and authorized roles.</td></tr><tr><td>16 · Cultural and Political</td><td>Cultural conventions and organizational/political constraints; distinguish them from purely technical preferences.</td></tr><tr><td>17 · Legal</td><td>Compliance and standards; identify the applicable rule and the evidence or certification needed. Examples in these historical slides are not current legal guidance.</td></tr></tbody></table><p>A fit criterion turns a broad property into an assessable requirement. The examples contrast a two-second maximum with vague “fast enough,” two-decimal monetary precision, local-mode operation after a server-link failure, and quantified capacity/growth. Do not silently replace a maximum with an average.</p><div class=\"actions source-actions\"><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"96\">Open class slides · 96 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"97\">Open class slides · 97 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"98\">Open class slides · 98 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"104\">Open class slides · 104 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"105\">Open class slides · 105 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"106\">Open class slides · 106 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"107\">Open class slides · 107 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"108\">Open class slides · 108 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"109\">Open class slides · 109 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"110\">Open class slides · 110 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"111\">Open class slides · 111 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"112\">Open class slides · 112 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"113\">Open class slides · 113 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"114\">Open class slides · 114 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"115\">Open class slides · 115 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"116\">Open class slides · 116 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"117\">Open class slides · 117 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"118\">Open class slides · 118 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"119\">Open class slides · 119 ↗</button><button class=\"source-link\" type=\"button\" data-action=\"slide\" data-deck=\"nfr\" data-value=\"120\">Open class slides · 120 ↗</button></div>","source":"§12.8","priority":false,"questions":["nfr-templates-0","nfr-templates-1","nfr-templates-2","nfr-templates-3"],"frq":[]},{"id":"sysml","module":"recap","title":"SysML appendix","intro":"Recognize the historical SysML version discussed in the uploaded lecture notes.","keys":["The notes describe SysML 1.x as a UML-based systems modeling language.","Requirement and parametric diagrams add systems-engineering views.","Block Definition and Internal Block diagrams model system structure."],"html":"<div class=\"source-note\"><strong>Version context</strong><p>This appendix preserves the historical SysML 1.x material in the course notes. The dates and “UML profile” description refer to those versions, not every later SysML release.</p></div><ul><li>History: UML-for-SE RFP March 2003 (with INCOSE) → draft Jan 2004 → <b>v1.0 July 2006</b> (OMG) → v1.1 June 2008 → v1.2 June 2010.</li>\n<li>A graphical modeling language; a <b>UML profile</b> (subset of UML 2 + extensions) supporting specification, analysis, design, verification and validation of systems incl. <b>hardware, software, data, personnel, procedures, facilities</b>; model interchange via <b>XMI</b> and AP233; supports model-driven SE.</li>\n<li><b>New diagram types:</b> <b>Requirement diagram</b> and <b>Parametric diagram</b>. <b>Structure:</b> Block Definition Diagram (class-diagram-based, blocks instead of classes), Internal Block Diagram (composite-structure-based). <b>Activity diagram</b> extensions: continuous flow, control operators/disabling, EFFBDs.</li></ul>\n","source":"§13 · appendix","priority":false,"questions":["sysml-0","sysml-1","sysml-2","sysml-3"],"frq":["frq-added-10"]},{"id":"exam-signals","module":"recap","title":"Flagged examples & exam signals","intro":"Use the topics recorded in your notes as revision priorities while keeping uncertain details separate.","keys":["Explicit flags include ethnomethodology, Structured English, IDEF0, SIGs and KAOS safety/liveness.","Slide numbers differ across handouts; identify the title and example.","Recorded schedule and point claims remain unconfirmed; slide-specific examples can now be opened directly."],"html":"<div class=\"source-note\"><strong>Class slides are now available</strong><p>The recorded flags below remain your original notes. Exact examples and diagrams from the five newly supplied decks are now linked in the lessons and the Class Slides section. The process-spec sketch’s arrow placement and the KAOS/NFR formulas are clarified there.</p></div><div class=\"source-note\"><strong>Recorded exam information</strong><p>The schedule and point values below come from the uploaded notes. The Quest title follows your request for a Final Exam Quest; the original guide calls it Test 2.</p></div><p>Test 2 is Thursday 11/19, in class, free response, 40% of the course grade. Topics covered after Test 1: Elicitation; UML, ontology &amp; metamodeling; Enterprise modeling &amp; Vision documents; Structured analysis &amp; process spec (IDEF0); GORE; NFR/SIG; KAOS &amp; agent-oriented RE. Scenario analysis is on the syllabus but not flagged (lower priority). The “modules 4–8” boundary in your notes is tentative.</p>\n<table><tr><th>Topic</th><th>What your notes record</th><th>Confidence</th><th>Where in this guide</th></tr>\n<tr><td>Ethnomethodology</td><td>List 3 applications where it is highly effective</td><td>Explicit</td><td>§4.1</td></tr>\n<tr><td>Enterprise modeling</td><td>“S achieves R to solve P in D” as True/False</td><td>Explicit</td><td>§1, §7.1</td></tr>\n<tr><td>Vision document</td><td>Identify the error in the second sample’s problem statement (CSPS Vision p. 2: “Keeping current on collegiate sports events” is a <i>goal</i>, not a problem)</td><td>Explicit</td><td>§7.2</td></tr>\n<tr><td>UML class diagram</td><td>Slide 26: judge whether a diagram is correct; slides 23, 39–40 (possible association class)</td><td>Very likely</td><td>§7.4, §4b</td></tr>\n<tr><td>Structured analysis</td><td>Slide 22: fill in answers beside question marks (the PDF slide 22 is the Structured English loans example)</td><td>Explicit in notes</td><td>§8.2</td></tr>\n<tr><td>Process specification</td><td>Process-spec question worth 3 points (IDEF0 “Develop Requirements” example)</td><td>Explicit</td><td>§8.3</td></tr>\n<tr><td>NFR Framework</td><td>Slides 41–42: convert plain-English requirements into a graph (maybe 8 pts)</td><td>Strong</td><td>§12.6</td></tr>\n<tr><td>NFR label propagation</td><td>Slide 58 (≈ slide 63–64 in the PPT): label a SIG (maybe 6 pts)</td><td>Strong</td><td>§12.6</td></tr>\n<tr><td>KAOS notation</td><td>Label the dog-eared rectangle (3 pts); slide 5 “absolute symbol”</td><td>Explicit (symbol unclear)</td><td>§10 – check slides 3–6</td></tr>\n<tr><td>KAOS</td><td>Define liveness and safety with examples (2 pts)</td><td>Explicit</td><td>§10</td></tr></table>\n<div class=\"box\"><b>Slide-numbering warning:</b> your professor’s screen numbering differs from the downloaded files (NFR slide 44 on screen ≈ slide 40 in the PDF). Identify slides by title and picture, not number. Also unresolved in your notes: why “S,D satisfies R” was called false, and the “should/must = optional” shorthand (standard usage: <b>shall/must</b> = binding, <b>should/may</b> = non-binding).</div>\n\n<p>Only the slides Dr. Chung flagged for Test 2 (from your OneNote summary). Identify slides by <b>title and picture</b>: numbers on his screen run about 4 higher than the PDF in the NFR deck.</p>\n<table><tr><th>Flagged item</th><th>What the slide shows</th><th>How to answer</th></tr>\n<tr><td><b>Elicitation 18</b> (“How to elicit?” – Recall)</td><td>Major themes: error detection &amp; removal; conceptuality vs formality (natural language → semi-formal → formal; defects ↑ at the informal end, ↓ at the formal end); completeness is sometimes “the” key issue; ontological primitives (goals, agents, decisions, rationale, entities, activities, constraints); organizational primitives (classes/metaclasses, associations/aggregations, superclasses/subclasses, views); definition of ontology</td><td>Completeness is hard, so use ontological primitives (goal-/agent-/object-orientation) to guide what to ask about.</td></tr>\n<tr><td><b>Elicitation 22</b> (Ethnomethodology – “Why is it difficult? A wicked problem”)</td><td>The “say-do” problem: people know how to do things but normally don’t describe them (tacit knowledge); descriptions may be highly inaccurate. “So, what should be done then? <b>List three examples</b>.”</td><td>Answer: observe people in their natural setting (ethnomethodology) and give three examples where it works well.</td></tr>\n<tr><td><b>Elicitation 23</b> (Data/information elicitation techniques)</td><td>Ethnomethodology = “people’s methods”; observation is sometimes the best way to understand how things are done; observe in a NATURAL setting; cycle plan ahead (like interviewing) → observe &amp; record → analyze. e.g. <b>stock brokerage</b> (multiple phone calls, computer), <b>HCI</b>. Caveats: ethical/legal issues if video-taping without notification; not natural if people know they are observed; can be time-consuming to analyze.</td><td>Three applications: stock brokerage, HCI, plus a third of your own where work is tacit and social (e.g. call centre / emergency dispatch, hospital ward or factory floor workflow). State the say-do reason.</td></tr>\n<tr><td><b>Enterprise: “S achieves R to solve P in D”</b> (True/False)</td><td>Reference model: D, S ⊨ R and R, D ⊨ G; S = specification, R = requirements, D = domain, P = problem (goals counter P)</td><td>True in the sense that the machine S, <i>operating in domain D</i>, achieves R, which solves P. Be careful: “S, D satisfies R” on its own was noted false by the professor, so read the exact wording (the formal relation is D, S ⊨ R, and R, D ⊨ G).</td></tr>\n<tr><td><b>Enterprise 23, 26, 39–40</b> (UML class diagram correctness; possible association class)</td><td>Class diagram notation: association, multiplicity, generalization, association class; a diagram to judge correct / incorrect</td><td>Check: names on classes, multiplicity on each end, generalization arrowhead pointing to the superclass, association class dashed to the association line. Say <i>why</i> a diagram is wrong. (M02 UML deck was not provided: share it for slide-exact practice.)</td></tr>\n<tr><td><b>CSPS Vision p. 2</b> (problem statement)</td><td>“Keeping current on collegiate sports events” is given as the problem</td><td>That is a <b>desired goal</b>, not the existing difficulty. Rewrite: “The problem of <i>users not being able to easily keep current with the events they care about</i> affects … the impact of which … a successful solution would …”.</td></tr>\n<tr><td><b>Structured Analysis 22</b> (Structured English)</td><td>Loans-at-risk: for each CUSTOMER NUMBER in CUSTOMERS, for each matching LOAN keep running totals (NUMBER OF LOANS, ORIGINAL LOAN PRINCIPAL, CURRENT LOAN BALANCE, AMOUNTS PAST DUE); if total amounts past due &gt; $100.00 write customer and attributes to LOANS AT RISK, else exclude.</td><td>Be able to fill blanks: the data stores (CUSTOMERS, LOANS), the four running totals, the $100.00 condition, the output flow LOANS AT RISK, and the If/Else.</td></tr>\n<tr><td><b>Structured Analysis 30</b> (SADT arrow semantics, actigram)</td><td>Mechanism = processor (machine, computer, person) that makes the activity happen; Controls influence execution but are <b>not consumed</b>; Outputs are produced by the activity; Inputs are data <b>consumed</b></td><td>ICOM: Input left, Control top, Output right, Mechanism bottom.</td></tr>\n<tr><td><b>IDEF0 process specification</b> (3 pts)</td><td>“Develop Requirements” box: User (input); Templates/standards (control); RE-Tools (mechanism); WRS doc + Vision doc (outputs); children Develop Phase I / Phase II</td><td>Label every ICOM arrow; verbs in boxes, nouns on arrows; 3–6 boxes per diagram.</td></tr>\n<tr><td><b>NFR 40</b> (professor’s ≈44)</td><td>Softgoal interdependency graph with softgoal types (NFR, operationalizing, claim), AND/OR decomposition, contribution types Make &gt;&gt; Help &gt;&gt; Hurt &gt;&gt; Break, and labels (satisficed, denied, conflicting, undetermined); Accuracy[Acct] with Gold/Premier/Regular accounts</td><td>Know the notation, <code>Type[Topic]</code> names, and what each label/arrow means.</td></tr>\n<tr><td><b>NFR 41–42</b> (convert plain English into a graph, possibly 8 pts)</td><td>In the PDF these are Quality Function Deployment slides; the plain-English → SIG exercise is the slide with the “Qualitative in nature, process oriented” graph (Secure Accounts → Integrity / Confidentiality / Availability; Integrity → Complete / Accurate) and the SIG construction slide</td><td>Procedure: write the top NFR softgoal <code>Type[Topic]</code>; refine by sub-type/topic (AND/OR); add operationalizing softgoals; add claims for justification; mark contributions (++, +, −, −−); then evaluate.</td></tr>\n<tr><td><b>NFR 58</b> (label a SIG, possibly 6 pts)</td><td>“Evaluation thru label propagation”: leaves labeled ✓ satisficed, ✗ denied, conflicting (lightning), U undetermined; Make/Help/Hurt/Break arrows; AND/OR links; the “healthy elixir / bomb” quiz</td><td>Propagate bottom-up: A satisficed Make source provides positive support; a satisficed Break source provides negative support; denied sources alone do not establish the opposite; Help/Hurt = weaker (may only give undetermined/conflicting unless otherwise supported); AND = weakest child; OR = strongest child.</td></tr>\n<tr><td><b>KAOS 3–6</b> (3 pts dog-eared rectangle; 2 pts liveness/safety; slide 5 symbol)</td><td>Goal shape (parallelogram), requirement vs expectation (bold outline = assigned to a single agent), temporal operators: ◊ (eventually), □ (always); patterns Achieve P ⇒ ◊Q, Maintain □(P ⇒ Q), Avoid □(P ⇒ ¬Q)</td><td><b>Liveness</b>: something good eventually happens (◊), e.g. a requested train eventually gets a movement authority. <b>Safety</b>: something bad never happens (□), e.g. two trains are never on the same block. Identify the named responsibility boxes as agents using the supplied train diagram and Resp links.</td></tr>\n<tr><td><b>Metamodel 3–5</b></td><td>Instance / class / metaclass; M0–M3 levels (MOF, UML, OCL)</td><td>Say which level each element belongs to.</td></tr></table>\n\n","source":"§0b, §14","priority":true,"questions":["exam-signals-0","exam-signals-1","exam-signals-2","exam-signals-3"],"frq":[]},{"id":"quick-recall","module":"recap","title":"Quick-recall cheat sheet","intro":"Say the definitions and distinctions aloud, then answer without looking.","keys":["Read a prompt, recall the answer, then check it.","Use the six focus topics for a short targeted revision route.","All original notes and all 39 original practice questions are included."],"html":"<table><tr><th>Question</th><th>One-line answer</th></tr>\n<tr><td>Formula for requirements and goals?</td><td>D, S ⊨ R and R, D ⊨ G (goals counter the problem P).</td></tr>\n<tr><td>Define a problem.</td><td>TO-BE − AS-IS (gap between current state and desired goals).</td></tr>\n<tr><td>Nine requirement qualities?</td><td>Correct, complete, consistent, unambiguous, verifiable, ranked, modifiable, traceable, understandable.</td></tr>\n<tr><td>Four tenets of JAD?</td><td>Group dynamics, visual aids, organized rational process, WYSIWIG documentation.</td></tr>\n<tr><td>Sampling tasks?</td><td>Data determination, population, type (purposive/random), sample size.</td></tr>\n<tr><td>Three domain types / two phenomena types?</td><td>Causal, biddable, lexical / causal, symbolic.</td></tr>\n<tr><td>Five problem frames?</td><td>Required behavior, commanded behavior, information display, simple workpieces, transformation.</td></tr>\n<tr><td>Types of scenarios?</td><td>As-is, visionary, evaluation, training; (forms: use cases, episodes, scripts, CRC).</td></tr>\n<tr><td>Scenario question types?</td><td>What-if, who, what-kind-of, when, how-to, why.</td></tr>\n<tr><td>Three pruning sets?</td><td>Discarded, selected, undecided.</td></tr>\n<tr><td>include vs extend vs generalization?</td><td>Mandatory reuse/decomposition vs optional extension vs inherited specialization.</td></tr>\n<tr><td>DFD elements &amp; rules?</td><td>Process, dataflow, store, external entity; unique names, no control/decisions, leveling preserves I/O.</td></tr>\n<tr><td>IDEF0 ICOM positions?</td><td>Input left, Control top, Output right, Mechanism bottom; 3–6 boxes per diagram; verbs in boxes, nouns on arrows.</td></tr>\n<tr><td>IDEF0 model must declare?</td><td>Context (boundary), Viewpoint, Purpose.</td></tr>\n<tr><td>KAOS goal patterns?</td><td>Achieve (P→◊Q), Maintain (□(P→Q)), Avoid (□(P→¬Q)).</td></tr>\n<tr><td>Requirement vs expectation (KAOS)?</td><td>Software agent vs environment agent responsibility.</td></tr>\n<tr><td>i* models?</td><td>SD (actor dependencies: goal, softgoal, resource, task) and SR (internal rationale: task decomposition, means-ends).</td></tr>\n<tr><td>NFR four properties?</td><td>Non-functional, subjective, graded, interacting (and relative).</td></tr>\n<tr><td>SIG contribution/label types?</td><td>Make, Help, Hurt, Break (+U) / satisficed, denied, conflicting, undetermined.</td></tr>\n<tr><td>Availability formula?</td><td>MTTF / (MTTF + MTTR) × 100%.</td></tr>\n<tr><td>Forward vs backward traceability?</td><td>Requirement → work products/tests vs work product/requirement → origin.</td></tr>\n<tr><td>Why was the London Ambulance system a failure (RE view)?</td><td>NFRs (timeliness, resilience), organizational and SE mistakes; calls ≠ incidents; poor geography/resource tracking; no early NFR consideration.</td></tr></table>\n<p class=\"src\">Compiled from the attached course slides. Where a slide was image-only, details were taken from the rendered slide thumbnails and may be abbreviated – skim the originals for diagrams you plan to redraw.</p>\n","source":"§15","priority":false,"questions":["quick-recall-0","quick-recall-1","quick-recall-2","quick-recall-3"],"frq":[]}],"questions":[{"id":"reference-0","lesson":"reference","tier":0,"prompt":"Which symbol denotes assumptions about the environment?","options":["D","G","R","S"],"answer":[0],"explanation":"D describes domain properties or assumptions. R, S and G express desired outcomes or behavior."},{"id":"reference-1","lesson":"reference","tier":1,"prompt":"What does D, S ⊨ R express?","options":["The domain alone guarantees all requirements.","The requirements implement the specification.","The goals determine every program statement.","The specification achieves the requirements under domain assumptions."],"answer":[3],"explanation":"The entailment uses D and S together. Omitting assumptions can make an apparently adequate specification fail in the real world."},{"id":"reference-2","lesson":"reference","tier":2,"prompt":"A warning system sounds a buzzer, but nobody is close enough to hear it. Which assumption fails first?","options":["The buzzer specification is a goal.","The patient is a software agent.","The nurse can hear the warning.","The requirements contain no time limit."],"answer":[2],"explanation":"The patient-monitor example depends on a nurse being close enough to hear. Correct machine behavior alone does not ensure the real-world requirement."},{"id":"reference-3","lesson":"reference","tier":3,"prompt":"Which statements correctly distinguish the reference-model roles? Select all that apply.","options":["D is descriptive.","Reordering D and S as premises reverses the entailment.","R states what is wanted in the environment.","S describes the software’s interface obligations."],"answer":[0,2,3],"explanation":"D and S are jointly premises, so their order does not matter. The meaning changes if premises or conclusions are replaced or omitted."},{"id":"analysis-0","lesson":"analysis","tier":0,"prompt":"In the notes, a problem is the gap between…","options":["a class and an object.","TO-BE and AS-IS.","a phase and an iteration.","an input and a mechanism."],"answer":[1],"explanation":"Problem = TO-BE − AS-IS: the difference between the current situation and desired goals."},{"id":"analysis-1","lesson":"analysis","tier":1,"prompt":"Which technique repeatedly asks “why” to explore contributing causes?","options":["A traceability matrix","A use-case inclusion","A fishbone diagram","A decision table"],"answer":[2],"explanation":"A fishbone organizes contributing causes and can expose the problem behind the perceived problem."},{"id":"analysis-2","lesson":"analysis","tier":2,"prompt":"In AHP, aᵢⱼ = 5. What should the reciprocal comparison aⱼᵢ be?","options":["5","−5","1/5","1"],"answer":[2],"explanation":"The pairwise matrix uses reciprocal judgments: aⱼᵢ = 1/aᵢⱼ. Diagonal entries are 1."},{"id":"analysis-3","lesson":"analysis","tier":3,"prompt":"AHP says r1 = 2r2 and r2 = 3r3. Which r1/r3 comparison is multiplicatively consistent?","options":["6","5","1/6","3/2"],"answer":[0],"explanation":"Consistency requires a13 = a12 × a23 = 2 × 3 = 6. A different judgment flags inconsistency for review."},{"id":"quality-0","lesson":"quality","tier":0,"prompt":"Which quality requires one and only one interpretation?","options":["Traceable","Unambiguous","Modifiable","Ranked"],"answer":[1],"explanation":"Unambiguous requirements have exactly one interpretation. Traceability concerns origin and links, not wording alone."},{"id":"quality-1","lesson":"quality","tier":1,"prompt":"Which replacement for “the interface shall be easy” is most verifiable?","options":["The interface shall usually be intuitive.","The interface shall be pleasing to everyone.","The interface shall use a popular framework.","At least 95% of representative new users shall complete task X within 10 minutes without help in the specified usability test."],"answer":[3],"explanation":"A population, task, threshold, time and test context make the requirement checkable."},{"id":"quality-2","lesson":"quality","tier":2,"prompt":"Two requirements respectively demand that an account remain locked and become unlocked under the same conditions. Which defect is most direct?","options":["Missing glossary order","Low stability rank","Inconsistency","Excessive traceability"],"answer":[2],"explanation":"Under identical conditions the required outcomes conflict. A set is inconsistent if it derives a statement and its negation."},{"id":"quality-3","lesson":"quality","tier":3,"prompt":"Given A → B and A, which conclusion follows by modus ponens?","options":["¬B","¬A","A ∧ ¬B","B"],"answer":[3],"explanation":"Modus ponens derives B from A and A → B. The rule does not permit deriving A from B."},{"id":"techniques-0","lesson":"techniques","tier":0,"prompt":"What is the “say–do” problem?","options":["A mismatch between described work and actual work.","An invalid association cardinality.","A conflict between two programming languages.","A delay between questionnaire printing and delivery."],"answer":[0],"explanation":"Tacit knowledge and inaccurate descriptions make observation valuable."},{"id":"techniques-1","lesson":"techniques","tier":1,"prompt":"You need representative evidence about ATM peak load and transaction errors. What is a useful starting point?","options":["Restrict observation to one unusually quiet hour.","Sample transaction records across relevant branches and times.","Create a class diagram without collecting evidence.","Ask only the project sponsor to estimate every transaction."],"answer":[1],"explanation":"Existing records can reveal timing, error and load patterns. Define the data, population, sampling type and sample size."},{"id":"techniques-2","lesson":"techniques","tier":2,"prompt":"Which sequence matches FODA’s three phases?","options":["Requirements → Glossary → Claim","Sampling → Interviewing → Testing","Context analysis → Domain modeling → Architecture modeling","Construction → Transition → Inception"],"answer":[2],"explanation":"FODA establishes domain scope, models the problem space and considers architectures implementing solutions."},{"id":"techniques-3","lesson":"techniques","tier":3,"prompt":"Which practices reduce problems in an elicitation workshop? Select all that apply.","options":["Treat the loudest participant’s view as agreement.","Use a facilitator and recorder.","Use shared visual models and organized documentation.","Record and resolve differences across participants."],"answer":[1,2,3],"explanation":"JAD uses group dynamics, visual aids, an organized rational process and documentation. Dominance is not consensus."},{"id":"elicitation-question-0","lesson":"elicitation-question","tier":0,"prompt":"Which technique directly addresses tacit work through observation in a natural setting?","options":["Ethnomethodology","Normalization","AHP","Goal operationalization"],"answer":[0],"explanation":"Ethnomethodology studies how people accomplish work in context, including knowledge they do not normally articulate."},{"id":"elicitation-question-1","lesson":"elicitation-question","tier":1,"prompt":"Which answer best addresses the flagged “three applications” question?","options":["M0, M1 and M2, each tied to a modeling layer.","Java, Python and C++, each tied to compiler speed.","Inputs, controls and outputs, each tied to an IDEF0 box.","Stock brokerage, HCI studies and hospital workflow, each tied to tacit work."],"answer":[3],"explanation":"The answer needs three application settings, an explanation of the say–do problem and observation in the natural setting."},{"id":"elicitation-question-2","lesson":"elicitation-question","tier":2,"prompt":"“What if no ambulance is available?” primarily helps elicit…","options":["only class attributes.","the programming language.","exceptions, alternative responses and missing requirements.","only the existing happy path."],"answer":[2],"explanation":"What-if questions uncover failure handling and exceptional situations that a successful scenario may omit."},{"id":"elicitation-question-3","lesson":"elicitation-question","tier":3,"prompt":"Which should be included when planning workplace observation? Select all that apply.","options":["A promise that observation reveals every possible requirement.","Appropriate consent and recording arrangements.","Time to analyze recordings and focus on critical tasks.","The possibility that being observed changes behavior."],"answer":[1,2,3],"explanation":"Observation can uncover tacit work, but it is subject to ethical, observer-effect and analysis constraints. No single technique guarantees completeness."},{"id":"ontology-0","lesson":"ontology","tier":0,"prompt":"John, a particular person, is at which conceptual level?","options":["Metaclass","Meta-metamodel","Modeling language","Token / instance"],"answer":[3],"explanation":"John is a specific thing; Person is the class that groups such instances."},{"id":"ontology-1","lesson":"ontology","tier":1,"prompt":"A Student class in your university domain model is normally at…","options":["M1","M3","M2","M0"],"answer":[0],"explanation":"M1 contains the user model. M0 contains runtime instances, M2 the UML metamodel and M3 MOF."},{"id":"ontology-2","lesson":"ontology","tier":2,"prompt":"Adding a new kind of UML language construct changes which layer?","options":["M1 application model layer","Only a database row","M2 UML metamodel layer","M0 runtime instance layer"],"answer":[2],"explanation":"A new UML construct changes the language definition, rather than an individual application model using that language."},{"id":"ontology-3","lesson":"ontology","tier":3,"prompt":"What does conformance to a metamodel establish most directly?","options":["The system satisfies every stakeholder goal.","Every domain assumption is true.","The code has no runtime defects.","The model uses permitted concepts and relationships."],"answer":[3],"explanation":"Metamodel conformance concerns permitted model structure and well-formedness. It is not a guarantee of domain correctness or goal satisfaction."},{"id":"problem-frames-0","lesson":"problem-frames","tier":0,"prompt":"Which problem-frame domain type describes humans whose actions are not fully predictable?","options":["Machine-only","Causal","Lexical","Biddable"],"answer":[3],"explanation":"Biddable domains include humans. Lexical domains represent symbolic data; causal domains have predictable physical behavior."},{"id":"problem-frames-1","lesson":"problem-frames","tier":1,"prompt":"A tool lets staff create and edit persistent records. Which basic frame is the closest match?","options":["Information display","Required behavior","Transformation only","Simple workpieces"],"answer":[3],"explanation":"The simple-workpieces frame concerns creating and editing persistent information objects."},{"id":"problem-frames-2","lesson":"problem-frames","tier":2,"prompt":"Why must London Ambulance modeling distinguish calls from incidents?","options":["A single incident may be reported by multiple calls.","Geography can be omitted once a call exists.","Each call always creates a distinct incident.","Incidents are merely program variables with no world meaning."],"answer":[0],"explanation":"Duplicate reports can concern one incident. Failing to distinguish the concepts can cause duplicate dispatches and poor coordination."},{"id":"problem-frames-3","lesson":"problem-frames","tier":3,"prompt":"Which statement about a domain’s type is supported by the example?","options":["Only lexical phenomena can cross an interface.","An incident record is always a machine domain.","A domain must have the same role in every subproblem.","The same domain may play different roles in different decomposed problems."],"answer":[3],"explanation":"The notes describe Incidents as lexical in Call Taking and biddable in Dispatch, illustrating role-dependent modeling."},{"id":"scenarios-0","lesson":"scenarios","tier":0,"prompt":"Which relation adds conditional behavior to a base use case that is complete on its own?","options":["Extend","Instantiation","Composition","Include"],"answer":[0],"explanation":"An extension augments a complete base under a condition. Inclusion factors required reused behavior."},{"id":"scenarios-1","lesson":"scenarios","tier":1,"prompt":"For A «include» B, where does the dependency arrow point?","options":["Toward B, the included case.","Toward an association class.","Toward the external actor.","Toward A, the including case."],"answer":[0],"explanation":"The include arrow points to the included use case. An extend arrow points to the base being extended."},{"id":"scenarios-2","lesson":"scenarios","tier":2,"prompt":"A scenario demonstrates what the system should do for novice instruction. Which scenario type best fits?","options":["Training","Visionary","Structural","As-is"],"answer":[0],"explanation":"Training scenarios provide step-by-step guidance. As-is describes the present; visionary a proposed future; evaluation supports assessment."},{"id":"scenarios-3","lesson":"scenarios","tier":3,"prompt":"Which are the three mutually exclusive pruning sets in the notes?","options":["Selected, inherited, aggregated","Make, Help, Break","Primary, secondary, foreign","Discarded, selected, undecided"],"answer":[3],"explanation":"A scenario can be chosen, discarded or left undecided. Prioritization considers benefits, costs, risks and frequency."},{"id":"enterprise-0","lesson":"enterprise","tier":0,"prompt":"The Vision primarily communicates…","options":["only executable test code.","only database indexes.","the product’s high-level what and why.","every implementation detail."],"answer":[2],"explanation":"Vision aligns stakeholders on the problem, scope, features and priorities."},{"id":"enterprise-1","lesson":"enterprise","tier":1,"prompt":"Why is “Keeping current on collegiate sports events” a weak problem statement?","options":["It cannot be linked to any stakeholder.","It describes a desired goal rather than the current difficulty.","It uses a business term.","It names no programming language."],"answer":[1],"explanation":"State the existing difficulty, affected stakeholders and impact, then describe the business benefit of a successful solution."},{"id":"enterprise-2","lesson":"enterprise","tier":2,"prompt":"Which is the proper problem-statement structure?","options":["Actor → subclass → foreign key → exception","Phase → iteration → class → object","Problem → affected stakeholders → impact → successful solution","Algorithm → database → code → tests"],"answer":[2],"explanation":"The template separates the current problem, whom it affects, the consequences and the key benefits of solving it."},{"id":"enterprise-3","lesson":"enterprise","tier":3,"prompt":"Which activities help find business use cases? Select all that apply.","options":["Treat every internal method as a business use case.","Ask what value customers receive.","Name actors by role and understand their interactions.","Consider supporting and management processes."],"answer":[1,2,3],"explanation":"Business use cases concern value-producing business behavior; internal methods do not automatically correspond to actor goals."},{"id":"uml-erd-0","lesson":"uml-erd","tier":0,"prompt":"Which feature can a UML class diagram show that a basic ERD normally does not?","options":["Operations","Attributes","Relationships","Cardinalities"],"answer":[0],"explanation":"Class diagrams can show operations and responsibilities as well as structure. Basic ERDs focus on information structure."},{"id":"uml-erd-1","lesson":"uml-erd","tier":1,"prompt":"A hollow generalization triangle points toward…","options":["the subclass.","the superclass.","the object instance.","the association class."],"answer":[1],"explanation":"Generalization points from the more specific class to the more general class."},{"id":"uml-erd-2","lesson":"uml-erd","tier":2,"prompt":"A grade belongs to the association between a Student and a Course offering. Which construct can capture it?","options":["A control-flow guard alone","A deployment node","A navigability arrow alone","An association class such as Enrollment"],"answer":[3],"explanation":"An association class stores attributes belonging to the relationship itself, such as enrollment date or grade."},{"id":"uml-erd-3","lesson":"uml-erd","tier":3,"prompt":"Which comparison is accurate?","options":["Multiplicity is irrelevant to both models.","ERDs always show operations, while class diagrams never do.","Enhanced ER models can include specialization, while UML offers a broader set of object relationships.","Every class must map directly to a stored table."],"answer":[2],"explanation":"EER supports specialization/generalization. The data-vs-object emphasis is useful, but “ERDs can never show inheritance” would be too absolute."},{"id":"rup-0","lesson":"rup","tier":0,"prompt":"What does RUP stand for?","options":["Relational User Procedure","Rational Unified Process","Runtime Unified Program","Requirements Utility Protocol"],"answer":[1],"explanation":"RUP is the Rational Unified Process."},{"id":"rup-1","lesson":"rup","tier":1,"prompt":"Which is the correct RUP phase order?","options":["Inception → Elaboration → Construction → Transition","Elaboration → Inception → Transition → Construction","Inception → Construction → Elaboration → Transition","Transition → Inception → Elaboration → Construction"],"answer":[0],"explanation":"Inception establishes direction; Elaboration establishes a sound architecture; Construction builds; Transition deploys and supports acceptance."},{"id":"rup-2","lesson":"rup","tier":2,"prompt":"Where is a detailed cross-cutting performance requirement most naturally recorded alongside use-case specifications?","options":["Only in a method body","Only in the glossary","Only in an actor’s name","Supplementary Specification"],"answer":[3],"explanation":"Supplementary Specification captures quality requirements and constraints that do not fit neatly in a single use-case flow. Vision may also summarize them."},{"id":"rup-3","lesson":"rup","tier":3,"prompt":"A team says testing starts only after Construction because RUP phases each contain one exclusive discipline. What is wrong?","options":["Disciplines can overlap across phases, and phases can contain multiple iterations.","Requirements are prohibited during Elaboration.","All work must finish in Inception.","RUP has no phases."],"answer":[0],"explanation":"RUP is iterative: phases express lifecycle objectives, while disciplines organize kinds of work with changing emphasis."},{"id":"dfd-0","lesson":"dfd","tier":0,"prompt":"Which DFD element represents data at rest?","options":["Swimlane","Decision diamond","Data store","Control bar"],"answer":[2],"explanation":"Data stores represent retained information; data-flow arrows represent moving information."},{"id":"dfd-1","lesson":"dfd","tier":1,"prompt":"Which proposed DFD connection requires correction?","options":["Process → data store","Data store → process","Data store → data store with no process","External entity → process"],"answer":[2],"explanation":"A transformation process mediates data movement inside the modeled system. A direct store-to-store flow bypasses it."},{"id":"dfd-2","lesson":"dfd","tier":2,"prompt":"A parent has an outgoing “Result” flow; its child decomposition has no equivalent output. What is the concern?","options":["Too many query scales","Excessive generalization","Unbalanced decomposition","Wrong KAOS agent"],"answer":[2],"explanation":"Decomposition should preserve the meaning of inputs and outputs crossing the parent boundary."},{"id":"dfd-3","lesson":"dfd","tier":3,"prompt":"What can a DFD alone tell you?","options":["The exact order and duration of all process executions.","That every process executes once.","Which branch a processor executes next.","How data moves among transformations, stores and external entities."],"answer":[3],"explanation":"DFDs capture data movement and transformation. Do not infer control sequencing or fixed timing from their arrows."},{"id":"structured-english-0","lesson":"structured-english","tier":0,"prompt":"Which construct guarantees at least one body execution?","options":["REPEAT … UNTIL","FOR EACH over an empty set","WHILE","IF with a false condition"],"answer":[0],"explanation":"REPEAT tests after the body. WHILE tests before it; FOR EACH can have zero matching items."},{"id":"structured-english-1","lesson":"structured-english","tier":1,"prompt":"A customer’s total past-due amount is exactly $100.00. Under the slide rule, what happens?","options":["Exclude from LOANS AT RISK.","Include in LOANS AT RISK.","The rule does not define the boundary.","Include only if there are two loans."],"answer":[0],"explanation":"The threshold is strictly greater than $100.00. Equality does not pass the condition."},{"id":"structured-english-2","lesson":"structured-english","tier":2,"prompt":"Where must the four running totals be reset?","options":["After every matching loan before adding its values.","Only when the output report is written.","At the start of each customer’s processing.","Once, before processing every customer."],"answer":[2],"explanation":"Each customer needs independent totals. Resetting once carries totals between customers; resetting per loan loses accumulated values."},{"id":"structured-english-3","lesson":"structured-english","tier":3,"prompt":"Which features describe a decision table? Select all that apply.","options":["Columns correspond to rules.","Rows include condition stubs and action stubs.","Columns represent UML subclasses.","Condition combinations should be checked for gaps and contradictions."],"answer":[0,1,3],"explanation":"A decision table relates combinations of condition values to actions; it is not a class hierarchy."},{"id":"idef-0","lesson":"idef","tier":0,"prompt":"Which ICOM arrow enters an IDEF0 box from the top?","options":["Output","Mechanism","Control","Input"],"answer":[2],"explanation":"Controls govern the function. Inputs enter on the left, outputs leave on the right and mechanisms enter from the bottom."},{"id":"idef-1","lesson":"idef","tier":1,"prompt":"Under standard IDEF0, tools that carry out a function are modeled as…","options":["mechanisms entering at the bottom.","outputs at the right in every model.","controls at the top in every model.","inputs at the left in every model."],"answer":[0],"explanation":"Tools performing the function are normally mechanisms. The supplied teaching sketch instead draws RE-tools above the box, so distinguish that drawing from standard ICOM conventions."},{"id":"idef-2","lesson":"idef","tier":2,"prompt":"Which is the correct interpretation of the IDEF0 box-count rule?","options":["Every child contains exactly two boxes.","A-0 is an output-flow name.","Every diagram, including context, has at least three boxes.","A-0 has one context box; decomposition diagrams generally have 3–6."],"answer":[3],"explanation":"The context diagram is the one-box exception. The Phase I/II teaching sketch is a simplification."},{"id":"idef-3","lesson":"idef","tier":3,"prompt":"Which labels fit IDEF0 conventions?","options":["Box: “WRS document”; arrow: “Analyze”","Box: “Templates”; arrow: “RE-Tools run”","Box: “Develop Requirements”; arrow: “Vision document”","Box: “Requirements”; arrow: “Develop”"],"answer":[2],"explanation":"Function boxes use verbs or verb phrases; arrows use nouns or noun phrases."},{"id":"gore-0","lesson":"gore","tier":0,"prompt":"What is teleology concerned with?","options":["Only data types","Only token instances","Purpose and ends","Only runtime speed"],"answer":[2],"explanation":"Goal orientation is rooted in purpose: why the system and its requirements are needed."},{"id":"gore-1","lesson":"gore","tier":1,"prompt":"H :- B1, B2 means that proving H by this rule requires…","options":["the negation of B1.","neither B1 nor B2.","either B1 or B2.","both B1 and B2."],"answer":[3],"explanation":"A rule body is a conjunction. Separate clauses with the same head can provide alternatives."},{"id":"gore-2","lesson":"gore","tier":2,"prompt":"Following a requirement to the tests that check it is…","options":["an anti-goal.","backward traceability.","topic refinement.","forward traceability."],"answer":[3],"explanation":"Forward tracing moves toward satisfying/verifying work products. Backward tracing leads toward the origin or higher-level need."},{"id":"gore-3","lesson":"gore","tier":3,"prompt":"Why is “we wrote many requirements” insufficient evidence of completeness?","options":["Only use-case counts matter.","The requirements must be sufficient for their goals under the domain assumptions.","Completeness is determined by font size.","Traceability replaces all requirements."],"answer":[1],"explanation":"GORE assesses sufficiency relative to goals and assumptions, not the sheer length of a document."},{"id":"kaos-0","lesson":"kaos","tier":0,"prompt":"A realizable goal assigned to a software-to-be agent is a…","options":["resource dependency.","domain property.","claim softgoal.","requirement."],"answer":[3],"explanation":"A requirement is assigned to software; an expectation is assigned to an environment agent."},{"id":"kaos-1","lesson":"kaos","tier":1,"prompt":"In goal elaboration, asking WHY usually moves…","options":["from a data store to a process.","up toward higher-level goals.","from M1 to a runtime object.","down toward implementation details."],"answer":[1],"explanation":"WHY asks what broader purpose a goal supports. HOW asks for refinements and means."},{"id":"kaos-2","lesson":"kaos","tier":2,"prompt":"Why is “the operator eventually acknowledges the alarm” usually an expectation rather than a software requirement?","options":["It is assigned to an environment agent.","It is a data-store definition.","It cannot use temporal logic.","It is necessarily a softgoal."],"answer":[0],"explanation":"Software can issue or record an alarm, but cannot enforce a human response without the relevant environment responsibility and assumptions."},{"id":"kaos-3","lesson":"kaos","tier":3,"prompt":"When can KAOS refinement stop for a leaf goal?","options":["When a single responsible agent has the capabilities to monitor the relevant conditions and control the required result.","When every goal is assigned to the same human.","When its name is short.","When obstacles have been omitted."],"answer":[0],"explanation":"The stopping criterion is realizability by a capable individual agent, not merely a tidy diagram."},{"id":"formalizable-goals-0","lesson":"formalizable-goals","tier":0,"prompt":"Which two patterns primarily express eventual change?","options":["Include and Extend","Make and Break","Maintain and Avoid","Achieve and Cease"],"answer":[3],"explanation":"Achieve eventually makes a target true; Cease eventually makes it false. Maintain and Avoid constrain what holds throughout the relevant states."},{"id":"formalizable-goals-1","lesson":"formalizable-goals","tier":1,"prompt":"“Whenever a request is accepted, a response eventually occurs” best matches…","options":["Cease","Avoid","Achieve","Maintain"],"answer":[2],"explanation":"This is liveness: a desired outcome eventually occurs after a trigger."},{"id":"formalizable-goals-2","lesson":"formalizable-goals","tier":2,"prompt":"Which formula expresses “whenever a train is moving, its doors are closed”?","options":["□(Moving → ◇Closed)","□(Moving → Closed)","Moving → ¬Closed","◇(Moving ∧ Open)"],"answer":[1],"explanation":"□(Moving → Closed) constrains every relevant state. Allowing doors to close eventually would permit them to be open while moving."},{"id":"formalizable-goals-3","lesson":"formalizable-goals","tier":3,"prompt":"Why does □(Accepted → ◇Responded) fail to specify a 30-second response deadline?","options":["It forbids all responses.","It requires simultaneous responses.","It is a class relationship.","Unbounded eventually does not limit how long the response may take."],"answer":[3],"explanation":"Use a bounded temporal condition, such as □(Accepted → ◇≤30s Responded), with clearly defined timing and request-response matching."},{"id":"istar-0","lesson":"istar","tier":0,"prompt":"The Strategic Dependency model mainly represents…","options":["only code inheritance.","dependencies among intentional actors.","only hardware deployment.","the execution time of one loop."],"answer":[1],"explanation":"The SD model expresses goal, softgoal, resource and task dependencies among actors."},{"id":"istar-1","lesson":"istar","tier":1,"prompt":"Which is a standard i* dependency type?","options":["Generalization","Lexical","Mechanism","Resource"],"answer":[3],"explanation":"Resource is one of the four dependency types, along with goal, softgoal and task."},{"id":"istar-2","lesson":"istar","tier":2,"prompt":"Which model exposes an actor’s internal task decomposition and means–ends reasoning?","options":["Data dictionary","Strategic Dependency (SD)","Strategic Rationale (SR)","A-0 context diagram"],"answer":[2],"explanation":"SR looks inside actor boundaries to show intentional rationale, whereas SD emphasizes relationships among actors."},{"id":"istar-3","lesson":"istar","tier":3,"prompt":"Which comparison is best?","options":["KAOS cannot assign responsibilities.","KAOS emphasizes formal goal refinement; i* emphasizes intentional actors and organizational dependencies.","i* cannot express goals.","KAOS and i* differ only in their fonts."],"answer":[1],"explanation":"The approaches overlap, but their emphases differ. Both goals and agents matter to RE."},{"id":"nfr-basics-0","lesson":"nfr-basics","tier":0,"prompt":"What does the U in FURPS stand for?","options":["Uniqueness","Usability","Uniformity","Uncertainty"],"answer":[1],"explanation":"FURPS stands for Functionality, Usability, Reliability, Performance and Supportability."},{"id":"nfr-basics-1","lesson":"nfr-basics","tier":1,"prompt":"An authentication step improves security but slows login. This illustrates…","options":["a class instance.","independent quality goals.","a lexical-only domain.","an NFR conflict or tradeoff."],"answer":[3],"explanation":"Quality concerns interact. The same operationalization can support one and hurt another."},{"id":"nfr-basics-2","lesson":"nfr-basics","tier":2,"prompt":"Which statement about NFRs is most accurate?","options":["They should be considered only after functional design.","They can never be tested objectively.","They need clarification and can sometimes be expressed with measurable fit criteria.","They all have one definition valid for every stakeholder."],"answer":[2],"explanation":"Soft quality intentions are often vague, but quantitative requirements such as latency or availability targets can be checked under defined conditions."},{"id":"nfr-basics-3","lesson":"nfr-basics","tier":3,"prompt":"Stakeholders disagree about what “secure” means. What is a useful first step?","options":["Remove all security requirements.","Declare the term self-explanatory.","Choose a mechanism before discussing scope.","Clarify type, topic, viewpoint, priorities and criteria with them."],"answer":[3],"explanation":"The framework makes context and interdependencies explicit. A shared word does not imply shared meaning."},{"id":"nfr-measures-0","lesson":"nfr-measures","tier":0,"prompt":"Under the notes’ convention, availability is…","options":["MTTR / MTTF.","MTTF + MTTR.","MTTF / (MTTF + MTTR).","1 / MTTR."],"answer":[2],"explanation":"Availability is the long-run fraction of time up under this simple repair-cycle model. Multiply by 100 to express percent."},{"id":"nfr-measures-1","lesson":"nfr-measures","tier":1,"prompt":"If MTTF is 99 hours and MTTR is 1 hour, what is availability?","options":["100%","50%","1%","99%"],"answer":[3],"explanation":"99 / (99 + 1) = 0.99 = 99%."},{"id":"nfr-measures-2","lesson":"nfr-measures","tier":2,"prompt":"Which four dimensions are grouped under dependability in the notes?","options":["Input, control, output, mechanism","Speed, cost, novelty, market share","Availability, reliability, safety, security","Inception, elaboration, construction, transition"],"answer":[2],"explanation":"Dependability includes availability of service, reliable behavior, avoidance of catastrophic consequences and protection against intrusion."},{"id":"nfr-measures-3","lesson":"nfr-measures","tier":3,"prompt":"With 100 seeded bugs, 20 found seeded bugs and 40 found real bugs, the notes’ bebugging estimate of total real bugs is…","options":["8","200","2,000","60"],"answer":[1],"explanation":"Assuming equal detectability and representative seeding: 20/100 = 40/N, giving N = 200. It is an estimate dependent on those assumptions."},{"id":"sig-0","lesson":"sig","tier":0,"prompt":"SIG stands for…","options":["System Interface Grammar","Structured Input Grid","State Inheritance Guide","Softgoal Interdependency Graph"],"answer":[3],"explanation":"A SIG records quality softgoals, operationalizations, rationale and their interdependencies."},{"id":"sig-1","lesson":"sig","tier":1,"prompt":"Which contribution supplies partial positive support?","options":["Break (−−)","Make (++)","Help (+)","Hurt (−)"],"answer":[2],"explanation":"Help is positive but weaker than Make. Positive support alone should not be confused with sufficient evidence."},{"id":"sig-2","lesson":"sig","tier":2,"prompt":"Security is AND-refined into Integrity, Confidentiality and Availability. With two children satisficed and Availability denied, what follows in the decisive-label exercise?","options":["Security becomes an operationalizing softgoal.","Security is denied because a required child is denied.","The AND automatically changes to OR.","Security is satisficed because most children pass."],"answer":[1],"explanation":"AND requires every necessary child. A majority vote is not the rule."},{"id":"sig-3","lesson":"sig","tier":3,"prompt":"A target receives both decisive positive and decisive negative evidence. Which label distinguishes this from a lack of evidence?","options":["No topic","Conflicting","Always satisficed","Undetermined"],"answer":[1],"explanation":"Conflicting means supported and opposed. Undetermined indicates insufficient evidence, not the same evidential situation."},{"id":"nfr-templates-0","lesson":"nfr-templates","tier":0,"prompt":"Which Volere field makes a requirement checkable?","options":["Font style","Fit criterion","Page orientation","Filename"],"answer":[1],"explanation":"A fit criterion provides an acceptance measure or testable condition, accompanied by context and motivation."},{"id":"nfr-templates-1","lesson":"nfr-templates","tier":1,"prompt":"Why can copying one NFR into many use-case texts create problems?","options":["It makes quality goals independent.","Copies can diverge and obscure cross-cutting scope and traceability.","It makes the NFR automatically formal.","It removes every need for architecture."],"answer":[1],"explanation":"Organization and shared trace links help maintain one coherent quality requirement across multiple use cases."},{"id":"nfr-templates-2","lesson":"nfr-templates","tier":2,"prompt":"Which association point can express a quality requirement applying to the whole modeled system?","options":["The system boundary","Only an external actor’s name","Only an ERD key","Only a private method"],"answer":[0],"explanation":"The notes discuss Actor–NFR, association–NFR, Use case–NFR and System boundary–NFR attachment points."},{"id":"nfr-templates-3","lesson":"nfr-templates","tier":3,"prompt":"Which information supports a reasoned NFR decision? Select all that apply.","options":["Only the chosen solution’s name","Type, topic, agent and viewpoint","Priority and affected/affecting quality goals","Operationalizations and supporting claims"],"answer":[1,2,3],"explanation":"A reasoned choice requires context, dependencies, priorities and rationale. A solution name alone cannot explain the tradeoff."},{"id":"sysml-0","lesson":"sysml","tier":0,"prompt":"Which diagram type is highlighted as a SysML addition in the historical notes?","options":["Only flowchart","Only ERD","Only CRC card","Requirement diagram"],"answer":[3],"explanation":"The SysML 1.x appendix highlights requirement and parametric diagrams."},{"id":"sysml-1","lesson":"sysml","tier":1,"prompt":"A Block Definition Diagram primarily models…","options":["system structure using blocks and relationships.","the time remaining on an exam.","only stakeholder questionnaire scores.","only a method’s control flow."],"answer":[0],"explanation":"The historical appendix relates BDDs to class diagrams and IBDs to composite structure diagrams."},{"id":"sysml-2","lesson":"sysml","tier":2,"prompt":"Why does a systems modeling language include personnel and hardware as well as software?","options":["It guarantees all domain assumptions.","It prohibits software models.","It makes goals unnecessary.","Systems can involve interacting non-software elements."],"answer":[3],"explanation":"The scope of systems engineering includes hardware, software, people, procedures and other elements."},{"id":"sysml-3","lesson":"sysml","tier":3,"prompt":"What is the safest interpretation of the appendix’s “UML profile” description?","options":["It means SysML is only a database language.","It necessarily describes every future SysML version.","It describes the SysML 1.x material used in the notes.","It eliminates the need for a requirements model."],"answer":[2],"explanation":"Version-sensitive language is scoped to the historical course material rather than asserted for every later release."},{"id":"exam-signals-0","lesson":"exam-signals","tier":0,"prompt":"Which item is explicitly flagged in the uploaded exam notes?","options":["Give three effective applications of ethnomethodology","Normalize an operating system","Write a device driver","Derive a sorting algorithm"],"answer":[0],"explanation":"The guide records this elicitation question as an explicit flag."},{"id":"exam-signals-1","lesson":"exam-signals","tier":1,"prompt":"When the professor’s slide numbers differ from the handout, what should identify the intended material?","options":["Only the number on the file name","The order of quiz answers","The slide title, picture and example","The oldest date you can find"],"answer":[2],"explanation":"The notes warn that NFR numbering differs. Titles and examples are more reliable identifiers."},{"id":"exam-signals-2","lesson":"exam-signals","tier":2,"prompt":"In the supplied KAOS train figure, Resp links connect leaf goals to boxes such as Tracking System. What do those boxes denote?","options":["Unlabeled domain constants","Data dictionary fields","Decision-table rules","Responsible agents"],"answer":[3],"explanation":"The named Tracking System, OnBoard TrainController and other system boxes are agents responsible for leaf goals. The actual diagram is now included."},{"id":"exam-signals-3","lesson":"exam-signals","tier":3,"prompt":"Which written-answer strategy best fits the recorded SIG exercise?","options":["Name goals and topics, refine, operationalize, justify contributions and explain evaluation.","Replace the graph with a program listing.","Name one mechanism and stop.","Ignore negative interactions to simplify the graph."],"answer":[0],"explanation":"A complete answer needs the graph’s roles, refinement structure, contribution strengths and evaluation rationale."},{"id":"quick-recall-0","lesson":"quick-recall","tier":0,"prompt":"Which sequence gives ICOM positions?","options":["Input bottom, control right, output left, mechanism top","Input left, control top, output right, mechanism bottom","All four enter from the left","Input top, control left, output bottom, mechanism right"],"answer":[1],"explanation":"ICOM is read by arrow position, not by the order of words in a sentence."},{"id":"quick-recall-1","lesson":"quick-recall","tier":1,"prompt":"Which pairing is correct?","options":["Domain property → prescriptive wish","KAOS expectation → software agent","KAOS requirement → environment agent","KAOS expectation → environment agent"],"answer":[3],"explanation":"Requirements are software responsibilities; expectations are environment responsibilities. Domain properties describe the world."},{"id":"quick-recall-2","lesson":"quick-recall","tier":2,"prompt":"Which combination best recalls the core distinctions?","options":["RUP phase = one exclusive discipline","ERD = control flow; DFD = class operations","SIG = execution schedule; IDEF0 = inheritance","Use case = actor goals/interactions; class diagram = static structure; DFD = data movement"],"answer":[3],"explanation":"Choose the notation by the question: interaction, static structure and data movement are different concerns."},{"id":"quick-recall-3","lesson":"quick-recall","tier":3,"prompt":"Which claim is too strong?","options":["A password operationalization guarantees absolute security.","A requirement should trace back to a need or goal.","A formal eventuality needs a bound to express a deadline.","An AND-refinement needs all required children."],"answer":[0],"explanation":"The NFR notes warn against absolute security claims. Contributions and alternatives need justification and a defined context."},{"id":"gore-completeness-0","lesson":"gore-completeness","tier":0,"prompt":"Which symbol does the GORE completeness slide use for domain knowledge?","options":["K","R","P","Ac"],"answer":[0],"explanation":"K is the domain-knowledge set; it plays the role called D in much of the guide."},{"id":"gore-completeness-1","lesson":"gore-completeness","tier":1,"prompt":"Which is required in addition to proving S,K ⊢ R?","options":["A guarantee that requirements never change","A fixed programming language","A single use case for the whole project","A proof that S and K are consistent"],"answer":[3],"explanation":"The five criteria include validated R, validated K, a properly scoped S, sufficiency and consistency."},{"id":"gore-completeness-2","lesson":"gore-completeness","tier":2,"prompt":"What does P,C ⊢ S connect?","options":["Problem and customer to a softgoal cloud","Parent and child page numbers","Priority and claim to a topic","Program and machine description to specification"],"answer":[3],"explanation":"Execution of P on the machine described by C is used to establish S at the interface."},{"id":"gore-completeness-3","lesson":"gore-completeness","tier":3,"prompt":"Why is an entailment from inconsistent premises not an adequate requirements justification?","options":["It makes every interface label too long.","It removes the distinction between class and object.","It prevents all decompositions.","It does not establish a feasible, coherent world/specification combination."],"answer":[3],"explanation":"Consistency prevents a vacuous argument based on contradictory assumptions; it is an explicit completeness criterion."},{"id":"vending-trace-0","lesson":"vending-trace","tier":0,"prompt":"In the vending-machine example, customer_selection(Product) refines into…","options":["only a compiler option.","only a physical actuator.","two unrelated actors.","display_choices and get_customer_choice(Product)."],"answer":[3],"explanation":"The customer needs to see choices and communicate a choice, so both subgoals are needed."},{"id":"vending-trace-1","lesson":"vending-trace","tier":1,"prompt":"Two clauses, display_choices :- vertical_display and display_choices :- horizontal_display, express…","options":["a mechanism arrow","OR alternatives","AND requirements","an inconsistent data store"],"answer":[1],"explanation":"Separate rules with the same head provide alternative ways to achieve it."},{"id":"vending-trace-2","lesson":"vending-trace","tier":2,"prompt":"A design feature has no supporting requirement or goal link. What should be checked?","options":["Whether every actor has a password","Whether all glossary words are uppercase","Whether it is an unjustified or accidental design choice","Whether a DFD has a single timing clock"],"answer":[2],"explanation":"Backward tracing can reveal work without a requirements justification."},{"id":"vending-trace-3","lesson":"vending-trace","tier":3,"prompt":"What extra condition is needed if the toy sibling rule must exclude self-siblings?","options":["All siblings must use the same interface","X ≠ Y","X = Y","parent must mean a software class"],"answer":[1],"explanation":"Shared parenthood alone permits X and Y to be the same object in the simplified rule."},{"id":"kaos-train-0","lesson":"kaos-train","tier":0,"prompt":"WCS-Dist in the train example stands fo
