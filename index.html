s unambiguous but hard to understand; aim for the sweet spot between.</p>\n<h3>3.2 Clarity pitfalls &amp; consistency</h3>\n<ul>\n<li><b>shall / will / must / should</b> carry different criticality. “A or B” (inclusive vs exclusive or). “mostly A” → state the cases C1…Cn. “perhaps / could / may / might / by and large / often / frequently A” are vague. “A or ¬A” is a tautology formally but may mean something to users.</li>\n<li><b>Consistency in logic:</b> a set Φ of first-order formulas is consistent iff there is no φ such that Φ ⊢ φ and Φ ⊢ ¬φ. “A and ¬A” is formally false (maybe a typo). Inference examples: <b>modus ponens</b> (A→B, A ⊢ B); disjunctive syllogism (A∨B, ¬A ⊢ B). “Slow children at play” = a semantic ambiguity in a sign.</li>\n<li><b>Correctness / external consistency:</b> the Kansas railroad law (early 1890s): “When two trains approach each other at a crossing, both shall come to a full stop and neither shall start up again until the other has gone.” → deadlock; use scenario analysis and/or formalism to detect.</li>\n<li><b>Feature-interaction problems</b> (call forwarding example: A→B, B→C, C→B, D→A creates loops). Slide asks: how would you detect and deal with them?</li>\n</ul>\n<h3>3.3 Verifiability exercise</h3>\n<p>“Is each verifiable? Is there a better way to say it?” — “supports up to 1,000 simultaneous users” · “responds to an arbitrary query in 500 msec” · “the color shall be a pleasing shade of green” · “available 24×7” · “export view data in comma-separated format according to the IEEE specification”. Fix by adding measurable fit criteria (conditions, percentiles, test method).</p>\n<h3>3.4 Completeness</h3>\n<ul>\n<li>Sometimes <i>the</i> key issue and a hard problem → use elicitation techniques and <b>ontological primitives</b> (ontology = study of being/existence): goals, agents, decisions, rationale (goal-/agent-orientation); entities, activities, constraints (object-orientation); organizational primitives: classes/metaclasses, associations/aggregations, superclass/subclass, views.</li>\n<li>Three ontological levels: <b>meta-level, class-level, token (ground) level</b>.</li>\n<li><b>Overspecification</b>: algorithms (sorting, searching, routing, serialization, normalization) and data structures (stack, queue, tree, graph, heap) do not belong in requirements. <b>Technically unsolvable problems</b>: e.g., scheduling, pattern recognition. The “house-building letters” slide uses an exchange of letters about building a house to illustrate unrealistic or unsolvable requests.</li>\n<li>Completeness w.r.t. GORE: requirements are complete if sufficient to establish the goal they refine (Yue 1987) – see <a href=\"#gore\">Section 9</a>.</li>\n</ul>\n\n<h2 id=\"tech\">4. Elicitation techniques <span class=\"tag\">Elicitation deck</span></h2>\n<p>Agenda of the deck: critical issues → desirable properties → techniques: <b>ethnomethodology, domain analysis, problem frames, data/information elicitation techniques</b> (sampling, questionnaires, interviewing, group meetings, ethnomethodology, scenarios).</p>\n<h3 id=\"ethno\">4.1 Ethnomethodology (“people’s methods”)</h3>\n<ul>\n<li><b>Why it is hard – the “say-do” problem:</b> people know how to do things they normally don’t describe (<i>tacit knowledge</i>), and their descriptions may be highly inaccurate; experts may not want to tell.</li>\n<li><b>Remedy: observe in a natural setting</b> (esp. where social order is accomplished moment-to-moment), e.g., a stock brokerage (many phone calls, computers) or HCI studies.</li>\n<li><b>Cycle:</b> plan ahead (as for interviews) → observe/record → analyze.</li>\n<li><b>Issues:</b> ethical/legal implications (e.g., video-taping without notification); not natural if people know they are observed (aim for maximal naturalness, minimal interruption); analysis of recordings is time-consuming → gradually identify critical tasks and focus.</li>\n</ul>\n<h3 id=\"ka\">4.2 Knowledge acquisition (KA) – a relative of elicitation</h3>\n<ul>\n<li>From AI; intended for acquiring expertise (doctors, lawyers) by a <b>knowledge engineer</b>. Requirements elicitation = capturing domain “knowledge”.</li>\n<li><b>Mediating representations</b> bridge the gap between the structure of expert knowledge and formal computer representations: text, notes, diagrams, charts, tables, frames, rules, semantic nets.</li>\n<li><b>Automatic KA techniques:</b> infer new knowledge from past experience (worksFor(bill,john), worksFor(maria,john), worksFor(george,john) ⇒ ∀x worksFor(x,john); “For whom does Susan work?”); suggest refinements (∀x,y x≠y → worksFor(x,y)); detect inconsistencies (∀x worksFor(x,john) vs worksFor(eve,maria)).</li>\n<li><b>Issues:</b> novice vs expert knowledge differ (different types of customers); experts may not want to tell (say-do problem); experience doesn’t always translate into rules → the analyst moves informal → formal.</li>\n</ul>\n<h3 id=\"data\">4.3 Data/information elicitation techniques</h3>\n<h4>Sampling</h4>\n<p>Systematically selecting representative elements of a population – often documents (“hard” data like transaction logs). Minimizes cost/overhead; no direct customer involvement. Tasks:</p>\n<ul><li><b>Data determination</b> – what to collect. ATM example: time per transaction (→ number of machines, response time), errors before completion (→ UI, robustness, help), correlation of amount and time (→ max amount, accuracy), peak periods and inter-transaction interval (→ performance), success/failure ratios (→ bad transaction types, time of day/week).</li>\n<li><b>Population</b> – e.g., transactions in 4 local branches for 1 week.</li>\n<li><b>Type determination</b> – <b>purposive</b> sampling (analyst picks important elements, ignoring statistics, e.g., only high-amount/frequent transactions) vs <b>random</b> sampling (every <i>k</i>th element).</li>\n<li><b>Sample size</b> – e.g., 1/10 of all transactions in 4 branches for 1 week; bigger = higher cost but higher confidence.</li></ul>\n<h4>Questionnaires</h4>\n<ul><li>Seek <b>attitudes, beliefs, behavior</b> – not normally found via sampling or interviews. If not anonymous, customers may be reluctant to answer.</li>\n<li><b>Avoid open questions</b> (hard to correlate/interpret) – e.g., “Do you think a new meeting scheduler will succeed?” is bad; closed Y/N or 1–5 scales are good (“Have you used a meeting scheduler before? Y/N; if yes, are you satisfied 1–5; if no, would you try one? Y/N; how much time would you spend per session?”).</li>\n<li><b>Keep short</b>; use a simple <b>scoring scheme</b> (e.g., 1–5); <b>group inter-related questions</b> (Q1–3 = satisfaction with current systems; Q4–7 = willingness to try a new one).</li></ul>\n<h4>Interviewing</h4>\n<ul><li>Elicits tacit knowledge as well as hard facts, opinions, feelings, goals. <b>Do</b>: plan ahead; learn from experienced journalists. <b>Don’t</b>: use buzzwords/acronyms to impress; unusual body language/tone. Problems: people can’t always articulate needs; they may be reluctant to reveal thoughts.</li>\n<li><b>Process:</b> read background material → establish objectives → decide whom to interview (busy; likely/important customers) → prepare (call ahead; tell purpose, duration, possibly questions) → decide structure &amp; question types (write down questions and answer them ahead of time) → hold the interview → review notes → disseminate → record differences and resolve them.</li></ul>\n<h4>Group meetings</h4>\n<ul><li><b>Focus groups:</b> group interviews, often with “stimulus material” (videos, stories); success depends on participants and moderator.</li>\n<li><b>JAD family:</b> <b>JRP</b> (Joint Requirements Planning – high-level managers; business goals, problems, critical success factors, strategic opportunities) and <b>JAD</b> (Joint Application Design/Development – end users’ needs).</li>\n<li><b>Four tenets of JAD:</b> (1) <b>group dynamics</b> (participants: developers, users/customers; leader/moderator/facilitator; recorder/scribe), (2) <b>visual aids</b> (calendars, participants, equipment, locations), (3) <b>organized, rational process</b> (periodic, democratic, conflict-accommodating), (4) <b>WYSIWIG documentation</b>.</li></ul>\n<h3 id=\"domain\">4.4 Domain analysis &amp; FODA</h3>\n<ul>\n<li><b>Domain analysis</b> supports <b>reuse of generic domain modelling patterns</b> → big reduction in elicitation, specification and validation effort. Identify commonalities among similar applications, store requirements in a repository, pick similar ones and tailor. Example: a “resource-allocation” meta-domain model has instances: airline reservation, hotel reservation, car rental, class registration.</li>\n<li><b>FODA (Feature-Oriented Domain Analysis)</b> [CMU/SEI-90-TR-21] – three phases: <b>Context analysis</b> (extent/bounds of the domain), <b>Domain modeling</b> (problem space description; see Enterprise Modeling), <b>Architecture modeling</b> (software architectures implementing domain solutions; now part of domain design in domain engineering).</li>\n<li>Context-analysis products: <b>Structure diagram</b> = informal block diagram placing the domain relative to higher-, lower- and peer-level domains; <b>Context diagram</b> = a data-flow diagram showing flows between a generalized application in the domain and the entities it communicates with (slide: Movement Control context diagram with Commander Guidance, Movement Estimate, Position Reports…).</li>\n</ul>\n\n\n<h2 id=\"meta\">4b. Ontology, classes/instances &amp; metamodels <span class=\"tag\">M05_Metamodel deck</span></h2>\n<p>Your notes flag Metamodel <b>slides 3–5</b>.</p>\n<h3>Slides 3–4: instances and classes</h3>\n<ul><li><b>Instances</b> = tokens, specific things (John; a specific course such as “2014-csb5361”). <b>Classes</b> = collections of instances (Person, Course).</li>\n<li>The Person–Course relationship exists at the class level and again at the instance level (John ↔ the specific course). Slide 4 repeats the figure with a “Why?” callout – check your notes for what the professor asked.</li></ul>\n<h3>Slides 5–7: models and metamodels</h3>\n<ul><li><b>Specific models</b>: tokens, specific things and relationships. <b>Generic models</b>: collections of instances, and relationships. <b>Metamodels</b>: ontology (and epistemology) of generic models.</li>\n<li>The figure puts <b>Entity</b> (slide 6: <b>Activity</b>) above Person and Course: John is an instance of Person; Person is an instance of the metaclass Entity. This is the same token / class / meta ladder as the “ontology levels” in Elicitation (§3.4).</li></ul>\n<h3>What is meta-modeling?</h3>\n<ul><li>In CS: construction of a collection of “concepts” (things, terms…) within a domain. A <b>model</b> is an abstraction of phenomena in the real world; a <b>metamodel</b> is yet another abstraction, highlighting properties of the model itself. A model should <b>conform to its metamodel</b>, like a program conforms to the grammar of its language.</li>\n<li>“A valid metamodel is an ontology, but not all ontology are modeled explicitly as metamodels” [Söderström 2002].</li>\n<li>A metamodel defines concepts and relationships (as a class diagram). It defines <b>structure only – no semantics</b>. A model is an <b>instance</b> of a metamodel if it respects the structure the metamodel defines. The UML metamodel defines the structure all UML models must have.</li></ul>\n<h3>Four-layer hierarchy</h3>\n<table><tr><th>Layer</th><th>Name</th><th>Examples</th></tr>\n<tr><td><b>M3</b></td><td>MOF (meta-metamodel; <b>self-defined</b>) – MetaClass, MetaAttribute, MetaAssociation</td><td>“Class” in MOF</td></tr>\n<tr><td><b>M2</b></td><td>UML metamodel</td><td>Class, Attribute, Operation, Association, Component, Use Case, Actor</td></tr>\n<tr><td><b>M1</b></td><td>User model</td><td>Video (+title: String), Customer (id), CustomerOrder (item, quantity), BankSystem (Account, Customer…)</td></tr>\n<tr><td><b>M0</b></td><td>Run-time instances / objects</td><td>aVideo, “: Video title = 2001: A Space Odyssey”, Ben &amp; Jerry’s, orders for sawdust (2 tons) and lard (5 tons)</td></tr></table>\n<ul><li><b>M(n+1) defines the structure of M(n)</b>; M(n+1) is <b>not</b> an abstraction of M(n). Meta-layer relationships resemble grammar-layer relationships (BNF, XML Schema).</li>\n<li>“Points to ponder”: to create a new UML version, MetaClass/MetaAttribute/MetaOperation are M3, Class/Attribute/Operation/Component are M2, StockShare/owner/askPrice are M1, specific data (hacsSoftwareCoShare99, smartie, 11.18) is M0. The MOF layer also contrasts MOF/OO paradigm, RUP (USPM) metamodel and process models.</li>\n<li><b>UML metamodel elements:</b> Element → ModelElement; Classifier (Class, Interface, DataType, Component, Subsystem, Node); Feature (StructuralFeature = Attribute; BehaviouralFeature = Operation/Method); Relationship (Association, Generalization); AssociationEnd (isNavigable, aggregation, multiplicity); AssociationClass; Namespace/Package/Model. Slide “Mapping UML models to metamodel elements” maps BankSystem (package), Customer/Account (classes), association with multiplicity 1..2 and *, attributes, methods withdraw/deposit, and Saving/Chequing/CreditCard specializing Account (generalization).</li>\n<li><b>OCL:</b> defines the structure of models expressing constraints – invariants, pre/post conditions (e.g., <code>context BankAccount inv: balance &gt; -1000</code>); a metamodel instance of MOF; tightly coupled with UML; semantics defined with models; has a concrete syntax. A well-formedness OCL constraint example: a non-abstract class must implement all its operations.</li>\n<li><b>Other slides (skim):</b> infrastructure (Classifier, Namespace, PackageableElement, RedefinableElement, Feature); behavior harmonization (Behavior: Action, Activity, Interaction, StateMachine); component paradigm (Port, Part, Connector); <b>action semantics</b> (structure of action sequences, no concrete syntax); templates (UML→EJB model transformation); subsystems and collaborations (roles); <b>models &amp; traceability</b> (Analysis and Design models linked by &lt;&lt;trace&gt;&gt;); stereotype notation (guillemets, icon, iconified form).</li></ul>\n<div class=\"box\"><b>Likely free-response:</b> define instance / class / metaclass with Person–John–Course; define a metamodel and say structure-only; name the four layers with an example each; say which layer changes when you add a UML construct (M2) versus a class in your model (M1).</div>\n\n<h2 id=\"pf\">5. Problem Frames <span class=\"tag\">Elicitation deck (Jackson/Kovitz; Herbsleb notes)</span></h2>\n<div class=\"def\"><b>Key idea:</b> recurring problem types. Standing back from details, your problem may match a known type that already has a known solution approach. A <b>problem frame</b> represents a well-known type of software problem. Expertise ≈ ~50,000 chunks of knowledge (~10 years to become expert); experts <i>recognize</i> rather than derive; insight is often recognition.</div>\n<h3>5.1 Steps</h3>\n<ol><li>Break the context into pieces (<b>domains</b>).</li><li>Identify the <b>shared phenomena</b> (<b>interfaces</b>) among domains.</li><li>Draw a <b>context diagram</b>.</li><li>Add the conditions the software must bring about = <b>requirements</b> → <b>problem diagram</b>. A problem diagram that recurs a lot = <b>problem frame</b>.</li></ol>\n<h3>5.2 Notation &amp; domain/phenomena types</h3>\n<table><tr><th>Item</th><th>Meaning</th></tr>\n<tr><td>Machine domain (double stripe)</td><td>The system to be built; always <b>causal</b></td></tr>\n<tr><td>Designed domain (single stripe)</td><td>Usually <b>lexical</b> (e.g., databases)</td></tr>\n<tr><td><b>Causal (C)</b></td><td>Predictable relationships among physical phenomena</td></tr>\n<tr><td><b>Biddable (B)</b></td><td>Physical but unpredictable – humans are the most common</td></tr>\n<tr><td><b>Lexical (X)</b></td><td>Physical representation of data / symbolic phenomena</td></tr>\n<tr><td>Causal phenomena (C/E)</td><td>Events one domain initiates to influence another (what happens): DrawLine(x1,y1,x2,y2) on LCD; MakeElectricalPulse(voltage) in pacemakers; FireThruster(duration); InsertRow() in Excel; ClickHyperlink(url) by humans</td></tr>\n<tr><td>Symbolic phenomena (Y)</td><td>Values, truths, states – encodings of other phenomena: ListOfParagraphs() in Word; GridOfCells() in spreadsheets; LevelOfEncryption() in a bank database</td></tr>\n<tr><td>Solid line</td><td>Interface (shared phenomena)</td></tr>\n<tr><td>Dashed line with arrow</td><td>Requirement <b>constrains</b> a domain’s phenomena</td></tr>\n<tr><td>Dashed line (no arrow)</td><td>Requirement merely <b>references</b> a domain’s phenomena</td></tr></table>\n<div class=\"ex\"><b>Sample problem diagram – editing a “periods &amp; ranges” database:</b> machine = PREdit (system); domains: <i>Periods &amp; ranges</i> (X, lexical) and <i>Medical staff</i> (B, biddable); requirement “Data entry”; interfaces m, n, o. Notes on slide: all machine domains are causal; databases are lexical; the act of giving inputs to the machine is causal; sending SQL to the database is causal, the values are symbolic.</div>\n<h3>5.3 The five basic frames</h3>\n<table><tr><th>Frame</th><th>Purpose</th><th>Parts</th></tr>\n<tr><td><b>Required behavior</b></td><td>Control part of the physical world to satisfy a condition</td><td>Control machine (CM), controlled domain (CD, causal), required behavior</td></tr>\n<tr><td><b>Commanded behavior</b></td><td>Control part of the physical world according to operator instructions</td><td>Operator (B) issues commands; machine; controlled domain</td></tr>\n<tr><td><b>Information display</b></td><td>Obtain state/behavior info from the physical world and present it as required</td><td>Information machine, real world, display device</td></tr>\n<tr><td><b>Simple workpieces</b></td><td>Build a tool to create &amp; edit persistent information objects</td><td>Editing tool, work pieces, command effects, user</td></tr>\n<tr><td><b>Transformation</b></td><td>Transform information inputs to required outputs</td><td>Transformation machine, input, output, I/O relation</td></tr></table>\n<p>Kovitz (pp. 74–75) also names <i>information, control, transformation, workpiece, connection</i> problem types.</p>\n<h3>5.4 Anti-requirements / abuse frames / security requirements</h3>\n<p>(Lin, Nuseibeh, Ince, Jackson, Moffett – RE 2003.) A <b>threat</b> is described with a generic <b>abuse frame</b>: asset under attack, vulnerabilities, victim domain, <b>malicious user</b> (agent), anti-requirement (AR). A <b>security requirement</b> is then expressed in problem frames with a protected domain, assets, security measures, SR.</p>\n\n<h3 id=\"las\">5.5 London Ambulance Service (problem-frames version)</h3>\n<div class=\"ex\"><b>News headline (20 Oct 1992):</b> “Ambulance chief quits after patients die in computer crash” – chief executive resigned over allegations that up to 20 people may have died due to the collapse of a new computer system for emergency calls; Health Secretary Virginia Bottomley forced an inquiry into the 36 hours (Mon–Tue) with ambulance delays of up to three hours.</div>\n<ul>\n<li><b>Manual system problems:</b> locating incident precisely is slow (incomplete caller info, map books); paper forms move around the Control Room inefficiently; vehicle status/location depends on allocators’ intuition and radio reports; voice communication is slow (mobilization queues at peaks); duplicate calls rely on human memory; call-backs are labor-intensive; special incidents (Rapid Response Unit/helicopter) rely entirely on human judgment.</li>\n<li><b>Critical requirements:</b> functional – calls report incidents/needs for transport; an ambulance arrives promptly; may take patient to hospital. Other – timely response without communication overload; resilience to faulty communication; resilience to independent field decisions; incremental info about an incident; efficient use of resources. System considerations – incremental deployment; fit with existing processes.</li>\n<li><b>First-cut context (commanded behavior):</b> Ambulance Dispatch Machine ↔ Calls (a: 911 call), Resources (b: dispatch message), requirement “ambulance arrives promptly…”, c: requests. <b>But</b> calls ≠ incidents and dispatch needs geography → add <b>Incidents</b> (d: create/update/close) and <b>Real-World Geography</b> (e: geographic facts).</li>\n<li><b>Decomposition:</b> <b>Call Taking</b> (workpiece frame: prioritize calls, establish location, combine multiple calls; “Incidents reflect info in calls”); <b>Geography model</b> (model domain: “Geog is OK”); <b>Ambulance Dispatch</b> (commanded behavior using Incidents and Resources). Combined diagram: Calls – Call Taking (a) – Incidents (d) – Dispatch – Resources (b), with Geography Model (e).</li>\n<li class=\"box\"><b>Gotcha:</b> <i>Incidents</i> is <b>lexical</b> in Call Taking but <b>biddable</b> in Dispatch – the same domain can play different types in different subproblems.</li></ul>\n\n<h2 id=\"scen\">6. Scenario analysis &amp; use cases <span class=\"tag\">Scenario-Analysis deck</span></h2>\n<p>Outline: from scenarios to use cases · scientific cycle of inquiry · London Ambulance Dispatch · goals and scenarios · misuse cases. Quotes: Einstein – “Example isn’t another way to teach, it is the only way to teach”; Schweitzer – “Example is not the main thing in influencing others, it is the only thing.”</p>\n<h3>6.1 What is a scenario?</h3>\n<ul><li>A synthetic description of an event or series of actions/events; in SE/HCI, how users interact with the system to achieve tasks (representative instances); in collaborative computing, how users interact <i>with one another</i> using hardware/software.</li>\n<li><b>Uses:</b> clarify domain properties; uncover missing (functional) requirements; evaluate and validate design alternatives; ensure testing adequacy.</li>\n<li><b>Types</b> (Brugge): <b>As-is</b> (current situation; re-engineering), <b>Visionary</b> (future system; greenfield &amp; re-engineering; can’t be done by user or developer alone – slide uses “before/after haircut” pictures), <b>Evaluation</b> (user tasks against which the system is evaluated), <b>Training</b> (step-by-step guidance for a novice).</li>\n<li><b>Finding scenarios:</b> don’t expect the client to be verbal if the system doesn’t exist; don’t wait for information even if it does; use a <b>dialectic approach</b> (you help the client formulate requirements; the client helps you understand them; requirements evolve as scenarios develop). Ask: primary tasks? what data will actors create/store/change/remove/add? what external changes must the system know about? what events must actors be informed about? Don’t rely on questionnaires alone; insist on task observation; talk to the end user, not just the contractor; expect resistance.</li></ul>\n<div class=\"ex\"><b>Accident Management (FRIEND) example:</b> “Cat in a tree”, “Warehouse on fire”, no police car available, police car has an accident en route, cat in tree becomes “Grandma fell from ladder”, simultaneous incident reports. <b>Concrete scenario – Warehouse on Fire:</b> Bob (patrol car) sees smoke; partner Alice reports from her car (address, location, emergency level; requests fire unit + paramedics); dispatcher John is alerted by a beep, reviews, acknowledges, allocates a fire unit and two paramedic units and sends ETA to Alice. Observations: it is <b>concrete</b> (a single instance, not all situations); <b>participating actors</b> = Bob, Alice, John.</div>\n<h3 id=\"uc\">6.2 Use cases</h3>\n<div class=\"def\"><b>Use case</b> = a specific flow of events through the system, seen as a <b>black box</b>. Template fields: <b>Name · Actors · Entry condition</b> (“This use case starts when…”) · <b>Flow of events</b> (free-form natural language) · <b>Exit condition</b> · <b>Exceptions</b> · <b>Special requirements</b> (NFRs, constraints).</div>\n<div class=\"ex\"><b>ReportEmergency:</b> actors FieldOfficer (Bob, Alice) and Dispatcher (John). Exceptions: FieldOfficer notified immediately if connection to central lost; Dispatcher notified if any logged-in FieldOfficer’s connection is lost. Special requirement: report acknowledged within 30 s; selected response arrives within 30 s of dispatch. Flow: FieldOfficer activates “Report Emergency” → FRIEND presents a form → officer fills emergency level, type, location, description, possible responses → submits → Dispatcher notified → Dispatcher invokes <b>OpenIncident</b>, selects response, acknowledges → FieldOfficer receives acknowledgment and response. Use-case model for Incident Management: actors Dispatcher, FieldOfficer; use cases OpenIncident, ReportEmergency, AllocateResources.</div>\n<table><tr><th>Association</th><th>Use</th><th>Slide example</th></tr>\n<tr><td><b>&lt;&lt;include&gt;&gt;</b></td><td>(a) <i>functional decomposition</i> of a too-complex function; (b) <i>reuse</i> of existing behavior – A delegates to B; the base case isn’t complete without the supplier</td><td>ManageIncident includes CreateIncident, HandleIncident, CloseIncident; OpenIncident includes ViewMap; AllocateResources</td></tr>\n<tr><td><b>&lt;&lt;extend&gt;&gt;</b></td><td>Optional extension; base use case is complete and runs without the extension</td><td>ReportEmergency extended by Help (when the user needs help)</td></tr>\n<tr><td><b>Generalization</b></td><td>Factor out common behavior; children inherit and add/override</td><td>ValidateUser (parent) → CheckPassword, CheckFingerprint</td></tr></table>\n<div class=\"box\"><b>include vs extend:</b> include = base <i>needs</i> the supplier; extend = base is <i>complete by itself</i>; the extension adds behavior under a condition. The arrow for extend points <i>to the base</i> use case; for include it points <i>to the included</i> one.</div>\n<h3>6.3 Other scenario forms (Potts et al., “Inquiry-based requirements analysis”)</h3>\n<ul><li><b>Use cases/paths</b> – short informal descriptions (restaurant example: Guest enters, coat/cloakroom, table/menu, order, kitchen prepares from basic ingredients, served, pays, fetches coat, leaves – steps A–G).</li>\n<li><b>Episodes</b> – tabular/diagrammatic; sequences of detailed user–system interaction; clusters of related events. Meeting-scheduler episodes: <b>1 Initiation</b> (initiator determines important/active/other participants, asks for location prefs, equipment reqs, exclusion and preference sets, date range) → <b>2 Responding</b> → <b>3 Scheduling</b> (choose time/location) → <b>4 Reserving &amp; Notification</b>.</li>\n<li><b>Scripts</b> – action tables/diagrams (a “high-level script”).</li>\n<li><b>Task scenarios (usability/HCI)</b> – a sequence of system–user interactions, main basis for defect detection. Example 1: user goal “see if context switching is flexible between searching and buying”. Example 2: “sign on to the web store”, intermediary situation: user enters ID but no password.</li>\n<li><b>CRC cards</b> (Class–Responsibility–Collaborator): analysis classes have responsibilities (attributes+operations) and collaborators (classes needed to fulfill a responsibility). Slide: FloorPlan – defines floor plan name/type; manages positioning; scales for display; incorporates walls, doors, windows (collaborator Wall); shows camera positions (collaborator Camera).</li></ul>\n<h3 id=\"qtypes\">6.4 Exploring scenarios: question types, completeness &amp; pruning</h3>\n<ul><li>“Scenarios help define the system, but there are potentially infinitely many, so any set is necessarily incomplete; yet scenario quality correlates with system quality.” Success depends on <b>how well questions are posed</b>; categorize question types; pose them systematically (also bottom-up). Answers lead to scenario refinement, requirement refinement, discovery of missing requirements.</li></ul>\n<table><tr><th>Type</th><th>Meeting-scheduler example</th><th>Ambulance example</th></tr>\n<tr><td><b>What-if</b> (what could go wrong)</td><td>Consistent preferred dates / inconsistent preferred &amp; exclusion sets / slow responder / no response</td><td>What if no ambulance is available? (nearby one takes another patient; re-allocate from less critical incident)</td></tr>\n<tr><td><b>Who</b></td><td>Who initiates? person / person + scheduler / scheduler</td><td>Who dispatches? dispatcher / call-taker / software agent; who is notified? 911, emergency contact, fire dept, hospital, MD</td></tr>\n<tr><td><b>What-kind-of</b></td><td>One-shot vs periodic meeting</td><td>Basic emergency kit vs mobile hospital with qualified crew</td></tr>\n<tr><td><b>When</b></td><td>Non-responder: “drop-dead date”</td><td>When is the emergency contact notified? immediately / at 911 / at ambulance…</td></tr>\n<tr><td><b>How-to</b></td><td>How do participants resolve conflicts?</td><td>Obtain patient info (observation, RFID); locate patient (caller, GPS, distributed indicator); transfer info (verbal, push-button device, semi-automatic)</td></tr>\n<tr><td><b>Why</b></td><td>…</td><td>…</td></tr></table>\n<ul><li><b>Tree-based analysis</b> gives potentially endless chains of Q&amp;A. <b>Prioritize</b> scenarios (critical – benefits, costs, risks; high-frequency). <b>Prune</b> into three mutually exclusive sets: <b>discarded, selected, undecided</b>. Explore breadth-first or depth-first by priority.</li>\n<li>Scenario Analysis fits the reference model: <code>W,S ⊨ R</code>, <code>R,D ⊨ G</code>; As-Is → To-Be<sub>1…n</sub>; “UbiCom for humans through collaboration” (Dispatcher dispatches Ambulance driver: collaborative system, cooperative collaborators, task, artefact).</li></ul>\n<h3 id=\"las2\">6.5 London Ambulance (scenario version)</h3>\n<ul><li>CAD system deployed <b>October 1992</b>. Business goal – new regulation: ambulance arrives within <b>14 minutes</b> = <b>dispatched within 3 min</b> of the call + <b>on scene within 11 min</b>. Function: automate tracking and dispatching.</li>\n<li><b>Successful scenario</b>: caller → call taker → incident info processed → dispatch closest ambulance (at station or away) → crew mobilized; location/status reported back.</li>\n<li><b>Mishap scenario (Nasima Begum):</b> liver condition; 4 emergency calls; the only available ambulance sent to a non-emergency call; died after waiting 53 min though she lived 2 blocks from the hospital (slide notes sources disagree whether this was 1992 or after reverting to manual dispatch in June 1994).</li>\n<li><b>What was the problem?</b> People died waiting (11-year-old girl – kidney condition – 53 min; man – heart attack – 2 h); multiple ambulances sent to one incident; lost track of ambulance status (operators called callers back); workshop conclusion: <b>NFRs were not considered early</b> in development, plus organizational/SE mistakes.</li></ul>\n<h3>6.6 Goals &amp; scenarios (appendix)</h3>\n<p>Rolland, Souveyet, Ben Achour (IEEE TSE 1998), “Guiding goal modeling using scenarios”: <b>requirements chunks (RC)</b> couple a goal structure with a scenario structure. Goal sentences have a verb + parameters, e.g., ‘Take (the receipt)<sub>Obj</sub> (from the printer)<sub>Source</sub>’, ‘Display (error message)<sub>Obj</sub> (to the customer)<sub>Dest</sub>’, ‘Improve (our services)<sub>Obj</sub> (by providing cash … with a card-based ATM)<sub>Manner/Means</sub>’. Slides show an RC hierarchy, contextual chunks discovered from RC1, and system-internal chunks from RC1.1.</p>\n<h3 id=\"misuse\">6.7 Misuse cases &amp; anti-goals</h3>\n<ul><li><b>Misuse cases</b> [Sindre &amp; Opdahl 2000] elicit security requirements; compromised use-case properties: <b>P1</b> system boundary identifies scope of the subject; <b>P2</b> use case describes system actions or actor–system interactions; <b>P3</b> black-box perspective; <b>P4</b> communicate association between actor and use case. (Examples incl. Alexander, RE 2002 trade-off analysis.)</li>\n<li><b>Anti-goals</b> [Supakkul &amp; Chung; van Lamsweerde ICSE 2004] represent any undesirable effect, not limited to system actions.</li></ul>\n<div class=\"ex\"><b>Car-theft walk-through (7 steps):</b> (1) “Steal car” = <i>anti-goal</i>; (2) NFR softgoal “Secured possession of car” and anti-softgoal “Steal car” linked by <b>threatens</b>; (3) refine topic [car, possession] → [while driving] / [while parking], mark parking with <b>!</b> (more critical); (4) re-attach anti-goal to secured-while-parking; (5) refine theft technique → <b>short circuit</b> / <b>tow</b>, “!” on short circuit; (6) operationalize mitigation: <b>door lock, steering-wheel lock, transmission lock</b> (door lock and transmission lock provided by the car); (7) map transmission lock to a use case extending the new <b>Park car</b> use case. Agents: Car Thief, Driver.</div>\n\n<h2 id=\"em\">7. Enterprise &amp; business modeling (UML) <span class=\"tag\">Enterprise-Modeling deck</span></h2>\n<p>Outline: Why (goal-oriented EM in elicitation) · agent-oriented EM · business modeling using UML · conventional techniques (SADT, IDEF, ERD) · appendices (Unified Process view, SysML). “When the only tool you have is a hammer, every problem looks like a nail.” <b>World knowledge is essential</b> – the most error-prone part of requirements; most problems trace to erroneous environment assumptions (TCAS transponder assumptions, NY subway separation, Patriot missile clock drift).</p>\n<h3>7.1 Why business modeling?</h3>\n<p>A business is an enterprise too; business complexity requires understanding its structure/dynamics and a common understanding. It answers: what do workers do before using our system? what business value does it bring? what business process does the system support? what business information does it maintain? how do we know we found <i>all</i> and the <i>right</i> use cases? Open question on slides: differences between Enterprise, Business and System modeling (<code>S achieves R to solve P in D</code>).</p>\n<h3>7.2 RUP artifacts &amp; the Vision document</h3>\n<table><tr><th>Artifact</th><th>Answers</th></tr><tr><td><b>Vision</b></td><td>Where is the problem defined? Stakeholders/users? Environments/platforms?</td></tr><tr><td><b>Supplementary Specification</b></td><td>Non-functional requirements</td></tr><tr><td><b>Use Case Specs</b></td><td>Use cases</td></tr><tr><td><b>Glossary</b></td><td>Common terminology</td></tr><tr><td><b>Stakeholder Requests</b></td><td>Stakeholder needs/requests</td></tr></table>\n<p><b>Vision document</b>: communicates between management, marketing and the project team; provides initial customer feedback; fosters general understanding; sets scope and priority of high-level requests and features; system-level “what and why”; gets “all parties working from the same book”.</p>\n<p><b>Vision outline:</b> 1 Introduction · 2 Positioning · 3 Stakeholder and User Descriptions · 4 Product Overview · 5 Product Features · 6 Constraints · 7 Quality Ranges · 8 Precedence and Priority · 9 Other Product Requirements · 10 Documentation Requirements · 11 Appendix 1 – Feature Attributes.</p>\n<div class=\"def\"><b>Problem statement template:</b> The problem of <i>(describe the problem)</i> affects <i>(stakeholders affected)</i>, the impact of which is <i>(impact)</i>. A successful solution would <i>(key business benefits)</i>.</div>\n<h3>7.3 Business modeling steps (UML/RUP)</h3>\n<ol><li><b>Find business actors</b> – any individual, group, organization, company or machine that interacts with the business: customers, partners, suppliers, authorities (legal/regulatory), subsidiaries, owners/investors, outside information systems, other parts of the company. Name by <i>role</i>; define responsibility and why it interacts.</li>\n<li><b>Find business use cases</b> – value each actor gets (start with customers: services received, customer life-cycle, first contact, stages); supporting processes (staff, IT, office, security, legal); management processes (info to owners/investors, long-term budget goals, prioritize between use cases, create new processes, monitor processes).</li>\n<li><b>Describe interactions</b> with <i>communicates</i> associations (add navigability to show who initiates). <b>Prioritize</b> business use cases.</li>\n<li><b>Outline workflow</b> step by step (example “Individual Check-in”: passenger queues → gives ticket → agent validates ticket → registers baggage → reserves seat → boarding card printed and handed over → passenger leaves).</li>\n<li><b>Package</b> actors/use cases; present in use-case diagrams; write a <b>survey description</b> (purpose, typical sequences, parts not included); <b>evaluate</b> (all necessary identified, unnecessary identified, behavior in right order, workflows complete, survey makes it understandable).</li></ol>\n<p><b>Domain model</b> (one notion): an “incomplete” business object model – subset focusing on products, deliverables, events important to the domain, <i>without</i> responsibilities people carry.</p>\n<h3>7.4 Which UML diagram shows what?</h3>\n<table><tr><th>Diagram</th><th>View of the business</th></tr>\n<tr><td>Use case</td><td>Business context</td></tr><tr><td>Activity</td><td>Behaviors/workflows: what happens, what can be parallel, alternative paths; essentially a flowchart of control flow; may carry &lt;&lt;precondition&gt;&gt;/&lt;&lt;postcondition&gt;&gt; Boolean constraints. Elements: activity/action, transition, decision, guard condition, fork/join <i>synchronization bars</i>, swimlanes (e.g., Customer Sales Interface / Proposal Owner / Quote Owner)</td></tr>\n<tr><td>Class</td><td>Static structure: business workers and entities (e.g., Check-in Agent knows a Baggage Tag, Baggage Coordinator does not); org charts</td></tr>\n<tr><td>Sequence / collaboration</td><td>Dynamic interactions between workers and the things they manipulate; <i>realize</i> the behaviors in activity diagrams</td></tr>\n<tr><td>State-transition, deployment, object, …</td><td>Lifecycles (e.g., seminar lifecycle), physical allocation, snapshots</td></tr></table>\n<div class=\"ex\"><b>Registration practice problem (UTD):</b> Registrar sets up the curriculum; a course has several offerings; students choose 4 primary + 2 alternate courses; billing system notified once registered; add/drop for a period; professors set preferred offerings and get rosters; users have passwords for logon. Slides ask “what kind of diagram is this?” for (1) a <b>use case diagram</b> (Student: Register for Courses; Professor: Set Course Offerings, Get Class Rosters; Registrar: Maintain Professor Information, Maintain Semester Catalog, Close Registration; actors Course Catalog and Billing System), (2) an <b>activity diagram with swimlanes</b> (Professor, Registrar, Student, Bursar), (3) a <b>class diagram</b> (Registrar, Student, Bill, SemesterCourseOfferings, StudentSchedule, Section, Professor, BillSystem, Roster – “Where are actors?”).</div>\n<div class=\"box\"><b>Review questions on the slides:</b> How do business actors, business workers and (software) actors work together? How do business use cases relate to system use cases / business class diagrams to system use diagrams / business use cases to business sequence diagrams? <b>True or False: “Actors can be associated only with use cases, classes or components, but not with other actors.”</b> (Expected answer: False – actors can be related to other actors, e.g., by generalization; confirm against the slide.) Also “What notations and where?” – a grid of Of/By/For × Functional/NF × Process/Product × Problem/Solution; “How is an ERD different from a UML class diagram?”</div>\n<h3>7.5 Conventional techniques &amp; appendix items</h3>\n<ul><li><b>Conventional:</b> SADT, IDEF (see <a href=\"#sa\">Section 8</a>), <b>ERD</b> (database normalization view).</li>\n<li><b>Unified Process (Larman p. 81):</b> domain model ← use-case model → design model; “Is this D, R or S?” exercise.</li>\n<li><b>CLSS (Conveyor Line Sorting System, Pressman):</b> boxes on a slow conveyor, random order, evenly spaced, identified by ID number + bar code and shunted into one of 6 bins; a desktop computer at the sorting station runs all software, reads bar codes, acquires conveyor speed, stores part numbers, produces reports/diagnostics, sends control signals to shunting hardware, talks to the factory automation system. Slides then show its <b>deployment diagram</b> (CLSS processor; sorting, sensor-data-acquisition and shunt-controller subsystems; operator display; bar-code reader, pulse tach, shunt actuator), <b>activity diagram</b> (start line, read bar code, get speed, valid/invalid code, determine bin or set reject bin, send shunt data, get status, report entry) and <b>class diagram</b> for Box (attributes barcode, forwardSpeed, conveyorLocation, height, width, depth, weight, contents; operations readBarcode(), updateSpeed(), readSpeed(), updateLocation(), readLocation(), getDimensions(), getWeight(), checkContents()).</li>\n<li>Agile-modeling examples: activity diagram “submitting expenses”; sequence diagram “student application”; state machine “seminar lifecycle” at top/intermediate/lower levels. “For process or product?” question. <b>Use cases allocated to design subsystems</b> with &lt;&lt;trace&gt;&gt;.</li>\n<li><b>SOA view (OASIS SOA-RM “service as business view”):</b> viewpoint, stakeholders/participants, needs and capabilities, social structure, shared state and social facts, roles, governance. Questions: “How would you model a workflow?” “What is the role of the machine in the social phenomenon?” <b>Agents:</b> UML has business actors, business workers, (system) actors; a goal-oriented approach relates S, R.</li></ul>\n\n<h2 id=\"sa\">8. Structured analysis: DFD, SADT, IDEF0 <span class=\"tag\">Structured-Analysis deck + IDEF0 process-spec slide</span></h2>\n<p><b>Types of requirements along views:</b> FRs (structural: <i>function-oriented</i> and <i>information-oriented</i>; behavioral) and NFRs. <b>Function-oriented problem analysis</b> builds a <i>hierarchy of functions</i> (aka process, activity, work-step, transaction, transform, bubble); root = most abstract, leaves = most detailed; most methods use data-flow diagrams and dictionaries (SRD, SADT, Information Engineering, Modern Structured Analysis, Problem Statement Language).</p>\n<h3 id=\"dfd\">8.1 Data-flow diagrams</h3>\n<div class=\"def\">A <b>DFD</b> depicts the flow of data through a system and the work/processing performed by it; popular for business-process redesign; predates computers. <b>Icons:</b> data on the move = named <b>arrows</b> (dataflows); transformations = named <b>bubbles</b> (processes); sources/destinations = named <b>rectangles</b> (external entities/terminators); data at rest = <b>two parallel lines</b> (data store/file). Notations: Yourdon–Coad vs Gane–Sarson.</div>\n<ul><li><b>Layers:</b> draw the <b>context diagram</b> first (Level 0 – a single “process 0” for the whole system and the external entities); level-1 shows main processes; each can be exploded until pseudocode. Slides: Context diagram – Registration; Level 0 DFD; explosion of Process 4.</li>\n<li><b>Rules:</b> names must be unique; <b>not a flowchart</b> – no order implied; no logical decisions; don’t get bogged down. <b>Leveling/balancing:</b> preserve the number of inputs and outputs between levels (I1, I2, O1 on parent = on children).</li>\n<li><b>DFD vs flowchart:</b> DFD processes can run in parallel / flowchart one at a time; DFD shows flow of <i>data</i> / flowchart flow of <i>control</i>; DFD processes may have very different timing / flowchart is a single program with consistent timing.</li>\n<li>Homework slide: draw a DFD for an ATM. “Illegal data flows” slide: e.g., flows directly between two data stores or two external entities, processes with only inputs (black hole) or only outputs (miracle).</li></ul>\n<h3 id=\"senglish\">8.2 Structured English, decision tables, data dictionary</h3>\n<ul><li><b>Structured English</b> = structured-programming constructs + natural English for the logic of elementary processes. Constructs: <b>sequence</b>; <b>simple condition</b> (If/Then/Else/End If); <b>complex condition</b> (Case 1…n); <b>multiple conditions</b> → use a <b>decision table</b>; <b>one-to-many iteration</b> (Repeat…until; body executes at least once); <b>zero-to-many iteration</b> (Do While / For; may execute zero times).</li>\n<li><b>Decision table:</b> rows = condition stubs and action stubs; columns = rules (condition entries, action entries).\n<div class=\"ex\"><b>Slide example – book-order discounts:</b> conditions: customer is bookstore? / order size &gt; 6 copies? / customer is librarian or individual? / 50 or more copies / 20–49 / 6–19. Actions: allow 25%, 15%, 10%, 5% or 0% discount (Struct slide 20).</div></li>\n<li><b>Structured English example (slide 22):</b> for each CUSTOMER NUMBER in CUSTOMERS, for each matching LOAN keep running totals (number of loans, original principal, current balance, amounts past due); if total past due &gt; $100.00 write the customer’s data to the data flow LOANS AT RISK, else exclude.</li>\n<li><b>Data dictionary</b> (augments DFDs; repository): name, alias, description/purpose, related data items, range of values, data flows, data-structure definition.</li>\n<li><b>Data-structure notation:</b> <code>=</code> “consists of/is composed of” · <code>+</code> and (sequence) · <code>[a, b]</code> selection (either/or) · <code>{…}</code> repetition (<code>1{…}N</code> = 1 to N) · <code>(…)</code> optional.\n<div class=\"ex\"><b>ORDER example (slide 25):</b> <code>ORDER = ORDER NUMBER + ORDER DATE + [PERSONAL CUSTOMER NUMBER, CORPORATE ACCOUNT NUMBER] + SHIPPING ADDRESS=ADDRESS + (BILLING ADDRESS=ADDRESS) + 1{PRODUCT NUMBER + PRODUCT DESCRIPTION + QUANTITY ORDERED + PRODUCT PRICE + PRODUCT PRICE SOURCE + EXTENDED PRICE}N + SUM OF EXTENDED PRICES + PREPAID AMOUNT + (CREDIT CARD NUMBER + EXPIRATION DATE) + (QUOTE NUMBER)</code>; <code>ADDRESS = (POST OFFICE BOX NUMBER) + STREET ADDRESS + CITY + [STATE, MUNICIPALITY] + (COUNTRY) + POSTAL CODE</code>.</div></li></ul>\n<h3 id=\"idef\">8.3 SADT and IDEF0</h3>\n<ul><li><b>SADT</b> (Structured Analysis and Design Technique): since the mid-1970s; inspiration for many tools; trademark of SofTech; “system” = any enterprise/organization (physical, manufacturing, software). <b>Context analysis</b> includes <b>technical</b> assessment (is the architecture realizable?), <b>operational</b> assessment (can it do task X in under a week?), <b>economic</b> assessment (can it be built for $20M, 1000 SEs, 2 years?).</li>\n<li><b>Arrow semantics in an actigram:</b> <b>Inputs</b> are consumed/transformed; <b>Outputs</b> are produced; <b>Controls</b> influence execution but are <i>not</i> consumed; <b>Mechanism</b> = the processor (machine, computer, person) that makes the activity happen. In a <b>datagram</b>: inputs = activities that produce the data; outputs = activities that consume it; controls influence the data’s internal state; mechanism = device for storage/representation.</li>\n<li><b>IDEF0</b> (Integration Definition for Function Modeling): released <b>Dec 1993</b>; “reference model” for system/enterprise function modeling and software-process modeling; a <b>FIPS</b> maintained by <b>NIST</b>; based on <b>ICAM</b> (US Air Force Wright Aeronautical Labs); closely resembles SADT actigrams; IDEF1X = ERD + generalization/specialization. <b>Stringent graphic rules:</b> rectangular boxes with square corners, solid lines; arrows bend only with 90° arcs, drawn vertically/horizontally, never diagonally.</li>\n<li>An IDEF0 <b>model</b> = activities and information within a particular <b>Context</b>, consistent <b>Viewpoint</b>, for a <b>Purpose</b>; a series of diagrams decomposing a subject; foundation for requirements specification, design, programming. <b>Context</b> = boundaries; <b>Viewpoint</b> = bias/perspective; <b>Purpose</b> = reason for the model.</li></ul>\n<table><tr><th>Arrow side</th><th>ICOM</th><th>Meaning</th></tr><tr><td>Left</td><td><b>I</b>nput</td><td>Real object/data needed or transformed</td></tr><tr><td>Top</td><td><b>C</b>ontrol</td><td>Governs/determines outputs (policies, standards)</td></tr><tr><td>Right</td><td><b>O</b>utput</td><td>Produced result</td></tr><tr><td>Bottom</td><td><b>M</b>echanism</td><td>Person, device or data that carries out the function</td></tr></table>\n<ul><li><b>Labels:</b> function labels = <b>verbs/verb phrases</b> in the box; arrow labels = <b>nouns/noun phrases</b>. First diagram has one box (<b>A-0</b>, bounds the context), then <b>A0</b>; <b>every diagram has a minimum of 3 and maximum of 6 boxes</b>. Boxes numbered A1…A6; children of A3 = A31, A32, …</li>\n<li><b>Arrow relations:</b> <b>branching</b> (split – an output feeds two functions simultaneously or sequentially; labels needed to say how), <b>joining</b>, <b>feedback</b> (output to control or input of an upstream function; e.g., design review comments), output to <b>mechanism</b>. <b>Bundling/unbundling</b>: Files = Customer Records + Price &amp; Tax Tables; Account Entries = Transaction Entries + Billing Entries; PCB assembly: Process Plan = loading details + solder-paste details + chip-placement method; Assembly Records = soldering-completed data + placement-completed data.</li>\n<li><b>Decomposition:</b> parent/child hierarchy; children are more detailed; data consistency required level-by-level. <b>Tunneled arrows</b> – “(…)” ends: at a <i>connected</i> end the concept does not appear on the next lower level; at an <i>unconnected</i> end it does not appear on the next higher level (e.g., control C3 not on the child diagram, an output not shown on the parent).</li>\n<li><b>Steps to build a model:</b> (1) define viewpoint, purpose and context; (2) develop the context diagram; (3) decompose activities to fit the scope; (4) develop a glossary.</li></ul>\n<div class=\"ex\"><b>Slide examples:</b> <b>ABC Co. “Acquire Materials”</b> context diagram (A-0/A0: inputs stock levels, rejected materials, payments; controls inventory policy, purchase policy; vendor) decomposed into A1 Check Stock Levels &amp; Determine Reorder Qty → A2 Prepare Purchase Order, Authorize &amp; Mail → A3 Receive PO, Produce &amp; Ship (vendor) → A4 Receive Material Shipment &amp; Inspect → A5 Restock &amp; Make Payment (Struct 67–68). <b>Generic IDEF0</b>: A1 Establish Understanding of Customer Requirements, A2 Design System, A3 Build Product (Struct 42). <b>Feature-extraction module</b> model: purpose = understand tasks in planning/implementing the module; context = CAD formats, process-planning requirements and resources known, built from existing resources; viewpoint = industrial/manufacturing engineer with software design background (Struct 69).</div>\n<h4>IDEF0 as a process specification (the example slide)</h4>\n<p>The “IDEF0-Process-Spec” slide shows the form your <b>Process Spec</b> should take: one box <b>“Develop Requirements”</b> with <b>input</b> User, <b>control</b> Templates/standards, <b>mechanism</b> RE-Tools, and <b>outputs</b> WRS doc and Vision doc; decomposed into <b>“Develop Phase I”</b> and <b>“Develop Phase II”</b>.</p>\n<svg viewbox=\"0 0 560 230\" role=\"img\" aria-label=\"IDEF0 Develop Requirements\"><rect class=\"b\" x=\"190\" y=\"70\" width=\"180\" height=\"80\" rx=\"0\"></rect><text x=\"280\" y=\"105\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\">Develop</text><text x=\"280\" y=\"125\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\">Requirements</text><text x=\"355\" y=\"144\" font-size=\"11\" text-anchor=\"end\">A0</text>\n<path class=\"l\" d=\"M60 110 H190\"></path><path class=\"l\" d=\"M180 105 L190 110 L180 115\"></path><text x=\"125\" y=\"102\" text-anchor=\"middle\" font-size=\"13\">User</text>\n<path class=\"l\" d=\"M280 20 V70\"></path><path class=\"l\" d=\"M275 60 L280 70 L285 60\"></path><text x=\"280\" y=\"16\" text-anchor=\"middle\" font-size=\"13\">Templates / standards</text>\n<path class=\"l\" d=\"M280 210 V150\"></path><path class=\"l\" d=\"M275 160 L280 150 L285 160\"></path><text x=\"280\" y=\"224\" text-anchor=\"middle\" font-size=\"13\">RE-Tools</text>\n<path class=\"l\" d=\"M370 95 H500\"></path><path class=\"l\" d=\"M490 90 L500 95 L490 100\"></path><text x=\"440\" y=\"88\" text-anchor=\"middle\" font-size=\"13\">WRS doc</text>\n<path class=\"l\" d=\"M370 125 H500\"></path><path class=\"l\" d=\"M490 120 L500 125 L490 130\"></path><text x=\"440\" y=\"142\" text-anchor=\"middle\" font-size=\"13\">Vision doc</text></svg>\n<div class=\"box\"><b>Link to the project:</b> Final Project II asks for a Process Spec “using notations” – this IDEF0 form is the template shown in class; decompose with 3–6 boxes (e.g., Develop Phase I, Develop Phase II, …) and keep ICOMs consistent between parent and child.</div>\n\n<h2 id=\"gore\">9. GORE: classical-logic approach &amp; traceability <span class=\"tag\">GORE-classical deck</span></h2>\n<ul><li><b>Why GORE? Completeness – reference-model perspective</b> (Zave &amp; Jackson, “Four Dark Corners of RE”, TOSEM 1997): if five criteria hold, RE is complete in the strongest sense. <b>Requirements are complete if sufficient to establish the goal they refine</b> (Yue 1987).</li>\n<li><b>Teleology</b> (Greek <i>telos</i> = end, purpose): the study of design and purpose; a teleological view holds all things are directed toward a final result – the philosophical root of <i>goal</i>-oriented RE.</li>\n<li>GORE = <i>interleaving, iterative</i> elicitation of goals (“Where is the use case diagram?” – goals precede use cases).</li>\n<li><b>Classical logic (Horn clause / Prolog style):</b> <code>H :- B1, …, Bn.</code> – to show/solve H, show/solve B1 and … and Bn (goal reduction as AND-refinement). Slide example: <code>sibling(X,Y) :- parent(Z,X), parent(Z,Y).</code> · <code>parent(X,Y) :- father(X,Y).</code> · <code>parent(X,Y) :- mother(X,Y).</code> (two clauses for <i>parent</i> = OR-alternatives).</li></ul>\n<h3>Traceability</h3>\n<ul><li><b>Forward traceability</b> – from a requirement to the work products that satisfy it (design, code, tests); <b>backward traceability</b> – from a work product/requirement back to its origin (stakeholder need, goal). Slide questions: “What would be forward/backward traceability?” “Traceability matrix vs graph-oriented traceability?” “Eliminate, rewrite or correct traceability?”</li>\n<li><b>Requirements Traceability Matrix (RTM):</b> created by associating requirements with the work products that satisfy them; tests are associated with the requirements they are based on and the product tested to meet them. Slides show a sample matrix and variations (school-district and USDA-FNS forms).</li>\n<li>Evolution is inevitable – traceability is a virtue (NFR deck).</li></ul>\n\n<h2 id=\"kaos\">10. KAOS (goal-oriented RE) <span class=\"tag\">KAOS-AORE deck</span></h2>\n<ul><li>[Dardenne, van Lamsweerde, Fickas 1993]; early 90s; <b>first major teleological requirements-modeling language</b>; tool support; industrial case studies. <b>Two parts:</b> a <b>semi-formal goal-structuring model</b> and <b>formal definitions in (linear) temporal logic</b>.</li>\n<li><b>Goal patterns:</b> <b>Achieve</b> (liveness) <code>P → ◊Q</code> (eventually); <b>Maintain</b> (safety/“always”) <code>□(P → Q)</code>; <b>Avoid</b> <code>□(P → ¬Q)</code>. □ = necessarily/always, ◊ = possibly/eventually. Prior’s tense logic (appendix): <code>Pp</code> (was), <code>Fp</code> (will), <code>Hp</code> (always in the past), <code>Gp</code> (always in the future); extensions <i>Since</i> and <i>Until</i>.</li>\n<li><b>Method (goal elaboration):</b> define initial high-level goals and the objects they refer to; define initial agents and their capabilities; then iterate: <b>refine goals by AND/OR decomposition</b>; identify <b>obstacles</b> and <b>conflicts</b>; <b>operationalize</b> goals into constraints (software requirements) assignable to individual agents; refine/formalize object and action definitions. <b>Stop</b> when every subgoal is <b>realizable by an individual agent</b> – expressible in conditions the agent can <i>monitor</i> and <i>control</i>.</li></ul>\n<table><tr><th>Term</th><th>Definition</th></tr>\n<tr><td><b>Goal</b></td><td>Prescriptive statement of intent about the system (existing or to-be) whose satisfaction needs cooperation of some agents (software + environment)</td></tr>\n<tr><td><b>Domain property</b></td><td>Descriptive statement about the environment (physical laws, organizational norms)</td></tr>\n<tr><td><b>Requirement</b></td><td>Realizable goal under responsibility of an agent in the <b>software-to-be</b> (monitored/controlled objects)</td></tr>\n<tr><td><b>Expectation</b> (assumption)</td><td>Realizable goal under responsibility of an agent in the <b>environment</b>; cannot be enforced by software</td></tr>\n<tr><td><b>Operation</b></td><td>Input–output relation over objects</td></tr>\n<tr><td><b>Object model</b></td><td>State of the system = aggregation of object states; shown as a UML class diagram</td></tr></table>\n<div class=\"box\"><b>Symbols on KAOS slides 3–6:</b> □ = necessary (always), ◊ = possible (eventually), e.g. □Fp, ◊Fp (slide 3 side box). Goals (Achieve/Maintain/Avoid[…]) are slanted boxes; softgoals are clouds; AND/OR refinement arrows; an X between two goals = conflict; <i>why?</i> goes up, <i>how?</i> goes down; agents carry “Resp” links to leaf goals; the object model is a UML class diagram. Your notes mention a “dog-eared rectangle” – I could not identify it from the file, so check it on your slide.</div>\n<div class=\"box\">Both requirements and expectations are <i>optative</i>; requirements are enforced by the <b>software</b>, expectations only by <b>environment agents</b>. Satisfaction relations: R, As, S, Ac, G (requirements, assumptions/expectations, specifications, accuracy goals, goals).</div>\n<div class=\"ex\"><b>Automated Train Control example</b> (van Lamsweerde, ICSE 2000): object model; <b>WHY</b> questions elicit higher-level/new goals and softgoals; <b>HOW</b> questions elicit refinements down to formalizable goals; agent interfaces (monitored/controlled variables); <i>Maintain[SafeCmdMsg]</i>, worst-case stopping distance; <b>operationalization</b> via domain pre- and postconditions – strengthen conditions so linked goals are ensured; for software agents this yields requirements on operations. <b>Conflicting goals:</b> a <b>boundary condition</b> shows logical inconsistency; resolution e.g. <b>keep the safety goal and weaken the other</b>.</div>\n\n<h2 id=\"istar\">11. i* (agent-oriented RE) <span class=\"tag\">KAOS-AORE deck</span></h2>\n<ul><li>Hammer, “Reengineering Work: <i>Don’t Automate, Obliterate</i>” (HBR 1990): is the system to be built per the SRS going to be helpful or harmful? how do we come up with the SRS? – motivates modeling the <b>organizational context</b>.</li>\n<li><b>i*</b> – early 90s (Yu); gives structure to asking <b>“why?”</b> in RE; models organizational context of information systems; based on the <b>intentional actor</b>.</li>\n<li><b>Strategic Dependency (SD) model</b> – relationships <i>between</i> actors: <b>goal/softgoal dependency</b> (actor depends on another to attain a goal), <b>resource dependency</b> (needs a resource), <b>task dependency</b> (needs another to carry out a task).</li>\n<li><b>Strategic Rationale (SR) model</b> – concerns and interests <i>inside</i> actors: task decompositions; <b>means-ends</b> links between tasks and goals.</li>\n<li>Slide question: “Can you represent this in UML?” (UML has actors but no native intentional dependencies.) <b>GORE (KAOS)</b> focuses on goals; <b>AORE (i*)</b> on agents/actors and their dependencies.</li></ul>\n\n<h2 id=\"nfr\">12. Non-functional requirements &amp; the NFR Framework <span class=\"tag\">NFR-18 / NFR-4-on-1</span></h2>\n<h3 id=\"nfr-what\">12.1 What are NFRs? Why?</h3>\n<ul><li><b>Why:</b> concerns like quality drive just about everything – brochures sell <i>qualities</i> (luxury, safety, ease of use, security) not basic function (cars, cell phones, home networking, CASE tools). Soft is harder than hard.</li>\n<li><b>Colloquially</b> “-ilities” (understandability, usability, modifiability, interoperability, reliability, portability, maintainability, scalability, traceability…), “-ities” (security, simplicity, integrity, safety, modularity…), “-ness” (user-friendliness, robustness, timeliness, responsiveness, correctness…), plus performance, efficiency, accuracy, cost, time-to-market, etc. They are <b>soft: subjective, ambiguous, conflicting, global</b>.</li>\n<li><b>IEEE definition:</b> a software requirement describing not <i>what</i> the software will do but <i>how</i> it will do it – performance, external interface requirements, design constraints, quality attributes; <b>difficult to test, so usually evaluated subjectively</b>. Generally: informally stated, often contradictory, difficult to enforce during development and evaluate before delivery.</li></ul>\n<h3>12.2 Classification schemes</h3>\n<table><tr><th>#</th><th>Scheme</th><th>Categories</th></tr>\n<tr><td>1</td><td>Roman 1985</td><td>Interface, performance (time/space bounds, reliability, security, survivability), operating, lifecycle, economic, political requirements</td></tr>\n<tr><td>2</td><td>Sommerville 1992</td><td>Process, product and external considerations</td></tr>\n<tr><td>3</td><td>McCall’s list</td><td>3 classes + 3 levels (product operation, revision, transition)</td></tr>\n<tr><td>4</td><td>Grady 1992 – <b>FURPS+</b></td><td><b>F</b>unctionality, <b>U</b>sability, <b>R</b>eliability, <b>P</b>erformance, <b>S</b>upportability (+ testability, extensibility, adaptability, maintainability, compatibility, configurability, serviceability, installability, localizability, robustness)</td></tr>\n<tr><td>5</td><td>Boehm 1976 <b>Software Quality Tree</b></td><td>2 classes (as-is utility, maintainability, portability) + 3 levels (e.g., reliability → accuracy, completeness, robustness/integrity, consistency; efficiency; human engineering; testability, understandability, modifiability)</td></tr>\n<tr><td>6</td><td>Brugge – design-goal relationships</td><td>Client vs end user vs developer/maintainer concerns (low cost, usability, runtime efficiency, portability, modifiability…)</td></tr></table>\n<p>Classification “is supposed to bring order into chaos, but…” – NFRs remain subjective in both definitions and solutions.</p>\n<h3>12.3 Four essential properties of NFRs (“what”)</h3>\n<div class=\"def\"><b>Non-functional, subjective, graded, interacting – and relative</b> (in both definitions <i>and</i> solutions).\n<ul><li><b>Subjective:</b> “security” – protection of data alone fine with Chris; plus availability fine with Pat; plus accuracy – Alex; plus virus filtering – Neo; plus blocking adware – Gail. Solutions too: password (Chris) → + periodic change (Pat) → + fingerprint (Alex) → fingerprint rechecked hourly (Neo) → + co-presence of two people (Gail).</li>\n<li><b>Graded:</b> worse↔better, expensive↔cheaper, slower↔faster; e.g., “protection of data alone” ≪ “protection + availability”; password ≪ password + fingerprint.</li>\n<li><b>Interacting:</b> <b>conflicting</b> (the whole is less than the sum of its parts – password + hourly fingerprint is good for security but hurts ease-of-use) or <b>synergistic</b> (the whole is more than the sum – restricted access helps data accuracy; simplicity is key to ease-of-use).</li>\n<li><b>Relative priorities:</b> varies among stakeholders and contexts (security vs performance vs reliability vs usability vs safety).</li></ul></div>\n<p><b>Mathematical perspective:</b> a function composes: <code>f(x,y) = f1(f2(x), f3(y))</code> (e.g., sum: R×R→R). A non-functional property composes <i>globally</i> and non-additively: <code>nf(x,y) = nf1(nf2(x), nf3(y))</code> or with a normalizing <code>n(·)</code> – e.g., Fast(f), Fast(f2), Precise(f)…; “how fast can it be done?”, “how precise is the answer?”</p>\n<h3>12.4 NFRs and the RE process</h3>\n<ul><li>Quality of <b>product</b> and quality of <b>process</b>: garbage in, garbage out → get the right requirements <i>and</i> the right process. Where are NFRs in RE – before, after, or alongside FRs? (Answer implied: interleaved with goals, FRs, architecture, models.)</li>\n<li><b>Product-oriented</b> approaches: measure the system once built (metrics). <b>Process-oriented</b>: use NFRs to drive design decisions. <b>Quantitative</b>: measurable scales, calculate how much a design meets targets. <b>Qualitative</b>: relationships among quality goals, trade-off reasoning. Quotes: Sommerville – measurement as practised in other engineering is <i>impossible</i> for software; Deming – “the most important things can’t be measured”; Einstein – “Not everything that can be counted counts, and not everything that counts can be counted.”</li></ul>\n<h3 id=\"nfr-ind\">12.5 Individual NFRs</h3>\n<table><tr><th>NFR</th><th>Key points</th></tr>\n<tr><td><b>Reliability</b></td><td>Behave consistently in a user-acceptable manner. <b>MTTF</b> (mean time to failure), <b>MTTR</b> (to repair), <b>MTBF</b> = MTTF+MTTR; <b>Availability = MTTF / (MTTF + MTTR) × 100%</b>. Hardware “<b>bathtub curve</b>” (infant mortality → constant failure rate → wear &amp; tear) – issues: does software wear out? do two copies differ? Requirements like “no more than X bugs/1K LOC” need a way to count bugs: <b>bebugging</b> (Monte Carlo seeding): detected seeded / total seeded = detected real / total real → total bugs = seeded × detected / detected-seeded.</td></tr>\n<tr><td><b>Portability</b></td><td>Ease of converting software to another platform; e.g., # of target statements; improved by standardized languages/OSs/tools (C/C++/Java, J2EE/J2ME/.NET); hard to quantify.</td></tr>\n<tr><td><b>Efficiency</b></td><td>Use of scarce resources (CPU, memory, disk, buffers, channels). Dimensions: <b>capacity</b>, <b>degradation of service</b> (what happens at X+1 widgets – degrade or crash), <b>timing constraints</b> (stimulus–response, response–response, stimulus–stimulus, response–stimulus, e.g., dial tone within 10 s).</td></tr>\n<tr><td><b>Usability</b></td><td>Broadly: quality, fit to use; narrowly: good UI. Make it measurable: “95% of users complete tasks X, Y, Z in under 10 min without assistance; 80% task Y in 10 min; 77% task Z in 5 min.” <b>Usability inspection</b> and heuristics: Nielsen’s 9 / Molich–Nielsen’s 10 (simple natural dialogue; speak the user’s language; minimize memory load; consistency; feedback; clearly marked exits; shortcuts; precise and constructive error messages; prevent errors; help and documentation). Also promptness, tolerance, guidance, coherence.</td></tr>\n<tr><td><b>Dependability</b></td><td>Dimensions: <b>availability</b> (deliver services when requested), <b>reliability</b> (as specified), <b>safety</b> (no catastrophic failure), <b>security</b> (protect against accidental/deliberate intrusion). Costs of failure (direct: life, business; indirect: litigation, goodwill). Improve reliability through fault avoidance, detection/removal, tolerance. <b>Safety</b>: hazard identification, risk analysis, classification (<i>intolerable</i> / <i>ALARP</i> / <i>acceptable</i>), IEC 61508 life cycle; <b>fault tree</b> (deductive: start with the failure/hazard and work back to causes). <b>Security</b> threats: denial of service, corruption of programs/data, unauthorized disclosure.</td></tr></table>\n<h3 id=\"sig\">12.6 The NFR Framework (Chung, Nixon, Yu, Mylopoulos)</h3>\n<div class=\"def\"><b>Softgoal:</b> no clear-cut criterion for being met; NFRs are subjective, relative, interdependent; no optimal solution → <b>satisficing</b> (achieved within acceptable limits). One softgoal can contribute positively/negatively, fully/partially to others. The framework is <b>qualitative, process-oriented</b>; uses <b>Softgoal Interdependency Graphs (SIGs)</b>, a <b>labeling (evaluation) procedure</b>, and <b>catalogues</b> (like design patterns) for NFR knowledge and correlations. NFRs are the basis for exploring alternatives and the criteria for selecting among them (rationalization).</div>\n<table><tr><th>Element</th><th>Details</th></tr>\n<tr><td>Softgoal types</td><td><b>NFR softgoal</b>; <b>operationalizing softgoal</b> (satisficing technique/solution – “cloud” with bold outline); <b>claim softgoal</b> (justification/argument supporting a choice, dashed cloud)</td></tr>\n<tr><td>Syntax</td><td>Softgoal ::= <b>Priority Type [Topic]</b> – e.g., <code>!!Accuracy[Account]</code>. Priority marks <b>!</b> (important), <b>!!</b> (very important); topic/parameter narrows scope (global → local), e.g., Security[Home Networking].</td></tr>\n<tr><td>Decomposition</td><td><b>AND</b> (all subgoals needed) and <b>OR</b> (alternatives). Three refinement kinds: refine <b>type</b>, refine <b>topic</b>, refine <b>priority</b>; plus <b>operationalize</b>.</td></tr>\n<tr><td>Contributions</td><td><b>Make (++) &gt; Help (+) &gt; Hurt (−) &gt; Break (−−)</b> – plus “U” (undetermined) when unknown.</td></tr>\n<tr><td>Labels (evaluation)</td><td><b>satisficed (✓), denied (✗), conflicting, undetermined</b>; propagated bottom-up through AND/OR and contributions; the result tells whether top-level softgoals are satisficed. Priorities can be used (quantitative variant on NFR-18 slide 64: numeric values −1…1, priorities !!, !).</td></tr>\n<tr><td>Semantics</td><td>Proposition = softgoal ∪ contribution. <code>If satisficed(HELP(G0,G1)) then ∃ propositions G2…Gn such that …</code>; <code>Und(G0,G1) = MAKE ∨ HELP ∨ HURT ∨ BREAK</code>.</td></tr></table>\n<div class=\"ex\"><b>Construction process (iterative, interleaving):</b> post NFR softgoals → refine them until meaning is clear (type, topic list, priority) → operationalize → refine operationalizing softgoals until all parts and relationships are designed (“one person’s floor is another person’s ceiling”) → justify with claim softgoals → evaluate satisficing degree.</div>\n<div class=\"ex\"><b>Worked slide examples:</b> <b>Security</b> → Integrity, Confidentiality, Availability; <b>Authentication</b> → password / fingerprint / password+fingerprint; <b>Performance</b> → Time-P, Space-P, Responsiveness → indexing (single-level, multi-level; keyword-based, category-based). <b>Home networking</b> (HACS): security of garage door, home networking, home security controller; lighting fixed vs variable; claim “no reported break-in incidents due to fixed lighting” (NFR-18 59–65). <b>Accounts example</b> (NFR-18 45–47): Secure Accounts → Availability, Integrity (Accuracy/Completeness), Confidentiality of Accounts; topics Regular/Gold/Premier account, highSpending, history; operationalizations Validation and Auditing; claims “one of the vital few”, “policy of rigorous examination on high spending”; agents (class-I secretary, supervisor, manager, auditor) as topics.</div>\n<h3>12.7 Knowledge reuse, reference model, Dos &amp; Don’ts</h3>\n<ul><li><b>Catalogues &amp; correlation rules</b> (NFR-18 69): e.g., Security [weaponry-info] → Integrity/Confidentiality/Availability; Authentication, Fingerprint verification; claims (“MIL Std”, “common practice”; fingerprinting can feel like criminal treatment or like VIP treatment) vs User-friendliness.</li>\n<li><b>NFR Framework + reference model (NFR-18 71–77):</b> <b>Patient monitoring example</b> – D1: a nurse is always close enough to hear a buzzer; D2: sound from the heart falling below a threshold means the heart is (about to) stop; S1: if sensor sound falls below the threshold, actuate buzzer; R1: a warning system notifies the nurse if the heartbeat (is about to) stop; C: microphone as sensor, buzzer as actuator. Goals: G01 best-quality patient care; G02 best-quality monitoring of heart failure; softgoals: low-cost, low-maintenance, easily configurable, proven (warning system); fast (notification); well qualified nurse; clear sound; safe &amp; secure but loud enough buzzer. Alternatives R1′ buzzer vs R1″ beeper. Designation categories: eh (environment-hidden: nurse, heartbeat), ev (visible: sounds from chest), sv (system-visible: buzzer), sh (system-hidden: internal data). Slide 77 continues to <b>architecture</b> (functional components monitor → determine → control sound; stylistic components).</li>\n<li><b>Dos:</b> relate to FRs; clarify scope/topic; identify agents; relate definitions of NFRs to each other and solutions to each other; refine definitions and solutions as many times as needed; prioritize; discover and safeguard against conflicts; discover synergies; discover operationalizations as reasons for conflicts/synergies; determine and justify strengths of contributions; explore alternatives; consider multiple solutions and scenarios; quantify if necessary; evaluate (subjectively/objectively); establish traceability.</li>\n<li><b>Don’ts:</b> absolute security/reliability/safety; “one definition fits all / one solution solves all”; “the contribution is such and such because I say so”; refine only once; dissociate from FRs; “they fall from the sky”; “no quantification, no existence”; “everybody needs the same”; “you name it, our system does it”. NFRs may be more important than FRs but should consume fewer resources.</li>\n<li><b>Conflict-resolution walk-through (NFR-18 80–83):</b> email with zip attachment. Attempted resolutions: delete the email → misunderstanding between sender/receiver → move to junk folder → receiver may not check → notify receiver → notify sender too → still an attack when opened → delete and block the sender / allow only allowed senders / delete only the attachment. Formalized: <code>Security[PC] → S[email] → S[sender] ∧ S[recipient] ∧ S[body] ∧ S[attachment]</code>; Denied(S[attachment]) → Denied(S[email]) → Denied(S[PC]) (label propagation upward).</li></ul>\n<h3 id=\"nfr-tmpl\">12.8 Where NFRs go: RUP Vision, Volere, UML</h3>\n<ul><li><b>Where:</b> RE, system/software architecting, design, implementation, V&amp;V, testing, maintenance, project planning, configuration management, decision making. <b>How to represent:</b> informal → tabular → visual; a template row: Name, Description, Type, Topic, Agent, Viewpoint, Priority, Affected NFRs, Affecting NFRs/Operationalizations, Claim.</li>\n<li><b>RUP Vision (Home Appliance Control System, HACS v1.2):</b> NFRs live in §6 Constraints – 6.1 Security (authentication by ID+password; encryption of transmissions; Homeowner/Business Owner can monitor &amp; change, Customer-Care users can only monitor and place a medical-alert request), 6.2 Usability (easy; emergency request by push button/voice), 6.3 Responsiveness (2 s average local, 4 s remote), 6.4 Capacity (max sequences)…</li>\n<li><b>Volere template</b> (Atlantic Systems Guild): project drivers (1–3), constraints (4–7), functional (8–9), <b>NFR sections 10–17: 10 Look &amp; Feel, 11 Usability &amp; Humanity (ease of use, personalization/internationalization, ease of learning, understandability/politeness), 12 Performance (speed/latency, safety-critical, precision, reliability &amp; availability, capacity), 13 Operational (physical environment, technological environment, partner applications, productization), 14 Maintainability &amp; Support (maintenance, special conditions, supportability, adaptability), 15 Security (access, integrity, privacy, audit, immunity), 16 Cultural &amp; Political, 17 Legal (compliance, standards)</b>. Each requirement has content, motivation, examples, and a <b>fit criterion</b>.</li>\n<li><b>UML and NFRs:</b> UML is the de facto OOA standard but <b>FR-dominant</b>. Use-case template embeds NFRs as text in “special requirements” → problems (NFR-18 119): (1) NFRs not modeled/organized and not visual; (2) not traceable to architecture and design; (3) error-prone if an NFR applies to several use cases. Proposed: <b>NFR association points</b> – Actor–NFR, Actor–Use case association–NFR, Use case–NFR, System boundary–NFR associations, with <b>NFR goals</b> and propagation (Pricing System example: Submit Price Proposal, Approve Price Proposal, Update Bill of Material, Send RFP…). <b>Other integration schemes (NFR-4in1 p. 26):</b> Cysneiros (LEL text; SIG + class/ERD extensions), Lee (use cases for NFRs), Moreira (stereotyped unnamed use cases e.g. &lt;&lt;Security&gt;&gt;), Dimitrov (annotations; performance only) – none is use-case-driven, organizes NFRs, preserves use-case principles and is generic.</li></ul>\n\n<h2 id=\"sysml\">13. SysML (appendix to Enterprise Modeling)</h2>\n<ul><li>History: UML-for-SE RFP March 2003 (with INCOSE) → draft Jan 2004 → <b>v1.0 July 2006</b> (OMG) → v1.1 June 2008 → v1.2 June 2010.</li>\n<li>A graphical modeling language; a <b>UML profile</b> (subset of UML 2 + extensions) supporting specification, analysis, design, verification and validation of systems incl. <b>hardware, software, data, personnel, procedures, facilities</b>; model interchange via <b>XMI</b> and AP233; supports model-driven SE.</li>\n<li><b>New diagram types:</b> <b>Requirement diagram</b> and <b>Parametric diagram</b>. <b>Structure:</b> Block Definition Diagram (class-diagram-based, blocks instead of classes), Internal Block Diagram (composite-structure-based). <b>Activity diagram</b> extensions: continuous flow, control operators/disabling, EFFBDs.</li></ul>\n<h2 id=\"ex\">14. Professor-flagged slides only</h2>\n<p>Only the slides Dr. Chung flagged for Test 2 (from your OneNote summary). Identify slides by <b>title and picture</b>: numbers on his screen run about 4 higher than the PDF in the NFR deck.</p>\n<table><tr><th>Flagged item</th><th>What the slide shows</th><th>How to answer</th></tr>\n<tr><td><b>Elicitation 18</b> (“How to elicit?” – Recall)</td><td>Major themes: error detection &amp; removal; conceptuality vs formality (natural language → semi-formal → formal; defects ↑ at the informal end, ↓ at the formal end); completeness is sometimes “the” key issue; ontological primitives (goals, agents, decisions, rationale, entities, activities, constraints); organizational primitives (classes/metaclasses, associations/aggregations, superclasses/subclasses, views); definition of ontology</td><td>Completeness is hard, so use ontological primitives (goal-/agent-/object-orientation) to guide what to ask about.</td></tr>\n<tr><td><b>Elicitation 22</b> (Ethnomethodology – “Why is it difficult? A wicked problem”)</td><td>The “say-do” problem: people know how to do things but normally don’t describe them (tacit knowledge); descriptions may be highly inaccurate. “So, what should be done then? <b>List three examples</b>.”</td><td>Answer: observe people in their natural setting (ethnomethodology) and give three examples where it works well.</td></tr>\n<tr><td><b>Elicitation 23</b> (Data/information elicitation techniques)</td><td>Ethnomethodology = “people’s methods”; observation is sometimes the best way to understand how things are done; observe in a NATURAL setting; cycle plan ahead (like interviewing) → observe &amp; record → analyze. e.g. <b>stock brokerage</b> (multiple phone calls, computer), <b>HCI</b>. Caveats: ethical/legal issues if video-taping without notification; not natural if people know they are observed; can be time-consuming to analyze.</td><td>Three applications: stock brokerage, HCI, plus a third of your own where work is tacit and social (e.g. call centre / emergency dispatch, hospital ward or factory floor workflow). State the say-do reason.</td></tr>\n<tr><td><b>Enterprise: “S achieves R to solve P in D”</b> (True/False)</td><td>Reference model: D, S ⊨ R and R, D ⊨ G; S = specification, R = requirements, D = domain, P = problem (goals counter P)</td><td>True in the sense that the machine S, <i>operating in domain D</i>, achieves R, which solves P. Be careful: “S, D satisfies R” on its own was noted false by the professor, so read the exact wording (the formal relat
